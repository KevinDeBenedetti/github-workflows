# Daily Lighthouse CI check of chosen pages, one commit status per page — drop
# this file in .github/workflows/ and lighthouserc.json at the repository root
name: Lighthouse CI

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  lighthouse:
    # Pin to a release tag or commit SHA for reproducible runs.
    uses: KevinDeBenedetti/github-workflows/.github/workflows/perf-lighthouse.yml@v0.42.0 # x-release-please-version
    permissions:
      contents: read # the config, and the commit behind version-url
      statuses: write # one status per page
    with:
      site: https://example.com
      urls: /,/about
      config: lighthouserc.json
      artifact-retention-days: 7 # days the reports are kept (1 to 90)
      # Or no GitHub artifact at all, the reports in a private B2 bucket with a
      # lifecycle rule:
      # upload-artifact: false
      # report-s3-endpoint: https://s3.eu-central-003.backblazeb2.com
      # report-s3-bucket: my-perf-reports
    # secrets:
    #   report-s3-access-key-id: ${{ secrets.B2_KEY_ID }}
    #   report-s3-secret-access-key: ${{ secrets.B2_APPLICATION_KEY }}
