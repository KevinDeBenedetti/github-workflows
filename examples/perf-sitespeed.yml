# Daily Core Web Vitals monitoring — drop this file in .github/workflows/
# Needs perf/urls.txt (one URL per line) and perf/budget.json in your repo:
#   {"budget": {"googleWebVitals": {"largestContentfulPaint": 2500,
#               "cumulativeLayoutShift": 0.1, "totalBlockingTime": 300}}}
name: Perf

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  sitespeed:
    # Pin to a release tag or commit SHA for reproducible runs.
    uses: KevinDeBenedetti/github-workflows/.github/workflows/perf-sitespeed.yml@v0.42.0 # x-release-please-version
    # Caller permissions cap the called workflow: the history job needs write.
    permissions:
      contents: write
    with:
      device: both
      # The raw results (videos, screenshots, HAR files) go after a week: the
      # metrics stay in history.csv on the perf-history branch.
      artifact-retention-days: 7
      # Or no GitHub artifact at all, the results in a private B2 bucket with a
      # lifecycle rule (HAR files hold headers and cookies); the history still
      # works:
      # upload-artifact: false
      # report-s3-endpoint: https://s3.eu-central-003.backblazeb2.com
      # report-s3-bucket: my-perf-reports
    # secrets:
    #   report-s3-access-key-id: ${{ secrets.B2_KEY_ID }}
    #   report-s3-secret-access-key: ${{ secrets.B2_APPLICATION_KEY }}
