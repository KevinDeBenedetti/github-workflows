# Weekly Lighthouse audit of every page — drop this file in .github/workflows/
name: Lighthouse

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

jobs:
  unlighthouse:
    # Pin to a release tag or commit SHA for reproducible runs.
    uses: KevinDeBenedetti/github-workflows/.github/workflows/perf-unlighthouse.yml@v0.42.0 # x-release-please-version
    permissions:
      contents: read
    with:
      site: https://example.com
      budget: 80
      artifact-retention-days: 7 # days the HTML report is kept (1 to 90)
      # Or no GitHub artifact at all, the report in a private B2 bucket with a
      # lifecycle rule:
      # upload-artifact: false
      # report-s3-endpoint: https://s3.eu-central-003.backblazeb2.com
      # report-s3-bucket: my-perf-reports
    # secrets:
    #   report-s3-access-key-id: ${{ secrets.B2_KEY_ID }}
    #   report-s3-secret-access-key: ${{ secrets.B2_APPLICATION_KEY }}
