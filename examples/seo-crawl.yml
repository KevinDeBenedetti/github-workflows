# Weekly SEO crawl (broken links, redirects, tags) — drop this file in .github/workflows/
name: SEO

on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

jobs:
  seo:
    # Pin to a release tag or commit SHA for reproducible runs.
    uses: KevinDeBenedetti/github-workflows/.github/workflows/seo-crawl.yml@v0.42.0 # x-release-please-version
    permissions:
      contents: read
    with:
      site: https://example.com
      artifact-retention-days: 7 # days the reports are kept (1 to 90)
      # Or no GitHub artifact at all, when the pass/fail result is enough:
      # upload-artifact: false
