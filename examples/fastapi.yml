name: CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# Standalone — FastAPI à la racine
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-python.yml@v0.32.1 # x-release-please-version
    with:
      python-version: '3.12'

  deploy-production:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # A reusable workflow gets at most what its caller grants.
    permissions:
      contents: read
      packages: write      # push the image to GHCR
      deployments: write   # production/preview environment record
      id-token: write      # sign the image attestation (Sigstore)
      attestations: write  # store the attestation
    uses: KevinDeBenedetti/github-workflows/.github/workflows/cd-docker.yml@v0.32.1 # x-release-please-version
    with:
      context: .
      platforms: linux/amd64,linux/arm64

  release:
    needs: deploy-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/release.yml@v0.32.1 # x-release-please-version
    with:
      release-type: python
    # No token secret: release-please runs on GITHUB_TOKEN (enable "Allow
    # GitHub Actions to create and approve pull requests" in the repo settings).
    permissions:
      contents: write        # release branch, tags and releases
      issues: write          # release-please labels the release PR
      pull-requests: write   # open/update the release PR
