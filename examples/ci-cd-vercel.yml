name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: KevinDeBenedetti/github-workflows/.github/workflows/ci-node.yml@v0.29.0 # x-release-please-version
    with:
      node-version: '24'

  deploy-preview:
    needs: ci
    if: github.event_name == 'pull_request'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/cd-vercel.yml@v0.29.0 # x-release-please-version
    with:
      environment: preview
    # Only the secrets this workflow declares — never `secrets: inherit`.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-production:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/cd-vercel.yml@v0.29.0 # x-release-please-version
    with:
      environment: production
    # Only the secrets this workflow declares — never `secrets: inherit`.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  release:
    needs: deploy-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: KevinDeBenedetti/github-workflows/.github/workflows/release.yml@v0.29.0 # x-release-please-version
    # No token secret: release-please runs on GITHUB_TOKEN (enable "Allow
    # GitHub Actions to create and approve pull requests" in the repo settings).
    permissions:
      contents: write        # release branch, tags and releases
      issues: write          # release-please labels the release PR
      pull-requests: write   # open/update the release PR
