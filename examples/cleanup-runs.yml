# Weekly retention for this repository's workflow runs — drop this file in
# .github/workflows/. The retention policy lives in github-workflows
# (cleanup-runs.yml): old runs go with their logs and artifacts, the recent
# ones and the last runs of each workflow stay.
# Start in dry-run: run it once by hand from the Actions tab, read what the log
# says it would delete, then remove the dry-run line.
name: Cleanup workflow runs

on:
  schedule:
    - cron: "43 4 * * 1"  # Mondays, 04:43 UTC
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    # Pin to a release tag or commit SHA for reproducible runs.
    uses: KevinDeBenedetti/github-workflows/.github/workflows/cleanup-runs.yml@v0.37.0 # x-release-please-version
    # Caller permissions cap the called workflow: it deletes workflow runs.
    permissions:
      actions: write
      pull-requests: read
    with:
      dry-run: true
