name: CI — Node.js

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        required: false
        default: '24'
      working-directory:
        description: Path to the app (e.g. apps/web, or "." for standalone)
        type: string
        required: false
        default: '.'
      package-manager:
        description: '"pnpm" | "bun" | "npm" | "auto" (default — detects from lockfile)'
        type: string
        required: false
        default: auto
      framework:
        description: >
          Framework: "next" | "nuxt" | "vite" | "auto" (detected from the
          config files). Picks the build output path to upload and turns on
          the Next.js build cache.
        type: string
        required: false
        default: auto
      run-lint:
        description: Run lint script
        type: boolean
        required: false
        default: true
      run-typecheck:
        description: Run typecheck script
        type: boolean
        required: false
        default: true
      run-test:
        description: Run test suite
        type: boolean
        required: false
        default: true
      test-args:
        description: >
          Extra arguments appended to the test script (pnpm, npm and bun).
          The default suits Jest/Vitest, and bun receives it as its own
          `--pass-with-no-tests`; set it to '' for runners that reject
          unknown flags (e.g. `node --test`).
        type: string
        required: false
        default: --passWithNoTests
      run-build:
        description: Run build script
        type: boolean
        required: false
        default: true
      upload-build:
        description: Upload build output as artifact
        type: boolean
        required: false
        default: false
      build-artifact-name:
        description: Name for the uploaded build artifact
        type: string
        required: false
        default: build
      run-link-check:
        description: Check markdown files for broken relative links before building (offline, no HTTP requests)
        type: boolean
        required: false
        default: false
      link-check-paths:
        description: Space-separated paths or directories of markdown files to check
        type: string
        required: false
        default: 'docs/'
      runner:
        description: Runner labels as JSON — GitHub's (e.g. '"ubuntu-26.04"') or Ubicloud's (e.g. '"ubicloud-standard-2"')
        type: string
        required: false
        default: '"ubuntu-26.04"'
      timeout-minutes:
        description: >
          Minutes before the job is cancelled (GitHub's default is 360): a hung
          install, test or build is cut off instead of burning runner time.
        type: number
        required: false
        default: 30
    secrets:
      github-token:
        description: GitHub token passed as GITHUB_TOKEN env var to the build step (e.g. for scripts that call the GitHub API)
        required: false

  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: '24'
      working-directory:
        description: Path to the app (e.g. apps/web, or "." for standalone)
        type: string
        default: '.'
      package-manager:
        description: '"pnpm" | "bun" | "npm" | "auto" (default — detects from lockfile)'
        type: string
        default: auto
      framework:
        description: 'Hint for build output path: "next" | "nuxt" | "vite" | "auto"'
        type: string
        default: auto
      run-lint:
        description: Run lint script
        type: boolean
        default: true
      run-typecheck:
        description: Run typecheck script
        type: boolean
        default: true
      run-test:
        description: Run test suite
        type: boolean
        default: true
      test-args:
        description: Extra arguments appended to the test script (pnpm, npm and bun)
        type: string
        default: --passWithNoTests
      run-build:
        description: Run build script
        type: boolean
        default: true
      upload-build:
        description: Upload build output as artifact
        type: boolean
        default: false
      build-artifact-name:
        description: Name for the uploaded build artifact
        type: string
        default: build
      run-link-check:
        description: Check markdown files for broken relative links before building (offline, no HTTP requests)
        type: boolean
        default: false
      link-check-paths:
        description: Space-separated paths or directories of markdown files to check
        type: string
        default: 'docs/'
      runner:
        description: Runner labels as JSON — GitHub's (e.g. '"ubuntu-26.04"') or Ubicloud's (e.g. '"ubicloud-standard-2"')
        type: string
        default: '"ubuntu-26.04"'
      timeout-minutes:
        description: Minutes before the job is cancelled (GitHub's default is 360)
        type: number
        default: 30

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: ci-node-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ inputs.working-directory }})
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Setup resolves the package manager from the lockfile and the framework
      # from the config files, and outputs the matching commands.
      - name: Setup Node.js
        id: setup
        uses: $/.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          package-manager: ${{ inputs.package-manager }}
          framework: ${{ inputs.framework }}

      - name: Lint
        if: inputs.run-lint
        working-directory: ${{ inputs.working-directory }}
        env:
          RUN_CMD: ${{ steps.setup.outputs.run-command }}
        # RUN_CMD is "pnpm", "npm run" or "bun run": word-split on purpose.
        run: $RUN_CMD lint

      - name: Type check
        if: inputs.run-typecheck
        working-directory: ${{ inputs.working-directory }}
        env:
          RUN_CMD: ${{ steps.setup.outputs.run-command }}
        # RUN_CMD is "pnpm", "npm run" or "bun run": word-split on purpose.
        run: $RUN_CMD typecheck

      - name: Test
        if: inputs.run-test
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          PM: ${{ steps.setup.outputs.package-manager }}
          TEST_ARGS: ${{ inputs.test-args }}
        run: |
          # TEST_ARGS is intentionally word-split into separate arguments.
          # shellcheck disable=SC2086
          case "$PM" in
            bun)
              # bun test knows only the kebab-case spelling of the flag, and
              # fails on 0 test files without it; Jest and Vitest take both.
              args=()
              for arg in $TEST_ARGS; do
                [ "$arg" = --passWithNoTests ] && arg=--pass-with-no-tests
                args+=("$arg")
              done
              bun run test "${args[@]}"
              ;;
            npm) npm test -- $TEST_ARGS ;;
            *)   pnpm test $TEST_ARGS ;;
          esac

      - name: Check markdown links
        if: inputs.run-link-check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress ${{ inputs.link-check-paths }}
          fail: true
          # Markdown without a single link is not an error: lychee-action fails
          # on "no links found" by default, which ci-shell.yml opts out of too.
          failIfEmpty: false

      # Next.js keeps an incremental compiler cache in .next/cache. Deps are
      # already cached by setup-node; this restores the build cache so unchanged
      # routes/modules aren't recompiled. Keyed on the lockfile setup-node
      # resolved (the workspace root's in a monorepo) + commit sha so each run
      # saves a fresh entry, with restore-keys falling back to the most recent
      # cache for the same dependency set. No-op for non-Next frameworks.
      - name: Cache Next.js build
        if: inputs.run-build && steps.setup.outputs.framework == 'next'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles(steps.setup.outputs.lockfile) }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles(steps.setup.outputs.lockfile) }}-

      - name: Build
        if: inputs.run-build
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
          # Opt out of framework/tool telemetry so CI builds transmit nothing
          # (Next.js, Turbo, and the generic DO_NOT_TRACK convention). Harmless
          # for frameworks that don't read them.
          NEXT_TELEMETRY_DISABLED: '1'
          TURBO_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'
          RUN_CMD: ${{ steps.setup.outputs.run-command }}
        run: $RUN_CMD build

      - name: Upload build artifact
        if: inputs.upload-build && inputs.run-build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.build-artifact-name }}
          path: ${{ inputs.working-directory }}/${{ steps.setup.outputs.build-output }}
          retention-days: 1
          if-no-files-found: error
