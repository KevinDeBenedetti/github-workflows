name: Pre-release

# Pre-releases of a long-lived integration branch (dev) whose final releases
# ship from another branch through release.yml. Each call computes
# v<next>-<type>.<n> from the Conventional Commits since the last final tag
# vX.Y.Z (the prerelease action documents the rules); `publish: true` then
# creates the tag and a GitHub pre-release on the commit, never marked latest.
#
# A pipeline that bakes the version into its build calls this twice: once
# before the build to read the tag, once after a successful deploy to publish
# it. <n> is the number of commits since the last final tag, so the same
# commit always gets the same tag: the two calls agree, and concurrent runs
# never compete for a number.
#
# Why not release-please on that branch: it would track its own pre-release
# PRs there and, after each final release, keep counting from its last
# pre-release (0.23.0-rc.3 once 0.23.0 is out). release-please on the release
# branch is unaffected by these tags: it looks for the tag of its manifest
# version.

on:
  workflow_call:
    inputs:
      publish:
        description: Create the tag and the GitHub pre-release; false only computes it
        type: boolean
        required: false
        default: false
      tag:
        description: >-
          With publish, the tag an earlier call computed (outputs.tag), checked
          against this run's so what ships is what the build baked in. Empty:
          no check.
        type: string
        required: false
        default: ""
      prerelease-type:
        description: Pre-release identifier (v1.2.3-<type>.<n>)
        type: string
        required: false
        default: rc
      config-file:
        description: >-
          release-please config holding bump-minor-pre-major and
          bump-patch-for-minor-pre-major. Empty:
          .github/release/release-please-config.json, then
          release-please-config.json, else both off.
        type: string
        required: false
        default: ""
      runner:
        description: Runner labels as JSON — use '"ubuntu-26.04"' or '["self-hosted","linux","k3s"]'
        type: string
        required: false
        default: '"ubuntu-26.04"'
    outputs:
      releasable:
        description: true when a feat, fix, perf, revert or breaking change landed since the last final tag
        value: ${{ jobs.prerelease.outputs.releasable }}
      tag:
        description: The pre-release tag (e.g. v1.3.0-rc.7), empty when not releasable
        value: ${{ jobs.prerelease.outputs.tag }}
      version:
        description: The tag without its v (e.g. 1.3.0-rc.7), empty when not releasable
        value: ${{ jobs.prerelease.outputs.version }}
      base-tag:
        description: The last final tag the commit contains (e.g. v1.2.4), empty before the first release
        value: ${{ jobs.prerelease.outputs.base-tag }}

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

jobs:
  prerelease:
    name: ${{ inputs.publish && 'Publish the pre-release' || 'Compute the pre-release' }}
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 10
    # The job always asks for contents: write, which the caller must grant
    # even to a call that only computes: GitHub refuses a called job asking
    # for more than its caller grants. The token is used only to publish.
    permissions:
      contents: write # publish: create the tag and its GitHub pre-release
    outputs:
      releasable: ${{ steps.prerelease.outputs.releasable }}
      tag: ${{ steps.prerelease.outputs.tag }}
      version: ${{ steps.prerelease.outputs.version }}
      base-tag: ${{ steps.prerelease.outputs.base-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The last final tag and every commit since: the whole history.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Pre-release
        id: prerelease
        uses: $/.github/actions/prerelease
        with:
          mode: ${{ inputs.publish && 'publish' || 'plan' }}
          tag: ${{ inputs.tag }}
          prerelease-type: ${{ inputs.prerelease-type }}
          config-file: ${{ inputs.config-file }}
          github-token: ${{ github.token }}
