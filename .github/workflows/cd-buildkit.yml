name: Deploy — BuildKit (Docker Buildx)

# The image build of this repository's callers, for one platform: Docker
# Buildx drives BuildKit with the runner's Docker daemon, from a checkout of
# the triggering commit. The `runner` input takes any Linux VM runner that has
# Docker — GitHub's or Ubicloud's — and the image is built for that runner's
# native platform: pick an x86_64 runner for an x86_64 host.
#
# What it provides:
#   - Tags and OCI labels from actions/image-tags, the rules cd-docker.yml uses
#   - `digest` output (from the build metadata)
#   - BUILD_SECRETS secret (BuildKit secret mounts), provenance + SBOM inputs
#   - Layer cache in GHCR (<image>-cache:buildcache, mode=max)
#
# cd-docker.yml is the multi-platform build.

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name (e.g. my-api). Defaults to repo name.
        type: string
        required: false
        default: ''
      context:
        description: Docker build context path (relative to repo root)
        type: string
        required: false
        default: '.'
      dockerfile:
        description: Dockerfile path relative to context
        type: string
        required: false
        default: Dockerfile
      push:
        description: Push image to registry
        type: boolean
        required: false
        default: true
      target:
        description: Build target stage (e.g. dev, prod)
        type: string
        required: false
        default: ''
      tag-latest:
        description: Also tag as :latest on default branch
        type: boolean
        required: false
        default: false
      version:
        description: Explicit version tag (e.g. v1.2.3 from release job output)
        type: string
        required: false
        default: ''
      build-args:
        description: Build args (one per line, KEY=VALUE). Never secrets — use BUILD_SECRETS
        type: string
        required: false
        default: ''
      provenance:
        description: SLSA provenance attached to the image ('mode=max', 'mode=min' or 'false'). mode=max records the build-args.
        type: string
        required: false
        default: mode=max
      sbom:
        description: Attach an SBOM attestation to the image
        type: boolean
        required: false
        default: true
      runner:
        description: Runner labels as JSON — a Linux VM runner with a Docker daemon, GitHub's (e.g. '"ubuntu-26.04"') or Ubicloud's (e.g. '"ubicloud-standard-2"')
        type: string
        required: false
        default: '"ubuntu-26.04"'
      timeout-minutes:
        description: >
          Minutes before the build job is cancelled (GitHub's default is 360):
          a build stuck on a network pull is cut off instead of holding the
          runner.
        type: number
        required: false
        default: 60
    secrets:
      BUILD_SECRETS:
        description: >
          BuildKit secrets, one `id=value` per line, read in the Dockerfile with
          `RUN --mount=type=secret,id=<id>`. Never stored in a layer or in the
          provenance, unlike build-args.
        required: false
    outputs:
      image:
        description: Image name (without tag)
        value: ${{ jobs.buildx.outputs.image }}
      digest:
        description: Image digest
        value: ${{ jobs.buildx.outputs.digest }}

  workflow_dispatch:
    inputs:
      image-name:
        description: Image name
        type: string
        default: ''
      context:
        description: Docker build context path
        type: string
        default: '.'
      dockerfile:
        description: Dockerfile path relative to context
        type: string
        default: Dockerfile
      push:
        description: Push image to registry
        type: boolean
        default: true
      target:
        description: Build target stage
        type: string
        default: ''
      tag-latest:
        description: Also tag as :latest
        type: boolean
        default: false
      version:
        description: Explicit version tag
        type: string
        default: ''
      build-args:
        description: Build args (one per line, KEY=VALUE). Never secrets — use BUILD_SECRETS
        type: string
        default: ''
      provenance:
        description: SLSA provenance ('mode=max', 'mode=min' or 'false')
        type: string
        default: mode=max
      sbom:
        description: Attach an SBOM attestation to the image
        type: boolean
        default: true
      runner:
        description: Runner labels as JSON
        type: string
        default: '"ubuntu-26.04"'
      timeout-minutes:
        description: Minutes before the build job is cancelled (GitHub's default is 360)
        type: number
        default: 60

env:
  REGISTRY: ghcr.io

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: deploy-buildkit-${{ github.ref }}-${{ inputs.context }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  buildx:
    name: Buildx build & push (${{ inputs.context }})
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: sh
    permissions:
      contents: read   # check out the source
      packages: write  # push the image and the layer cache to GHCR

    outputs:
      image: ${{ steps.tags.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image name, tags, cache reference and OCI labels (actions/image-tags).
      - name: Compute the image tags
        id: tags
        uses: $/.github/actions/image-tags
        with:
          image-name: ${{ inputs.image-name }}
          version: ${{ inputs.version }}
          tag-latest: ${{ inputs.tag-latest }}
          registry: ${{ env.REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Always: the layer cache lives in GHCR even when nothing is pushed.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with Buildx
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.names }}
          labels: ${{ steps.tags.outputs.labels }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.cache }},mode=max,ignore-error=true

      - name: Job summary
        if: always()
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          TAGS: ${{ steps.tags.outputs.tags }}
          CONTEXT: ${{ inputs.context }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### BuildKit Build"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Context | \`${CONTEXT}\` |"
            echo "| SHA | \`${GITHUB_SHA}\` |"
            echo ""
            echo "**Tags:**"
            for tag in $TAGS; do
              echo "- \`${IMAGE}:${tag}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
