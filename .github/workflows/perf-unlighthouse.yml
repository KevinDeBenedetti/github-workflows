name: Perf — Unlighthouse

# Lighthouse audit of EVERY page of a site with Unlighthouse (crawl + sitemap),
# scoring performance, accessibility, best practices and SEO page by page.
#
# The job fails when any page scores below `budget` (GitHub's failure email is
# the alert). The per-page scores are written to the step summary and the full
# static HTML report goes to an artifact kept `artifact-retention-days` (7 by
# default; `upload-artifact: false` uploads none).
#
# Unlighthouse and its Chrome run inside the pinned `browser-image` as the
# job's container: the runner needs neither Chrome nor a Docker daemon.
#
# Intended to be called from a `schedule:` caller. Audit from outside the
# site's own network: from inside, the scores are skewed.

on:
  workflow_call:
    inputs:
      site:
        description: Site to audit (e.g. https://example.com)
        type: string
        required: true
      budget:
        description: Minimum score (1-100) every page must reach on every category
        type: number
        required: false
        default: 75
      device:
        description: "desktop | mobile"
        type: string
        required: false
        default: desktop
      samples:
        description: Lighthouse runs per page (scores are averaged)
        type: number
        required: false
        default: 1
      urls:
        description: Comma-separated relative paths to audit instead of crawling (e.g. /,/about)
        type: string
        required: false
        default: ""
      exclude-urls:
        description: Comma-separated relative paths or regexes to skip (e.g. /admin/*)
        type: string
        required: false
        default: ""
      unlighthouse-version:
        description: "@unlighthouse/cli version"
        type: string
        required: false
        # renovate: datasource=npm depName=@unlighthouse/cli
        default: 0.19.1
      browser-image:
        description: Image the audit runs in, with Node and Chrome, pinned by tag and digest (sitespeed.io's by default)
        type: string
        required: false
        # renovate: datasource=docker depName=sitespeedio/sitespeed.io
        default: sitespeedio/sitespeed.io:42.9.0@sha256:83aa64fde9b780f139ffa34eddbf722f23706bfd88819acf27bbd06f851cc301
      artifact-retention-days:
        description: Days the uploaded artifacts are kept, 1 to 90 (the repository's artifact retention setting caps it)
        type: number
        required: false
        default: 7
      upload-artifact:
        description: Upload the report as an artifact. false uploads nothing to GitHub, for a check that only gates on the budget
        type: boolean
        required: false
        default: true
      runner:
        description: Runner labels as JSON — use '"ubuntu-26.04"'. Not on the site's own network (it skews the scores)
        type: string
        required: false
        default: '"ubuntu-26.04"'
  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  workflow_dispatch:
    inputs:
      site:
        description: Site to audit (e.g. https://example.com)
        type: string
        required: true
      budget:
        description: Minimum score (1-100) every page must reach on every category
        type: number
        default: 75
      device:
        description: "desktop | mobile"
        type: string
        default: desktop
      samples:
        description: Lighthouse runs per page (scores are averaged)
        type: number
        default: 1
      urls:
        description: Comma-separated relative paths to audit instead of crawling (e.g. /,/about)
        type: string
        default: ""
      exclude-urls:
        description: Comma-separated relative paths or regexes to skip (e.g. /admin/*)
        type: string
        default: ""
      unlighthouse-version:
        description: "@unlighthouse/cli version"
        type: string
        # renovate: datasource=npm depName=@unlighthouse/cli
        default: 0.19.1
      browser-image:
        description: Image the audit runs in, with Node and Chrome, pinned by tag and digest (sitespeed.io's by default)
        type: string
        # renovate: datasource=docker depName=sitespeedio/sitespeed.io
        default: sitespeedio/sitespeed.io:42.9.0@sha256:83aa64fde9b780f139ffa34eddbf722f23706bfd88819acf27bbd06f851cc301
      artifact-retention-days:
        description: Days the uploaded artifacts are kept, 1 to 90 (the repository's artifact retention setting caps it)
        type: number
        default: 7
      upload-artifact:
        description: Upload the report as an artifact. false uploads nothing to GitHub, for a check that only gates on the budget
        type: boolean
        default: true
      runner:
        description: Runner labels as JSON — use '"ubuntu-26.04"'. Not on the site's own network (it skews the scores)
        type: string
        required: false
        default: '"ubuntu-26.04"'

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

# A scheduled audit must not be cancelled by the next trigger.
concurrency:
  group: perf-unlighthouse-${{ github.workflow }}-${{ github.ref }}-${{ inputs.site }}-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  unlighthouse:
    name: Unlighthouse (${{ inputs.device }})
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
    # The image is the job's container: Node and Chrome come with it. Under
    # Docker (GitHub-hosted runners) the job runs as the runner's UID, never
    # root, with a 1 GiB /dev/shm for Chrome. Kubernetes ignores container
    # options: there the runner's hook template sets the user and /dev/shm
    # (docs/workflows/perf-unlighthouse.md).
    container:
      image: ${{ inputs.browser-image }} # zizmor: ignore[unpinned-images] -- the input defaults to a tag + digest pin (Renovate); a caller passing another image owns its pin
      options: --user 1001 --shm-size=1g
    defaults:
      run:
        shell: bash

    steps:
      - name: Check report inputs
        uses: $/.github/actions/check-report-inputs
        with:
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
          upload-artifact: ${{ inputs.upload-artifact }}

      - name: Validate inputs
        id: validate
        env:
          SITE: ${{ inputs.site }}
          DEVICE: ${{ inputs.device }}
          BUDGET: ${{ inputs.budget }}
        run: |
          set -euo pipefail
          [[ "$SITE" =~ ^https?:// ]] || { echo "::error::site must start with http:// or https:// (got '${SITE}')"; exit 1; }
          case "$DEVICE" in
            desktop|mobile) ;;
            *) echo "::error::device must be desktop or mobile (got '${DEVICE}')"; exit 1 ;;
          esac
          if [[ ! "$BUDGET" =~ ^[0-9]+$ ]] || (( BUDGET < 1 || BUDGET > 100 )); then
            echo "::error::budget must be an integer between 1 and 100 (got '${BUDGET}')"
            exit 1
          fi

      # The image has no jq; the summary below needs it.
      - name: Setup jq
        uses: $/.github/actions/setup-jq

      # Non-zero exit when a page is under budget — this step is what fails the job.
      - name: Run Unlighthouse
        env:
          SITE: ${{ inputs.site }}
          BUDGET: ${{ inputs.budget }}
          DEVICE: ${{ inputs.device }}
          SAMPLES: ${{ inputs.samples }}
          URLS: ${{ inputs.urls }}
          EXCLUDE_URLS: ${{ inputs.exclude-urls }}
          VERSION: ${{ inputs.unlighthouse-version }}
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME_PATH" ]]; then
            echo "::error::no google-chrome or chromium on the PATH of browser-image"
            exit 1
          fi
          export CHROME_PATH
          # npm and Unlighthouse keep their caches in HOME, which a pod's user may lack.
          if [[ -z "${HOME:-}" || ! -w "$HOME" ]]; then
            export HOME="$RUNNER_TEMP/home"
            mkdir -p "$HOME"
          fi
          # Chrome in a container: its sandbox needs user namespaces or a
          # setuid helper, which an unprivileged container (no CAP_SYS_ADMIN,
          # no privilege escalation) cannot offer, so it runs with
          # --no-sandbox, the container being the boundary. Unlighthouse adds
          # it only for root, and takes Chrome flags from a config file only.
          # Shared memory moves from /dev/shm to /tmp when /dev/shm is under
          # 512 MiB (a pod without a memory emptyDir there).
          chrome_args='"--no-sandbox", "--disable-setuid-sandbox"'
          shm_kib="$(df -Pk /dev/shm 2>/dev/null | awk 'NR == 2 { print $2 }')"
          [[ "$shm_kib" =~ ^[0-9]+$ ]] || shm_kib=0
          if (( shm_kib < 524288 )); then
            echo "::notice::/dev/shm holds $(( shm_kib / 1024 )) MiB: Chrome runs with --disable-dev-shm-usage"
            chrome_args+=', "--disable-dev-shm-usage"'
          fi
          config="$RUNNER_TEMP/unlighthouse.config.json"
          printf '{"puppeteerOptions": {"args": [%s]}}\n' "$chrome_args" > "$config"
          args=(--site "$SITE" --budget "$BUDGET" "--${DEVICE}" --samples "$SAMPLES"
                --build-static --output-path .unlighthouse --config-file "$config")
          [[ -n "$URLS" ]] && args+=(--urls "$URLS")
          [[ -n "$EXCLUDE_URLS" ]] && args+=(--exclude-urls "$EXCLUDE_URLS")
          npm exec --yes --package="@unlighthouse/cli@${VERSION}" -- unlighthouse-ci "${args[@]}"

      # Runs even when the budget failed. Tolerates both shapes of ci-result.json
      # (object keyed by path, or array of {path, ...}).
      - name: Summarize scores
        if: always()
        env:
          DEVICE: ${{ inputs.device }}
          BUDGET: ${{ inputs.budget }}
        run: |
          set -euo pipefail
          f="$(find .unlighthouse -name 'ci-result.json' -print -quit 2>/dev/null || true)"
          {
            echo "### Unlighthouse — ${DEVICE} (budget ${BUDGET})"
            echo
            if [[ -z "$f" ]]; then
              echo "_No ci-result.json produced._"
            else
              echo "| Page | Perf | A11y | Best practices | SEO |"
              echo "|---|---|---|---|---|"
              jq -r --argjson b "$BUDGET" '
                def n: if . == null then "" elif . <= 1 then (. * 100 | round) else round end;
                def mark: if . == "" then "" elif . < $b then "❌ \(.)" else "\(.)" end;
                (if type == "array" then map({key: (.path // .url), value: .}) else to_entries end)
                | sort_by(.key)[]
                | .value as $v
                | "| \(.key) | \(($v.performance | n) | mark) | \(($v.accessibility | n) | mark) | \((($v["best-practices"] // $v.bestPractices) | n) | mark) | \(($v.seo | n) | mark) |"
              ' "$f" 2>/dev/null || echo "| _could not parse ${f}_ | | | | |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ always() && inputs.upload-artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unlighthouse-report-${{ inputs.device }}
          path: .unlighthouse
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn
          # `.unlighthouse` is a dot-folder: upload-artifact skips hidden paths unless
          # told to (v4.4.0+). It holds the Unlighthouse report of public pages, no secret.
          include-hidden-files: true
