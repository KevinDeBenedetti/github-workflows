name: CI — Kubernetes

on:
  workflow_call:
    inputs:
      # ── kubeconform ────────────────────────────────────────────────────────
      run-kubeconform:
        description: Validate Kubernetes manifests with kubeconform
        type: boolean
        required: false
        default: true
      kubeconform-paths:
        description: Directory containing manifests to validate
        type: string
        required: false
        default: kubernetes/
      kubeconform-exclude:
        description: Filename pattern to exclude from validation (e.g. '.*-values\.yaml')
        type: string
        required: false
        default: '.*-values\.yaml'
      kubeconform-include-crds-catalog:
        description: >
          Also validate against the Datree CRDs-catalog
          (enables cert-manager, Traefik, and other CRD schemas)
        type: boolean
        required: false
        default: true
      kubeconform-ignore-missing-schemas:
        description: >
          Skip resources whose schema is not found in any configured schema
          location. Useful for custom CRDs not in the catalog (e.g. Tetragon
          TracingPolicy, Kyverno ClusterPolicy).
        type: boolean
        required: false
        default: false

      # ── .env.example ───────────────────────────────────────────────────────
      run-env-example:
        description: Check that .env.example contains all required keys
        type: boolean
        required: false
        default: false
      env-example-required-keys:
        description: Space-separated list of keys that must be present in .env.example
        type: string
        required: false
        default: ''
      env-example-file:
        description: Path to the .env.example file
        type: string
        required: false
        default: .env.example

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  workflow_dispatch:
    inputs:
      run-kubeconform:
        description: Validate Kubernetes manifests with kubeconform
        type: boolean
        default: true
      kubeconform-paths:
        description: Directory containing manifests to validate
        type: string
        default: kubernetes/
      kubeconform-exclude:
        description: Filename pattern to exclude from validation (e.g. '.*-values\.yaml')
        type: string
        default: '.*-values\.yaml'
      kubeconform-include-crds-catalog:
        description: Also validate against the Datree CRDs-catalog
        type: boolean
        default: true
      kubeconform-ignore-missing-schemas:
        description: Skip resources whose schema is not found in any configured schema location
        type: boolean
        default: false
      run-env-example:
        description: Check that .env.example contains all required keys
        type: boolean
        default: false
      env-example-required-keys:
        description: Space-separated list of keys that must be present in .env.example
        type: string
        default: ''
      env-example-file:
        description: Path to the .env.example file
        type: string
        default: .env.example

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'

# The group carries the path input(s) so that one caller invoking this workflow
# several times in the same run (e.g. one call per directory) gets one group per
# call — with a shared group, cancel-in-progress makes the calls cancel each other.
# Deny-all default: each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: ci-kubernetes-${{ github.workflow }}-${{ github.ref }}-${{ inputs.kubeconform-paths }}-${{ inputs.env-example-file }}
  cancel-in-progress: true

jobs:
  # ── Kubernetes manifest schema validation ─────────────────────────────────
  kubeconform:
    name: Validate Kubernetes manifests
    if: inputs.run-kubeconform
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: kubeconform
        uses: KevinDeBenedetti/github-workflows/.github/actions/kubeconform@v0.27.0 # x-release-please-version
        with:
          paths: ${{ inputs.kubeconform-paths }}
          exclude: ${{ inputs.kubeconform-exclude }}
          include-crds-catalog: ${{ inputs.kubeconform-include-crds-catalog }}
          ignore-missing-schemas: ${{ inputs.kubeconform-ignore-missing-schemas }}

  # ── .env.example completeness check ──────────────────────────────────────
  env-example:
    name: .env.example check
    if: inputs.run-env-example
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure required keys are documented in .env.example
        # Inputs go through env, never interpolated into the script body.
        env:
          REQUIRED: ${{ inputs.env-example-required-keys }}
          ENV_FILE: ${{ inputs.env-example-file }}
        run: |
          if [ ! -f "$ENV_FILE" ]; then
            echo "❌ $ENV_FILE not found"
            exit 1
          fi
          MISSING=()
          for key in $REQUIRED; do
            grep -qE "^(export[[:space:]]+)?${key}=" "$ENV_FILE" || MISSING+=("$key")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing keys in $ENV_FILE: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All required keys present in $ENV_FILE"
