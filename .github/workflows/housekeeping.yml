# Weekly housekeeping of this repository: its old workflow runs, and its
# artifacts older than three days whatever the run, through the reusable
# cleanup-runs.yml of the same commit. Not a reusable workflow: it cleans this
# repository only (no package is published here, so no GHCR cleanup).
#
# The schedule deletes. A manual run is a dry run unless unticked: it shows
# what the next scheduled run will delete.
name: Housekeeping

on:
  schedule:
    - cron: '43 4 * * 1'  # Mondays, 04:43 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would be deleted, delete nothing
        type: boolean
        default: true

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

jobs:
  cleanup-runs:
    name: Cleanup workflow runs
    uses: ./.github/workflows/cleanup-runs.yml
    permissions:
      actions: write          # list and delete the workflow runs and their artifacts
      pull-requests: read     # keep the runs of the open pull requests
    with:
      # Artifacts count against the account's Actions storage by the hour;
      # the runs kept lose theirs after three days too.
      artifacts-older-than-days: 3
      # Empty on a schedule: false.
      dry-run: ${{ inputs.dry-run == true }}
