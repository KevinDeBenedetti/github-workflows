name: CI — Terraform

on:
  workflow_call:
    inputs:
      # ── Terraform validate ────────────────────────────────────────────────
      run-validate:
        description: Run `terraform validate` (requires init)
        type: boolean
        required: false
        default: true
      # ── Terraform fmt check ───────────────────────────────────────────────
      run-fmt-check:
        description: Run `terraform fmt -check -diff` to enforce formatting
        type: boolean
        required: false
        default: true
      # ── Config ────────────────────────────────────────────────────────────
      tf-dir:
        description: Path to the Terraform root module directory
        type: string
        required: false
        default: terraform
      terraform-version:
        description: Terraform version to install (e.g. 1.10.0, or 'latest')
        type: string
        required: false
        # renovate: datasource=github-releases depName=hashicorp/terraform
        default: 1.17.0

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  workflow_dispatch:
    inputs:
      run-validate:
        description: Run `terraform validate`
        type: boolean
        default: true
      run-fmt-check:
        description: Run `terraform fmt -check -diff`
        type: boolean
        default: true
      tf-dir:
        description: Path to the Terraform root module directory
        type: string
        default: terraform
      terraform-version:
        description: Terraform version to install (e.g. 1.10.0, or 'latest')
        type: string
        # renovate: datasource=github-releases depName=hashicorp/terraform
        default: 1.17.0

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

# The group carries the path input(s) so that one caller invoking this workflow
# several times in the same run (e.g. one call per directory) gets one group per
# call — with a shared group, cancel-in-progress makes the calls cancel each other.
concurrency:
  group: ci-terraform-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tf-dir }}
  cancel-in-progress: true

jobs:
  # ── Terraform validate + fmt ─────────────────────────────────────────────
  terraform:
    name: Terraform validate
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.tf-dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          # The wrapper is a Node script invoked from PATH — self-hosted
          # runners (actions-runner image) have no system node, and no step
          # here consumes the wrapper's stdout/exitcode outputs.
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.tf-dir }}/.terraform
          key: terraform-${{ inputs.tf-dir }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.tf-dir)) }}
          restore-keys: |
            terraform-${{ inputs.tf-dir }}-

      - name: Terraform init (no backend)
        # Retry: provider downloads from registry.terraform.io intermittently
        # time out ("Client.Timeout exceeded while awaiting headers"), which is
        # transient infra flakiness rather than a config error.
        #
        # TF_REGISTRY_CLIENT_TIMEOUT raises Terraform's per-request registry
        # client timeout from its 10s default to 30s — the failing call is the
        # registry download-metadata request, and 10s is too tight for slow
        # responses from GitHub-hosted runners. (30 is the documented maximum.)
        env:
          TF_REGISTRY_CLIENT_TIMEOUT: "30"
        run: |
          for attempt in 1 2 3; do
            terraform init -backend=false && exit 0
            echo "::warning::terraform init failed (attempt ${attempt}/3) — retrying in 20s"
            sleep 20
          done
          echo "::error::terraform init failed after 3 attempts (registry.terraform.io unreachable?)"
          exit 1

      - name: Terraform validate
        if: inputs.run-validate
        run: terraform validate

      - name: Terraform fmt check
        if: inputs.run-fmt-check
        run: terraform fmt -check -diff
