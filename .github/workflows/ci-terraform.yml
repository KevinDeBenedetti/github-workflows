name: CI — Terraform

on:
  workflow_call:
    inputs:
      # ── Terraform validate ────────────────────────────────────────────────
      run-validate:
        description: Run `terraform validate` (requires init)
        type: boolean
        required: false
        default: true
      # ── Terraform fmt check ───────────────────────────────────────────────
      run-fmt-check:
        description: Run `terraform fmt -check -diff` to enforce formatting
        type: boolean
        required: false
        default: true
      # ── tflint ────────────────────────────────────────────────────────────
      run-tflint:
        description: Lint the module with tflint (reads the module's .tflint.hcl). Off by default for now; on by default in a later release.
        type: boolean
        required: false
        default: false
      # ── Configuration scan ────────────────────────────────────────────────
      run-config-scan:
        description: Scan the module for misconfigurations with Trivy (open firewall rules, unencrypted volumes, …), as annotations
        type: boolean
        required: false
        default: false
      config-scan-fail-on:
        description: 'Lowest severity that fails the configuration scan: low | medium | high | critical'
        type: string
        required: false
        default: high
      # ── Config ────────────────────────────────────────────────────────────
      tf-dir:
        description: Path to the Terraform root module directory
        type: string
        required: false
        default: terraform
      terraform-version:
        description: Terraform version to install (e.g. 1.10.0, or 'latest')
        type: string
        required: false
        # renovate: datasource=github-releases depName=hashicorp/terraform
        default: 1.17.0

      runner:
        description: Runner labels as JSON — GitHub's (e.g. '"ubuntu-26.04"') or Ubicloud's (e.g. '"ubicloud-standard-2"')
        type: string
        required: false
        default: '"ubuntu-26.04"'

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

# The group carries the path input(s) so that one caller invoking this workflow
# several times in the same run (e.g. one call per directory) gets one group per
# call — with a shared group, cancel-in-progress makes the calls cancel each other.
concurrency:
  group: ci-terraform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tf-dir }}
  cancel-in-progress: true

jobs:
  # ── Terraform validate + fmt ─────────────────────────────────────────────
  terraform:
    name: Terraform validate
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.tf-dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          # The wrapper is a Node script invoked from PATH — a runner image
          # may have no system node, and no step here consumes the wrapper's
          # stdout/exitcode outputs.
          terraform_wrapper: false

      # Keyed on the runner's OS and CPU: provider binaries are built per
      # platform, and an arm64 job that hit the amd64 entry would download its
      # providers on every run (an exact hit is never saved again).
      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.tf-dir }}/.terraform
          key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tf-dir }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.tf-dir)) }}
          restore-keys: |
            terraform-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tf-dir }}-

      - name: Terraform init (no backend)
        # Retry: provider downloads from registry.terraform.io intermittently
        # time out ("Client.Timeout exceeded while awaiting headers"), which is
        # transient infra flakiness rather than a config error.
        #
        # TF_REGISTRY_CLIENT_TIMEOUT raises Terraform's per-request registry
        # client timeout from its 10s default to 30s — the failing call is the
        # registry download-metadata request, and 10s is too tight for slow
        # responses from GitHub-hosted runners. (30 is the documented maximum.)
        env:
          TF_REGISTRY_CLIENT_TIMEOUT: "30"
        run: |
          for attempt in 1 2 3; do
            terraform init -backend=false && exit 0
            echo "::warning::terraform init failed (attempt ${attempt}/3) — retrying in 20s"
            sleep 20
          done
          echo "::error::terraform init failed after 3 attempts (registry.terraform.io unreachable?)"
          exit 1

      - name: Terraform validate
        if: inputs.run-validate
        run: terraform validate

      - name: Terraform fmt check
        if: inputs.run-fmt-check
        run: terraform fmt -check -diff

  # ── tflint ───────────────────────────────────────────────────────────────
  # What validate does not catch: deprecated syntax, unused declarations and,
  # with the plugins of the module's .tflint.hcl, provider-specific mistakes.
  # Needs no terraform init: tflint reads the module's files.
  tflint:
    name: tflint
    if: inputs.run-tflint
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tflint
        uses: $/.github/actions/tflint
        with:
          tf-dir: ${{ inputs.tf-dir }}

  # ── Configuration scan ───────────────────────────────────────────────────
  # Insecure resources, as error annotations on the file and line. No SARIF
  # upload here: a job that declared security-events: write would force every
  # caller to grant it. The config-scan action can write the report for a
  # caller that uploads it from a job of its own.
  config-scan:
    name: Configuration scan
    if: inputs.run-config-scan
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configuration scan
        uses: $/.github/actions/config-scan
        with:
          path: ${{ inputs.tf-dir }}
          fail-on: ${{ inputs.config-scan-fail-on }}
