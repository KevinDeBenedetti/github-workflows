name: Perf — sitespeed.io

# Core Web Vitals monitoring with sitespeed.io (real Chrome, official Docker image).
#
# Measures the URLs listed in the CALLER's `urls-file` against the CALLER's
# `budget-file`, so the thresholds live next to the code they guard. The job
# fails when the budget is exceeded (GitHub's failure email is the alert).
# The metrics are appended as one CSV row per URL/device to a `history-branch`
# of the calling repo, which keeps them for good. The raw results go to an
# artifact kept `artifact-retention-days` (7 by default; `upload-artifact:
# false` uploads none).
#
# sitespeed.io runs inside the pinned `sitespeed-image` as the job's
# container: no Docker daemon is needed, so a Kubernetes runner (ARC,
# containerMode kubernetes) runs it as a pod of its own. Measure from outside
# the site's own network: from inside, LCP and TTFB are skewed.
#
# Caller requirements (defaults):
#   perf/urls.txt      one URL per line
#   perf/budget.json   {"budget": {"googleWebVitals": {...}}}
#
# `device: both` runs desktop and mobile as a matrix; the history is written
# once, by a single job after the matrix, so concurrent pushes cannot collide.

on:
  workflow_call:
    inputs:
      urls-file:
        description: Path to the file listing the URLs to test (one per line) in the calling repo
        type: string
        required: false
        default: perf/urls.txt
      budget-file:
        description: Path to the sitespeed.io budget JSON in the calling repo
        type: string
        required: false
        default: perf/budget.json
      iterations:
        description: Number of runs per URL (metrics are the median)
        type: number
        required: false
        default: 5
      device:
        description: "desktop | mobile | both (both = matrix of the two)"
        type: string
        required: false
        default: desktop
      sitespeed-image:
        description: sitespeed.io Docker image the job runs in, pinned by tag and digest
        type: string
        required: false
        # renovate: datasource=docker depName=sitespeedio/sitespeed.io
        default: sitespeedio/sitespeed.io:42.9.0@sha256:83aa64fde9b780f139ffa34eddbf722f23706bfd88819acf27bbd06f851cc301
      history-branch:
        description: Branch receiving history.csv (created as orphan if missing). Empty disables the history
        type: string
        required: false
        default: perf-history
      artifact-retention-days:
        description: Days the uploaded artifacts are kept, 1 to 90 (the repository's artifact retention setting caps it)
        type: number
        required: false
        default: 7
      upload-artifact:
        description: Upload the results as an artifact. false uploads nothing to GitHub, for a check that only gates on the budget
        type: boolean
        required: false
        default: true

      runner:
        description: Runner labels as JSON — use '"ubuntu-26.04"'. Not on the site's own network (it skews LCP/TTFB)
        type: string
        required: false
        default: '"ubuntu-26.04"'
  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  # `device` is a plain string in both: workflow_call has no `choice` type.
  workflow_dispatch:
    inputs:
      urls-file:
        description: Path to the file listing the URLs to test (one per line) in the calling repo
        type: string
        default: perf/urls.txt
      budget-file:
        description: Path to the sitespeed.io budget JSON in the calling repo
        type: string
        default: perf/budget.json
      iterations:
        description: Number of runs per URL (metrics are the median)
        type: number
        default: 5
      device:
        description: "desktop | mobile | both (both = matrix of the two)"
        type: string
        default: desktop
      sitespeed-image:
        description: sitespeed.io Docker image the job runs in, pinned by tag and digest
        type: string
        # renovate: datasource=docker depName=sitespeedio/sitespeed.io
        default: sitespeedio/sitespeed.io:42.9.0@sha256:83aa64fde9b780f139ffa34eddbf722f23706bfd88819acf27bbd06f851cc301
      history-branch:
        description: Branch receiving history.csv (created as orphan if missing). Empty disables the history
        type: string
        default: perf-history
      artifact-retention-days:
        description: Days the uploaded artifacts are kept, 1 to 90 (the repository's artifact retention setting caps it)
        type: number
        default: 7
      upload-artifact:
        description: Upload the results as an artifact. false uploads nothing to GitHub, for a check that only gates on the budget
        type: boolean
        default: true

      runner:
        description: Runner labels as JSON — use '"ubuntu-26.04"'. Not on the site's own network (it skews LCP/TTFB)
        type: string
        required: false
        default: '"ubuntu-26.04"'

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

# A scheduled measurement must not be cancelled by the next trigger.
concurrency:
  group: perf-sitespeed-${{ github.workflow }}-${{ github.ref }}-${{ inputs.urls-file }}
  cancel-in-progress: false

jobs:
  sitespeed:
    name: sitespeed.io (${{ matrix.device }})
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(inputs.device == 'both' && '["desktop","mobile"]' || format('["{0}"]', inputs.device)) }}
    # The image is the job's container: no Docker daemon needed. Under Docker
    # (GitHub-hosted runners), the job runs as the runner's UID, never root,
    # and Chrome gets the 1 GiB /dev/shm it had under `docker run
    # --shm-size=1g`. Kubernetes ignores container options: there the runner's
    # hook template sets the user and /dev/shm (docs/workflows/perf-sitespeed.md).
    container:
      image: ${{ inputs.sitespeed-image }} # zizmor: ignore[unpinned-images] -- the input defaults to a tag + digest pin (Renovate); a caller passing another image owns its pin
      options: --user 1001 --shm-size=1g
    defaults:
      run:
        shell: bash
    # The history job reads the rows here rather than from the artifact, which
    # upload-artifact: false leaves out. The two names never collide: each
    # device sets its own, and GitHub combines the outputs of a matrix.
    outputs:
      rows-desktop: ${{ steps.metrics.outputs.rows-desktop }}
      rows-mobile: ${{ steps.metrics.outputs.rows-mobile }}

    steps:
      - name: Check report inputs
        uses: $/.github/actions/check-report-inputs
        with:
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
          upload-artifact: ${{ inputs.upload-artifact }}

      # The URLs and the budget live in the calling repository. The image has
      # no git: the checkout downloads the repository through the REST API.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        id: validate
        env:
          URLS_FILE: ${{ inputs.urls-file }}
          BUDGET_FILE: ${{ inputs.budget-file }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          for f in "$URLS_FILE" "$BUDGET_FILE"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::${f} not found in the calling repository"
              exit 1
            fi
          done
          case "$DEVICE" in
            desktop|mobile) ;;
            *) echo "::error::device must be desktop, mobile or both (got '${DEVICE}')"; exit 1 ;;
          esac

      # The image has no jq; the metrics below need it.
      - name: Setup jq
        uses: $/.github/actions/setup-jq

      # Non-zero exit when the budget is exceeded — this step is what fails the job.
      # analysisstorer, off by default, writes the JSON the next step reads: without
      # it the result holds only the HTML report, videos and HARs.
      - name: Run sitespeed.io
        env:
          URLS_FILE: ${{ inputs.urls-file }}
          BUDGET_FILE: ${{ inputs.budget-file }}
          ITERATIONS: ${{ inputs.iterations }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          args=(-n "$ITERATIONS" -b chrome
                --budget.configPath "$BUDGET_FILE" --budget.output json
                --plugins.add analysisstorer
                --outputFolder sitespeed-result)
          [[ "$DEVICE" == "mobile" ]] && args+=(--mobile)
          # Chrome keeps its shared memory in /dev/shm: 1 GiB under Docker
          # (--shm-size above), 64 MiB in a pod unless the hook template mounts
          # a memory emptyDir there. Below 512 MiB it moves to /tmp, a little
          # slower, rather than crash a tab of a heavy page; a GitHub-hosted run
          # keeps /dev/shm and measures as before.
          shm_kib="$(df -Pk /dev/shm 2>/dev/null | awk 'NR == 2 { print $2 }')"
          [[ "$shm_kib" =~ ^[0-9]+$ ]] || shm_kib=0
          if (( shm_kib < 524288 )); then
            echo "::notice::/dev/shm holds $(( shm_kib / 1024 )) MiB: Chrome runs with --disable-dev-shm-usage"
            args+=(--browsertime.chrome.args=disable-dev-shm-usage)
          fi
          google-chrome --version || true
          # What the image's entrypoint (/start.sh) runs, which a job container
          # skips; its switch to the workspace owner would need root, and the
          # job runs as that owner already. Chrome gets --no-sandbox from the
          # image itself (SITESPEED_IO_BROWSERTIME__DOCKER): its sandbox needs
          # user namespaces or a setuid helper, which an unprivileged container
          # (no CAP_SYS_ADMIN, no privilege escalation) cannot offer; the
          # container is the boundary.
          HOME=/tmp DBUS_SESSION_BUS_ADDRESS=/dev/null \
            node --max-old-space-size=2048 /usr/src/app/bin/sitespeed.js "$URLS_FILE" "${args[@]}"

      # Runs even when the budget failed, so the artifact and history always exist.
      # One row per URL: date,url,device,lcp,cls,tbt (medians), from the page
      # summary analysisstorer writes for each URL, pages/<host>/<path>/data/.
      - name: Extract metrics
        id: metrics
        if: always()
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          mkdir -p sitespeed-result
          out="sitespeed-result/history-rows.csv"
          : > "$out"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          while IFS= read -r -d '' f; do
            jq -r --arg d "$date" --arg dev "$DEVICE" --arg fallback "$(dirname "$(dirname "$f")")" '
              [ $d,
                (.info.url // $fallback),
                $dev,
                (.statistics.googleWebVitals.largestContentfulPaint.median // ""),
                (.statistics.googleWebVitals.cumulativeLayoutShift.median // ""),
                (.statistics.googleWebVitals.totalBlockingTime.median // "")
              ] | join(",")' "$f" >> "$out"
          done < <(find sitespeed-result -name browsertime.pageSummary.json -print0)

          {
            echo "### Core Web Vitals — ${DEVICE}"
            echo
            if [[ -s "$out" ]]; then
              echo "| URL | LCP (ms) | CLS | TBT (ms) |"
              echo "|---|---|---|---|"
              awk -F, '{ printf "| %s | %s | %s | %s |\n", $2, $4, $5, $6 }' "$out"
            else
              echo "No metrics: sitespeed.io wrote no \`browsertime.pageSummary.json\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -s "$out" ]]; then
            echo "::warning::no browsertime.pageSummary.json under sitespeed-result — no metrics extracted"
          fi
          # The rows of this device, for the history job (rows-desktop, rows-mobile).
          delimiter="ROWS_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "rows-${DEVICE}<<${delimiter}"
            cat "$out"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # history.csv keeps the metrics: the videos, screenshots and HARs need
      # not stay long.
      - name: Upload results
        if: ${{ always() && inputs.upload-artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitespeed-result-${{ matrix.device }}
          path: sitespeed-result
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn

  # Single writer, after the matrix: avoids concurrent pushes to the history branch.
  # It runs on the runner itself, not in the image: git and a token, no browser.
  history:
    name: Append to history
    needs: sitespeed
    if: ${{ !cancelled() && inputs.history-branch != '' }}
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: write  # commit the measurement history to the history branch
    concurrency:
      group: perf-history-${{ github.repository }}-${{ inputs.history-branch }}
      cancel-in-progress: false

    steps:
      - name: Append to history.csv
        env:
          BRANCH: ${{ inputs.history-branch }}
          PUSH_TOKEN: ${{ github.token }}
          # Desktop first, then mobile, as the artifacts used to be read.
          ROWS_DESKTOP: ${{ needs.sitespeed.outputs.rows-desktop }}
          ROWS_MOBILE: ${{ needs.sitespeed.outputs.rows-mobile }}
        run: |
          set -euo pipefail

          rows="$(printf '%s\n%s\n' "$ROWS_DESKTOP" "$ROWS_MOBILE" | sed '/^$/d')"
          if [[ -z "$rows" ]]; then
            echo "::warning::no metrics extracted — history left untouched"
            exit 0
          fi

          # The token reaches git through this step's environment only (the
          # way release.yml moves its tags), never through a remote URL that
          # .git/config would keep on disk after the job on a persistent runner.
          AUTH="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${AUTH}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}"

          rm -rf "${RUNNER_TEMP}/history"
          mkdir "${RUNNER_TEMP}/history" && cd "${RUNNER_TEMP}/history"
          git init -q
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              git fetch -q --depth 1 origin "$BRANCH"
              git checkout -q -B "$BRANCH" FETCH_HEAD
            else
              # First run: orphan branch holding only history.csv.
              git checkout -q --orphan "$BRANCH"
              git rm -rfq . 2>/dev/null || true
            fi
            [[ -f history.csv ]] || echo "date,url,device,lcp,cls,tbt" > history.csv
            printf '%s\n' "$rows" >> history.csv
            git add history.csv
            git commit -q -m "chore(perf): add ${GITHUB_RUN_ID} measurements [skip ci]"
            if git push -q origin "HEAD:refs/heads/${BRANCH}"; then
              echo "History appended to branch \`${BRANCH}\` (history.csv)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::push rejected (attempt ${attempt}) — retrying"
            git checkout -q --detach
            git branch -q -D "$BRANCH"
            sleep $((attempt * 3))
          done
          echo "::error::could not push to ${BRANCH}"
          exit 1
