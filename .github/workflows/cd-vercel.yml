name: Deploy — Vercel

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (preview | production)
        type: string
        required: false
        default: preview
      working-directory:
        description: Path to the app root (e.g. apps/web)
        type: string
        required: false
        default: '.'
      node-version:
        description: Node.js version
        type: string
        required: false
        default: '24'
      vercel-version:
        description: Vercel CLI version to install (npm version or dist-tag)
        type: string
        required: false
        # renovate: datasource=npm depName=vercel
        default: 62.4.0
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
    outputs:
      deployment-url:
        description: URL of the Vercel deployment
        value: ${{ jobs.deploy.outputs.deployment-url }}

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: deploy-vercel-${{ inputs.environment }}-${{ inputs.working-directory }}-${{ github.ref }}
  cancel-in-progress: false  # never cancel a running deploy

jobs:
  deploy:
    name: Vercel ${{ inputs.environment }} (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      pull-requests: write  # required to post/update the preview-URL PR comment
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: KevinDeBenedetti/github-workflows/.github/actions/setup-node@v0.27.0 # x-release-please-version
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      # Pinned (Renovate bumps the default) so a CLI release cannot change a
      # production deploy between two otherwise identical runs.
      - name: Install Vercel CLI
        env:
          VERCEL_VERSION: ${{ inputs.vercel-version }}
        run: npm install -g "vercel@${VERCEL_VERSION}" # zizmor: ignore[adhoc-packages] -- exact version, Renovate-bumped input default

      - name: Pull Vercel environment
        working-directory: ${{ inputs.working-directory }}
        run: |
          vercel pull --yes \
            --environment="$VERCEL_ENVIRONMENT"
        env:
          VERCEL_ENVIRONMENT: ${{ inputs.environment }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: |
          # shellcheck disable=SC2086 # PROD_FLAG is empty or a single flag
          vercel build $PROD_FLAG
        env:
          PROD_FLAG: ${{ inputs.environment == 'production' && '--prod' || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt
        id: deploy
        working-directory: ${{ inputs.working-directory }}
        run: |
          # shellcheck disable=SC2086 # PROD_FLAG is empty or a single flag
          URL=$(vercel deploy --prebuilt $PROD_FLAG)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🚀 Deployed to: $URL"
        env:
          PROD_FLAG: ${{ inputs.environment == 'production' && '--prod' || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR with preview URL
        if: inputs.environment == 'preview' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          APP_DIR: ${{ inputs.working-directory }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            const app = process.env.APP_DIR;
            const body = `### 🚀 Vercel Preview — \`${app}\`\n\n**URL:** ${url}\n\n_Deployed from commit ${context.sha.slice(0, 7)}_`;

            // Paginate: listComments returns 30 comments per page, so on a busy
            // PR the existing preview comment would be missed and duplicated.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              (c.body ?? '').includes(`Vercel Preview — \`${app}\``)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
