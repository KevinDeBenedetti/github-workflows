name: CI — Ansible

on:
  workflow_call:
    inputs:
      # ── Ansible lint ──────────────────────────────────────────────────────
      ansible-dir:
        description: Path to the directory containing Ansible playbooks/roles
        type: string
        required: false
        default: ansible/
      ansible-lint-version:
        description: ansible-lint version to install (pip specifier, e.g. '>=25.0,<26')
        type: string
        required: false
        default: ''
      python-version:
        description: Python version to use
        type: string
        required: false
        default: '3.12'
      fail-on-error:
        description: >
          Fail the job when ansible-lint reports violations.
          Set to false to run in advisory mode (warnings only).
        type: boolean
        required: false
        default: true
      # ── Ansible syntax check ──────────────────────────────────────────────
      run-syntax-check:
        description: Run `ansible-playbook --syntax-check` on all playbooks found
        type: boolean
        required: false
        default: false
      playbook-glob:
        description: Glob pattern (relative to ansible-dir) for playbooks to syntax-check
        type: string
        required: false
        default: '*.yml'

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  workflow_dispatch:
    inputs:
      ansible-dir:
        description: Path to the directory containing Ansible playbooks/roles
        type: string
        default: ansible/
      ansible-lint-version:
        description: ansible-lint version to install (pip specifier, e.g. '>=25.0,<26')
        type: string
        default: ''
      python-version:
        description: Python version to use
        type: string
        default: '3.12'
      fail-on-error:
        description: Fail the job when ansible-lint reports violations
        type: boolean
        default: true
      run-syntax-check:
        description: Run `ansible-playbook --syntax-check` on all playbooks found
        type: boolean
        default: false
      playbook-glob:
        description: Glob pattern (relative to ansible-dir) for playbooks to syntax-check
        type: string
        default: '*.yml'

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'

# The group carries the path input(s) so that one caller invoking this workflow
# several times in the same run (e.g. one call per directory) gets one group per
# call — with a shared group, cancel-in-progress makes the calls cancel each other.
concurrency:
  group: ci-ansible-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ansible-dir }}
  cancel-in-progress: true

jobs:
  # ── Ansible lint ─────────────────────────────────────────────────────────
  ansible-lint:
    name: Ansible lint
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      # Inputs go through env, never interpolated into the script body.
      - name: Install ansible-lint
        env:
          ANSIBLE_LINT_VERSION: ${{ inputs.ansible-lint-version }}
        run: pip install --quiet "ansible-lint${ANSIBLE_LINT_VERSION}"

      - name: Run ansible-lint
        env:
          ANSIBLE_DIR: ${{ inputs.ansible-dir }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        run: |
          if [[ "$FAIL_ON_ERROR" == "true" ]]; then
            ansible-lint "$ANSIBLE_DIR"
          else
            ansible-lint "$ANSIBLE_DIR" || true
          fi

  # ── Ansible syntax check ─────────────────────────────────────────────────
  ansible-syntax-check:
    name: Ansible syntax check
    if: inputs.run-syntax-check
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ansible
        run: pip install --quiet ansible

      - name: Syntax check all playbooks
        env:
          ANSIBLE_DIR: ${{ inputs.ansible-dir }}
          PLAYBOOK_GLOB: ${{ inputs.playbook-glob }}
        run: |
          found=0
          while IFS= read -r -d '' playbook; do
            # The glob also matches non-playbook YAML that commonly sits next to
            # playbooks (requirements.yml, galaxy.yml, vars files…), on which
            # --syntax-check fails. A playbook is a list of plays: keep only
            # files whose plays (top-level list items) declare `hosts:` or
            # `import_playbook:`, either on the `- ` line or indented below it.
            if ! grep -qE '^(- +|  )(hosts|import_playbook|ansible\.builtin\.import_playbook):' "$playbook"; then
              echo "⏭️  $playbook skipped (not a playbook)"
              continue
            fi
            found=1
            echo "::group::Syntax check: $playbook"
            ansible-playbook --syntax-check "$playbook"
            echo "::endgroup::"
          done < <(find "$ANSIBLE_DIR" -maxdepth 1 -name "$PLAYBOOK_GLOB" -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "⚠️  No playbooks found in $ANSIBLE_DIR matching $PLAYBOOK_GLOB"
          fi
