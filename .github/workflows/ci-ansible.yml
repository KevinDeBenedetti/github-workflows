name: CI — Ansible

on:
  workflow_call:
    inputs:
      # ── Ansible lint ──────────────────────────────────────────────────────
      ansible-dir:
        description: Path to the directory containing Ansible playbooks/roles
        type: string
        required: false
        default: ansible/
      ansible-lint-version:
        description: >
          ansible-lint version to install (pip specifier, e.g. '>=25.0,<26').
          Empty → the version pinned in this workflow.
        type: string
        required: false
        default: ''
      ansible-version:
        description: >
          ansible version for the syntax check (pip specifier, e.g. '<12' on
          Python < 3.12). Empty → the version pinned in this workflow.
        type: string
        required: false
        default: ''
      python-version:
        description: Python version to use
        type: string
        required: false
        default: '3.12'
      fail-on-error:
        description: >
          Fail the job when ansible-lint reports violations.
          Set to false to run in advisory mode (warnings only).
        type: boolean
        required: false
        default: true
      # ── Ansible syntax check ──────────────────────────────────────────────
      run-syntax-check:
        description: Run `ansible-playbook --syntax-check` on all playbooks found
        type: boolean
        required: false
        default: false
      playbook-glob:
        description: Glob pattern (relative to ansible-dir) for playbooks to syntax-check
        type: string
        required: false
        default: '*.yml'

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  workflow_dispatch:
    inputs:
      ansible-dir:
        description: Path to the directory containing Ansible playbooks/roles
        type: string
        default: ansible/
      ansible-lint-version:
        description: ansible-lint version to install (pip specifier). Empty → pinned version
        type: string
        default: ''
      ansible-version:
        description: ansible version for the syntax check (pip specifier). Empty → pinned version
        type: string
        default: ''
      python-version:
        description: Python version to use
        type: string
        default: '3.12'
      fail-on-error:
        description: Fail the job when ansible-lint reports violations
        type: boolean
        default: true
      run-syntax-check:
        description: Run `ansible-playbook --syntax-check` on all playbooks found
        type: boolean
        default: false
      playbook-glob:
        description: Glob pattern (relative to ansible-dir) for playbooks to syntax-check
        type: string
        default: '*.yml'

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

# The group carries the path input(s) so that one caller invoking this workflow
# several times in the same run (e.g. one call per directory) gets one group per
# call — with a shared group, cancel-in-progress makes the calls cancel each other.
concurrency:
  group: ci-ansible-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ansible-dir }}
  cancel-in-progress: true

jobs:
  # ── Ansible lint ─────────────────────────────────────────────────────────
  ansible-lint:
    name: Ansible lint
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      # Inputs go through env, never interpolated into the script body.
      - name: Install ansible-lint
        env:
          ANSIBLE_LINT_VERSION: ${{ inputs.ansible-lint-version }}
        run: |
          # Pinned default instead of whatever PyPI serves today.
          # renovate: datasource=pypi depName=ansible-lint
          PINNED="26.10.1"
          pip install --quiet "ansible-lint${ANSIBLE_LINT_VERSION:-==$PINNED}"

      - name: Run ansible-lint
        env:
          ANSIBLE_DIR: ${{ inputs.ansible-dir }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        run: |
          if [[ "$FAIL_ON_ERROR" == "true" ]]; then
            ansible-lint "$ANSIBLE_DIR"
          else
            ansible-lint "$ANSIBLE_DIR" || true
          fi

  # ── Ansible syntax check ─────────────────────────────────────────────────
  ansible-syntax-check:
    name: Ansible syntax check
    if: inputs.run-syntax-check
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ansible
        env:
          ANSIBLE_VERSION: ${{ inputs.ansible-version }}
        run: |
          # Pinned default (needs Python >= 3.12 — older interpreters: set
          # ansible-version, e.g. '<12').
          # renovate: datasource=pypi depName=ansible
          PINNED="14.5.0"
          pip install --quiet "ansible${ANSIBLE_VERSION:-==$PINNED}"

      - name: Syntax check all playbooks
        env:
          ANSIBLE_DIR: ${{ inputs.ansible-dir }}
          PLAYBOOK_GLOB: ${{ inputs.playbook-glob }}
        run: |
          # The glob also matches non-playbook YAML that commonly sits next to
          # playbooks (requirements.yml, galaxy.yml, vars files…), on which
          # --syntax-check fails. A playbook is a list of plays: parse the file
          # (PyYAML ships with ansible) and keep it when a top-level list item
          # declares `hosts` or `import_playbook`, whatever the indentation.
          # Custom tags (!vault, !unsafe) are ignored; unparseable YAML is kept
          # so --syntax-check reports the error instead of skipping the file.
          is_playbook() {
            python3 - "$1" <<'PY'
          import sys, yaml
          class Loader(yaml.SafeLoader):
              pass
          Loader.add_multi_constructor("", lambda loader, suffix, node: None)
          try:
              with open(sys.argv[1]) as f:
                  docs = list(yaml.load_all(f, Loader=Loader))
          except yaml.YAMLError:
              sys.exit(0)
          keys = {"hosts", "import_playbook", "ansible.builtin.import_playbook"}
          sys.exit(0 if any(
              isinstance(doc, list)
              and any(isinstance(play, dict) and keys & play.keys() for play in doc)
              for doc in docs
          ) else 1)
          PY
          }

          found=0
          while IFS= read -r -d '' playbook; do
            if ! is_playbook "$playbook"; then
              echo "⏭️  $playbook skipped (not a playbook)"
              continue
            fi
            found=1
            echo "::group::Syntax check: $playbook"
            ansible-playbook --syntax-check "$playbook"
            echo "::endgroup::"
          done < <(find "$ANSIBLE_DIR" -maxdepth 1 -name "$PLAYBOOK_GLOB" -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "⚠️  No playbooks found in $ANSIBLE_DIR matching $PLAYBOOK_GLOB"
          fi
