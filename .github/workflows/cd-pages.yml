name: Deploy — GitHub Pages

on:
  workflow_call:
    inputs:
      working-directory:
        description: Path to the app (e.g. apps/client)
        type: string
        required: false
        default: '.'
      node-version:
        description: Node.js version
        type: string
        required: false
        default: '24'
      build-command:
        description: Build command to run (leave empty to auto-detect from package manager)
        type: string
        required: false
        default: ''
      output-directory:
        description: Build output directory relative to working-directory
        type: string
        required: false
        default: dist
    outputs:
      page-url:
        description: URL of the deployed GitHub Pages site
        value: ${{ jobs.deploy.outputs.page-url }}
    secrets:
      github-token:
        description: GitHub token passed as GITHUB_TOKEN env var to the build step (e.g. for scripts that call the GitHub API)
        required: false

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

jobs:
  build:
    name: Build (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    # The build runs the project's install/build scripts: read-only token.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup
        uses: $/.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
          # Routed through env (never interpolated into the script body) so a
          # caller-supplied build-command cannot inject shell at expansion time.
          BUILD_COMMAND: ${{ inputs.build-command }}
          PACKAGE_MANAGER: ${{ steps.setup.outputs.package-manager }}
        run: |
          if [ -n "$BUILD_COMMAND" ]; then
            sh -c "$BUILD_COMMAND"
          else
            "$PACKAGE_MANAGER" run build
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.output-directory }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write     # publish the Pages deployment
      id-token: write  # OIDC token deploy-pages uses to authenticate
    outputs:
      page-url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Summary
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
        run: |
          {
            echo "### 📄 GitHub Pages Deployed"
            echo ""
            echo "🌍 **URL:** ${PAGE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
