name: Security

# No concurrency group, on purpose (zizmor: concurrency-limits): even with
# cancel-in-progress: false, GitHub cancels older *pending* runs of a group,
# and each push scans only its own BEFORE..HEAD range — a skipped run would
# leave those commits unscanned for good.

on:
  workflow_call:
    inputs:
      run-osv-scan:
        description: >
          Audit the dependencies of every lockfile of the checkout, whatever
          the ecosystem, with OSV-Scanner. Replaces run-node-audit and
          run-python-audit.
        type: boolean
        required: false
        default: false
      run-node-audit:
        description: Deprecated, use run-osv-scan. Run pnpm audit on Node.js apps
        type: boolean
        required: false
        default: true
      node-working-directory:
        description: Deprecated, see run-node-audit. Path to Node.js app
        type: string
        required: false
        default: '.'
      run-python-audit:
        description: Deprecated, use run-osv-scan. Run pip-audit on Python apps
        type: boolean
        required: false
        default: false
      python-working-directory:
        description: Deprecated, see run-python-audit. Path to Python app
        type: string
        required: false
        default: '.'
      run-secret-scan:
        description: Run Gitleaks secret scanning
        type: boolean
        required: false
        default: true
      secret-scan-fetch-depth:
        description: >
          Clone depth for the secret scan. 0 (default) fetches the full history,
          which is what a first-ever scan needs — but on a repo carrying large
          blobs it makes every run pay for the whole history. A finite depth
          degrades safely: the push range (BEFORE..HEAD) or the PR range
          (base..head) is still scanned whenever both ends fall inside the
          fetched window, and otherwise the scan covers that window instead.
          Set it to a few dozen commits on a repo where the full clone
          dominates CI time.
        type: number
        required: false
        default: 0
      secret-scan-ignore-inline-allow:
        description: >
          Ignore inline `gitleaks:allow` comments (gitleaks --ignore-gitleaks-allow).
          Off by default so existing allow comments on test fixtures keep
          working — but such a comment lets a change silence the finding on its
          own line. Turn on for repositories that do not rely on them.
        type: boolean
        required: false
        default: false
      secret-scan-upload-sarif:
        description: >
          Upload the Gitleaks SARIF report to code scanning (the Security tab)
          when a leak is found. Code scanning needs GitHub Code Security on a
          private repository: turn this off there, the findings stay in the
          job log. The job requests `security-events: write` either way.
        type: boolean
        required: false
        default: true
      run-dependency-review:
        description: >
          On pull requests, fail when the change adds a dependency with a known
          vulnerability (actions/dependency-review-action). Needs the dependency
          graph — private repositories also need GitHub Advanced Security.
        type: boolean
        required: false
        default: false
      dependency-review-fail-on-severity:
        description: Lowest advisory severity that fails the review (low, moderate, high, critical)
        type: string
        required: false
        default: moderate
      run-codeql:
        description: Run CodeQL SAST analysis
        type: boolean
        required: false
        default: true
      codeql-languages:
        description: >
          JSON array of CodeQL languages (e.g. '["javascript-typescript","python"]').
          JavaScript and TypeScript are ONE CodeQL language: list
          "javascript-typescript" once rather than both names.
        type: string
        required: false
        default: '["javascript-typescript"]'

      runner:
        description: Runner labels as JSON — GitHub's (e.g. '"ubuntu-26.04"') or Ubicloud's (e.g. '"ubicloud-standard-2"')
        type: string
        required: false
        default: '"ubuntu-26.04"'

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

jobs:
  # ── Dependency audit (every ecosystem) ──────────────────────────────────────
  # One job for every lockfile of the checkout (npm, pnpm, bun, PyPI, Go,
  # Cargo, …) against the OSV database, which Renovate's vulnerability alerts
  # read too. Nothing is installed: the lockfiles are read as they are.
  osv-scan:
    name: Audit dependencies (OSV)
    if: inputs.run-osv-scan
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OSV-Scanner
        uses: $/.github/actions/osv-scan

  # The two jobs below are deprecated: osv-scan audits the same lockfiles. They
  # stay, with a warning, until the next breaking release.
  # ── Dependency audit (Node) ─────────────────────────────────────────────────
  audit-node:
    name: Audit Node.js dependencies
    if: inputs.run-node-audit
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 15
    # Nothing here needs more than reading the checkout: read-only token.
    permissions:
      contents: read

    steps:
      - name: Deprecated input
        run: echo "::warning title=Deprecated input::run-node-audit is deprecated, set run-osv-scan to true and run-node-audit to false. The per-ecosystem audits leave security.yml in the next breaking release."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No install: pnpm, npm and bun audit the lockfile against the advisory
      # database, so installing the project would be wasted time — and would
      # run the lifecycle scripts of every dependency in this job for nothing.
      # No dependency cache either: with nothing installed, restoring the
      # package store would only download it.
      - name: Setup Node.js
        id: setup
        uses: $/.github/actions/setup-node
        with:
          working-directory: ${{ inputs.node-working-directory }}
          install: 'false'
          cache: 'false'

      - name: Audit dependencies
        working-directory: ${{ inputs.node-working-directory }}
        env:
          AUDIT_CMD: ${{ steps.setup.outputs.audit-command }}
        # AUDIT_CMD is "<pnpm|npm|bun> audit --audit-level=high": word-split on
        # purpose.
        run: $AUDIT_CMD

  # ── Dependency audit (Python) ───────────────────────────────────────────────
  audit-python:
    name: Audit Python dependencies
    if: inputs.run-python-audit
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 15
    # Installing dependencies runs their lifecycle scripts: read-only token.
    permissions:
      contents: read

    steps:
      - name: Deprecated input
        run: echo "::warning title=Deprecated input::run-python-audit is deprecated, set run-osv-scan to true and run-python-audit to false. The per-ecosystem audits leave security.yml in the next breaking release."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `uv sync`: the audit reads the lockfile via `uv export`, so
      # installing the project (and building native deps) would be wasted.
      - name: Setup Python
        uses: $/.github/actions/setup-python
        with:
          working-directory: ${{ inputs.python-working-directory }}
          install: 'false'

      # A bare `uvx pip-audit` audits the throwaway environment uvx creates for
      # pip-audit itself, not the project. Export the locked dependency set and
      # audit that instead: fully pinned, so no resolution is needed.
      - name: pip-audit
        working-directory: ${{ inputs.python-working-directory }}
        run: |
          uv export --frozen --format requirements-txt --no-hashes \
            --no-emit-project --no-emit-workspace \
            > "$RUNNER_TEMP/requirements-audit.txt"
          # Pinned: a bare `uvx pip-audit` runs whatever PyPI serves that day.
          # renovate: datasource=pypi depName=pip-audit
          PIP_AUDIT_VERSION="2.10.1"
          uvx "pip-audit==${PIP_AUDIT_VERSION}" --no-deps --disable-pip \
            -r "$RUNNER_TEMP/requirements-audit.txt"

  # ── Secret scanning ─────────────────────────────────────────────────────────
  secret-scan:
    name: Scan for leaked secrets
    if: inputs.run-secret-scan
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 20
    permissions:
      security-events: write  # upload SARIF results to code scanning
      actions: read           # code scanning reads the workflow run metadata
      contents: read

    steps:
      # Depth 0 (the default) fetches everything. Callers on a history-heavy
      # repo can narrow it — the Gitleaks step below already falls back to
      # scanning whatever was fetched when the push range is out of reach.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.secret-scan-fetch-depth }}

      # No fetch-base: the scan walks base..HEAD, which needs the history in
      # between. A change base outside a shallow clone gives mode none.
      - name: Change base
        id: base
        uses: $/.github/actions/change-base

      # Installs the pinned Gitleaks, then scans base..HEAD (all fetched
      # history without a change base) with the config of a trusted commit:
      # the rules are at the top of the action's secret-scan.sh.
      - name: Gitleaks
        uses: $/.github/actions/secret-scan
        with:
          base: ${{ steps.base.outputs.base }}
          ignore-inline-allow: ${{ inputs.secret-scan-ignore-inline-allow }}
          # The upload step below reads the same file.
          report-path: results.sarif

      - name: Upload SARIF report
        if: failure() && inputs.secret-scan-upload-sarif && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: gitleaks

  # ── Dependency review (pull requests) ───────────────────────────────────────
  # Catches a vulnerable dependency BEFORE it is merged — the audits above only
  # see what the lockfile already contains. Reads the PR diff through the
  # dependency graph API: no checkout, no code from the PR is run.
  dependency-review:
    name: Dependency review
    if: inputs.run-dependency-review && startsWith(github.event_name, 'pull_request')
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dependency-review-fail-on-severity }}

  # ── CodeQL SAST ─────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: inputs.run-codeql
    runs-on: ${{ fromJson(inputs.runner) }}
    # Generous: an autobuild of a compiled language can take a while, but a
    # stuck one must not hold the runner for GitHub's default 6 hours.
    timeout-minutes: 90
    permissions:
      security-events: write  # upload SARIF results to code scanning
      actions: read           # code scanning reads the workflow run metadata
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(inputs.codeql-languages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compiled languages need a build; everything else is analysed from source
      # (build-mode none), which is faster and needs no toolchain on the runner.
      # java-kotlin stays on autobuild: build-mode none extracts Java only and
      # would silently drop Kotlin sources.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ contains(fromJson('["c-cpp","cpp","c","go","swift","java-kotlin","java","kotlin"]'), matrix.language) && 'autobuild' || 'none' }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
