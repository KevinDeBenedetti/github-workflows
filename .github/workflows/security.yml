name: Security

# No concurrency group, on purpose (zizmor: concurrency-limits): even with
# cancel-in-progress: false, GitHub cancels older *pending* runs of a group,
# and each push scans only its own BEFORE..HEAD range — a skipped run would
# leave those commits unscanned for good.

on:
  workflow_call:
    inputs:
      run-node-audit:
        description: Run pnpm audit on Node.js apps
        type: boolean
        required: false
        default: true
      node-working-directory:
        description: Path to Node.js app
        type: string
        required: false
        default: '.'
      run-python-audit:
        description: Run pip-audit on Python apps
        type: boolean
        required: false
        default: false
      python-working-directory:
        description: Path to Python app
        type: string
        required: false
        default: '.'
      run-secret-scan:
        description: Run Gitleaks secret scanning
        type: boolean
        required: false
        default: true
      secret-scan-fetch-depth:
        description: >
          Clone depth for the secret scan. 0 (default) fetches the full history,
          which is what a first-ever scan needs — but on a repo carrying large
          blobs it makes every run pay for the whole history. A finite depth
          degrades safely: the push range (BEFORE..HEAD) or the PR range
          (base..head) is still scanned whenever both ends fall inside the
          fetched window, and otherwise the scan covers that window instead.
          Set it to a few dozen commits on a repo where the full clone
          dominates CI time.
        type: number
        required: false
        default: 0
      secret-scan-ignore-inline-allow:
        description: >
          Ignore inline `gitleaks:allow` comments (gitleaks --ignore-gitleaks-allow).
          Off by default so existing allow comments on test fixtures keep
          working — but such a comment lets a change silence the finding on its
          own line. Turn on for repositories that do not rely on them.
        type: boolean
        required: false
        default: false
      run-dependency-review:
        description: >
          On pull requests, fail when the change adds a dependency with a known
          vulnerability (actions/dependency-review-action). Needs the dependency
          graph — private repositories also need GitHub Advanced Security.
        type: boolean
        required: false
        default: false
      dependency-review-fail-on-severity:
        description: Lowest advisory severity that fails the review (low, moderate, high, critical)
        type: string
        required: false
        default: moderate
      run-codeql:
        description: Run CodeQL SAST analysis
        type: boolean
        required: false
        default: true
      codeql-languages:
        description: >
          JSON array of CodeQL languages (e.g. '["javascript-typescript","python"]').
          JavaScript and TypeScript are ONE CodeQL language: list
          "javascript-typescript" once rather than both names.
        type: string
        required: false
        default: '["javascript-typescript"]'

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  workflow_dispatch:
    inputs:
      run-node-audit:
        description: Run pnpm audit on Node.js apps
        type: boolean
        default: true
      node-working-directory:
        description: Path to Node.js app
        type: string
        default: '.'
      run-python-audit:
        description: Run pip-audit on Python apps
        type: boolean
        default: false
      python-working-directory:
        description: Path to Python app
        type: string
        default: '.'
      run-secret-scan:
        description: Run Gitleaks secret scanning
        type: boolean
        default: true
      secret-scan-fetch-depth:
        description: Clone depth for the secret scan (0 = full history)
        type: number
        default: 0
      secret-scan-ignore-inline-allow:
        description: Ignore inline `gitleaks:allow` comments (gitleaks --ignore-gitleaks-allow)
        type: boolean
        default: false
      run-dependency-review:
        description: On pull requests, fail when the change adds a vulnerable dependency
        type: boolean
        default: false
      dependency-review-fail-on-severity:
        description: Lowest advisory severity that fails the review (low, moderate, high, critical)
        type: string
        default: moderate
      run-codeql:
        description: Run CodeQL SAST analysis
        type: boolean
        default: true
      codeql-languages:
        description: 'JSON array of CodeQL languages (e.g. ''["javascript-typescript","python"]'')'
        type: string
        default: '["javascript-typescript"]'

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

jobs:
  # ── Dependency audit (Node) ─────────────────────────────────────────────────
  audit-node:
    name: Audit Node.js dependencies
    if: inputs.run-node-audit
    runs-on: ${{ fromJson(inputs.runner) }}
    # Installing dependencies runs their lifecycle scripts: read-only token.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup
        uses: $/.github/actions/setup-node
        with:
          working-directory: ${{ inputs.node-working-directory }}

      - name: Audit dependencies
        working-directory: ${{ inputs.node-working-directory }}
        env:
          PACKAGE_MANAGER: ${{ steps.setup.outputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            bun) bun audit --audit-level=high ;;
            npm) npm audit --audit-level=high ;;
            *)   pnpm audit --audit-level=high ;;
          esac

  # ── Dependency audit (Python) ───────────────────────────────────────────────
  audit-python:
    name: Audit Python dependencies
    if: inputs.run-python-audit
    runs-on: ${{ fromJson(inputs.runner) }}
    # Installing dependencies runs their lifecycle scripts: read-only token.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `uv sync`: the audit reads the lockfile via `uv export`, so
      # installing the project (and building native deps) would be wasted.
      - name: Setup Python
        uses: $/.github/actions/setup-python
        with:
          working-directory: ${{ inputs.python-working-directory }}
          install: 'false'

      # A bare `uvx pip-audit` audits the throwaway environment uvx creates for
      # pip-audit itself, not the project. Export the locked dependency set and
      # audit that instead: fully pinned, so no resolution is needed.
      - name: pip-audit
        working-directory: ${{ inputs.python-working-directory }}
        run: |
          uv export --frozen --format requirements-txt --no-hashes \
            --no-emit-project --no-emit-workspace \
            > "$RUNNER_TEMP/requirements-audit.txt"
          uvx pip-audit --no-deps --disable-pip \
            -r "$RUNNER_TEMP/requirements-audit.txt"

  # ── Secret scanning ─────────────────────────────────────────────────────────
  secret-scan:
    name: Scan for leaked secrets
    if: inputs.run-secret-scan
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      security-events: write  # upload SARIF results to code scanning
      actions: read           # code scanning reads the workflow run metadata
      contents: read

    steps:
      # Depth 0 (the default) fetches everything. Callers on a history-heavy
      # repo can narrow it — the gitleaks step below already falls back to
      # scanning whatever was fetched when the push range is out of reach.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.secret-scan-fetch-depth }}

      - name: Install Gitleaks
        run: |
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION="8.30.1"
          # SHA-256 of the release asset per architecture, for the version above.
          # Refresh after a version bump: scripts/update-tool-checksums.py
          GITLEAKS_SHA256_amd64="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_SHA256_arm64="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
          case "$(uname -m)" in
            x86_64)        ARCH=x64;   KEY=amd64 ;;
            aarch64|arm64) ARCH=arm64; KEY=arm64 ;;
            *) echo "::error::unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          INSTALL_DIR="$RUNNER_TEMP/gitleaks"
          mkdir -p "$INSTALL_DIR"
          curl --retry 3 --retry-delay 5 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          if [ "$KEY" = amd64 ]; then WANT="$GITLEAKS_SHA256_amd64"; else WANT="$GITLEAKS_SHA256_arm64"; fi
          echo "$WANT  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict --quiet - \
            || { echo "::error::gitleaks ${GITLEAKS_VERSION} ($(uname -m)) does not match its pinned SHA-256 — after a version bump, run scripts/update-tool-checksums.py"; exit 1; }
          tar xz -C "$INSTALL_DIR" -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IGNORE_INLINE_ALLOW: ${{ inputs.secret-scan-ignore-inline-allow }}
        run: |
          has_commit() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }

          # Scan range, narrowest first. No --first-parent anywhere: on a PR,
          # HEAD is the synthetic merge commit whose first parent is the BASE
          # branch, and on a push to main after a merge commit the feature
          # commits only sit behind the second parent — following first parents
          # would skip exactly the commits that need scanning.
          #
          # TRUSTED is the commit the scanned range starts from: the gitleaks
          # config and ignore list are read from THERE, never from the commits
          # under scan. Gitleaks otherwise auto-loads .gitleaks.toml and
          # .gitleaksignore from the checkout, so a PR (or a push) could add an
          # allowlist matching everything and silence its own leaks.
          if [[ "$EVENT" == pull_request* ]] && has_commit "$PR_BASE_SHA" && has_commit "$PR_HEAD_SHA"; then
            # Every commit the PR brings, whatever the event action.
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
            TRUSTED="$PR_BASE_SHA"
          elif [ "$EVENT" = "push" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && has_commit "$BEFORE"; then
            RANGE="${BEFORE}..HEAD"
            TRUSTED="$BEFORE"
          else
            # First push of a branch, manual run, or the range fell outside a
            # shallow clone: scan everything that was fetched. No commit
            # predates the range, so the scan falls back to the default rules.
            RANGE=""
            TRUSTED=""
          fi

          # Fail closed: without a trusted copy, use gitleaks' default rules
          # (an explicit --config also stops the auto-load from the checkout)
          # and an empty ignore list.
          EXTEND_WATCH=()
          CFG_DIR="$RUNNER_TEMP/gitleaks-config"
          mkdir -p "$CFG_DIR"
          printf '[extend]\nuseDefault = true\n' > "$CFG_DIR/gitleaks.toml"
          : > "$CFG_DIR/.gitleaksignore"
          if [ -n "$TRUSTED" ]; then
            git show "${TRUSTED}:.gitleaks.toml" > "$CFG_DIR/gitleaks.toml" 2>/dev/null \
              || printf '[extend]\nuseDefault = true\n' > "$CFG_DIR/gitleaks.toml"
            git show "${TRUSTED}:.gitleaksignore" > "$CFG_DIR/.gitleaksignore" 2>/dev/null \
              || : > "$CFG_DIR/.gitleaksignore"
            # `[extend] path = "..."` is resolved against the working directory,
            # i.e. the checkout under scan: restore that file from TRUSTED too, or
            # the change could rewrite the extended config. Fail closed if absent.
            EXTEND_PATH=$(awk '
              /^[[:space:]]*\[/ { in_extend = ($0 ~ /^[[:space:]]*\[extend\]/) ; next }
              in_extend && /^[[:space:]]*path[[:space:]]*=/ {
                sub(/^[^=]*=[[:space:]]*["\047]/, ""); sub(/["\047].*$/, ""); print; exit
              }' "$CFG_DIR/gitleaks.toml")
            if [ -n "$EXTEND_PATH" ]; then
              EXTEND_REL="${EXTEND_PATH#./}"
              case "$EXTEND_REL" in
                /*|*..*) echo "::error::.gitleaks.toml extends '${EXTEND_PATH}' outside the repository — not supported by this workflow"; exit 1 ;;
              esac
              mkdir -p "$(dirname "$EXTEND_REL")"
              git show "${TRUSTED}:${EXTEND_REL}" > "$EXTEND_REL" 2>/dev/null \
                || { echo "::error::extended config '${EXTEND_REL}' not found at ${TRUSTED:0:7}"; exit 1; }
              EXTEND_WATCH=("$EXTEND_REL")
            fi
            # Config changes in the scanned range take effect once merged —
            # flag them so the reviewer looks at what they would silence.
            CHANGED=$(git diff --name-only "$RANGE" -- .gitleaks.toml .gitleaksignore "${EXTEND_WATCH[@]}" 2>/dev/null || true)
            if [ -n "$CHANGED" ]; then
              echo "::warning::This change modifies $(echo "$CHANGED" | tr '\n' ' ')— not applied to this scan (the config of ${TRUSTED:0:7} is used). Review what it allowlists before merging."
            fi
            # Inline `gitleaks:allow` comments silence the finding on their line.
            ALLOWS=$(git diff --unified=0 "$RANGE" 2>/dev/null | grep -c '^+.*gitleaks:allow' || true)
            if [ "${ALLOWS:-0}" -gt 0 ]; then
              echo "::warning::This change adds ${ALLOWS} \`gitleaks:allow\` comment(s), each silencing a finding — check them before merging (or set secret-scan-ignore-inline-allow)."
            fi
          fi

          # gitleaks ALWAYS reads .gitleaksignore from the scanned working tree,
          # on top of --gitleaks-ignore-path: overwrite the checked-out copy with
          # the trusted one (or empty it). Only the working tree changes — the
          # history under scan is read from git objects.
          if [ -e .gitleaksignore ]; then
            cp "$CFG_DIR/.gitleaksignore" .gitleaksignore
          fi

          INLINE_FLAG=()
          if [ "$IGNORE_INLINE_ALLOW" = "true" ]; then
            INLINE_FLAG=(--ignore-gitleaks-allow)
          fi

          # No trailing space when RANGE is empty: gitleaks splits --log-opts on
          # spaces, and the resulting empty argument makes `git log` yield
          # nothing — the scan then "passes" having read 0 bytes.
          LOG_OPTS="--no-merges${RANGE:+ $RANGE}"
          echo "Scanning: ${RANGE:-all fetched history} (config from ${TRUSTED:-gitleaks defaults})"
          gitleaks git --redact -v --exit-code=1 \
            --config "$CFG_DIR/gitleaks.toml" \
            --gitleaks-ignore-path "$CFG_DIR/.gitleaksignore" \
            "${INLINE_FLAG[@]}" \
            --report-format=sarif --report-path=results.sarif \
            --log-opts="$LOG_OPTS"

      - name: Upload SARIF report
        if: failure() && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: gitleaks

  # ── Dependency review (pull requests) ───────────────────────────────────────
  # Catches a vulnerable dependency BEFORE it is merged — the audits above only
  # see what the lockfile already contains. Reads the PR diff through the
  # dependency graph API: no checkout, no code from the PR is run.
  dependency-review:
    name: Dependency review
    if: inputs.run-dependency-review && startsWith(github.event_name, 'pull_request')
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: read

    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dependency-review-fail-on-severity }}

  # ── CodeQL SAST ─────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: inputs.run-codeql
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      security-events: write  # upload SARIF results to code scanning
      actions: read           # code scanning reads the workflow run metadata
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(inputs.codeql-languages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compiled languages need a build; everything else is analysed from source
      # (build-mode none), which is faster and needs no toolchain on the runner.
      # java-kotlin stays on autobuild: build-mode none extracts Java only and
      # would silently drop Kotlin sources.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ contains(fromJson('["c-cpp","cpp","c","go","swift","java-kotlin","java","kotlin"]'), matrix.language) && 'autobuild' || 'none' }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
