name: Deploy — Docs to Central Repo

on:
  workflow_call:
    inputs:
      docs-directory:
        description: 'Path to the docs folder in the calling repo'
        type: string
        required: false
        default: 'docs'
      target-repo:
        description: 'Centralized docs repository (owner/repo)'
        type: string
        required: false
        default: 'KevinDeBenedetti/kevindebenedetti.github.io'
      target-directory:
        description: >
          Logical name for this repo's docs in the central site
          (used as metadata in the dispatch payload).
          Defaults to the calling repository name (e.g. github-workflows).
        type: string
        required: false
        default: ''
      client-id:
        description: >
          Deprecated — leave empty. The central site now polls source repos for
          docs/ changes on a schedule, so no dispatch (and no App) is needed:
          with client-id empty this workflow only verifies the docs. When set,
          the legacy `docs-updated` repository_dispatch is still sent, using a
          token minted from this GitHub App (client-id + APP_PRIVATE_KEY).
        type: string
        required: false
        default: ''
    outputs:
      docs-synced:
        description: '"true" when the docs-updated dispatch was sent successfully.'
        value: ${{ jobs.dispatch.outputs.dispatched }}
    secrets:
      APP_PRIVATE_KEY:
        description: >
          Private key of the GitHub App (client-id). Only needed with the
          deprecated client-id input.
        required: false

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

jobs:
  # Verify the docs BEFORE dispatching, so a broken doc never triggers a failing
  # rebuild on the central site. If either check fails, `dispatch` is skipped.
  verify:
    name: Verify docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check docs links
        uses: $/.github/actions/check-docs-links
        with:
          docs-directory: ${{ inputs.docs-directory }}

      - name: Check VitePress markdown
        uses: $/.github/actions/check-vitepress-md
        with:
          docs-directory: ${{ inputs.docs-directory }}

  # Legacy push-based sync — skipped unless client-id is set (see the input).
  dispatch:
    name: Dispatch docs-updated → ${{ inputs.target-repo }}
    needs: verify
    if: inputs.client-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dispatched: ${{ steps.dispatch.outputs.dispatched }}

    steps:
      - name: Resolve target directory
        id: dirs
        env:
          INPUT_TARGET: ${{ inputs.target-directory }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          TARGET_DIR="${INPUT_TARGET:-$REPO_NAME}"
          echo "target=${TARGET_DIR}" >> "$GITHUB_OUTPUT"

      - name: Resolve target repo
        id: target
        env:
          TARGET_REPO: ${{ inputs.target-repo }}
        run: |
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET_REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo }}
          # Only what repository_dispatch needs — not the App's full installation scope.
          permission-contents: write

      - name: Dispatch docs-updated event
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: ${{ inputs.target-repo }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          DOCS_DIR: ${{ inputs.docs-directory }}
          TARGET_DIR: ${{ steps.dirs.outputs.target }}
        run: |
          gh api "repos/${TARGET_REPO}/dispatches" \
            --method POST \
            -f event_type=docs-updated \
            -f "client_payload[repo]=${SOURCE_REPO}" \
            -f "client_payload[ref]=${SOURCE_REF}" \
            -f "client_payload[sha]=${SOURCE_SHA}" \
            -f "client_payload[docs_directory]=${DOCS_DIR}" \
            -f "client_payload[target_directory]=${TARGET_DIR}"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      # Everything goes through env: github.ref_name is a branch name, and git
      # allows `$(...)` in those — interpolated into the script it would run.
      - name: Summary
        env:
          DOCS_DIR: ${{ inputs.docs-directory }}
          REF_NAME: ${{ github.ref_name }}
          TARGET_REPO: ${{ inputs.target-repo }}
        run: |
          {
            echo "### 📄 Docs Update Dispatched"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 📦 **Source repo** | \`${GITHUB_REPOSITORY}\` |"
            echo "| 📂 **Docs folder** | \`${DOCS_DIR}/\` |"
            echo "| 🔀 **Ref** | \`${REF_NAME}\` \`${GITHUB_SHA}\` |"
            echo "| 🎯 **Target** | \`${TARGET_REPO}\` |"
            echo "| ✅ **Status** | \`docs-updated\` event dispatched — rebuild triggered |"
          } >> "$GITHUB_STEP_SUMMARY"
