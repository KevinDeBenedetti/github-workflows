name: CI — Prometheus rules

# Validates PrometheusRule CRDs: PromQL parsing (`promtool check rules`) and
# alert behaviour (`promtool test rules`).
#
# Thin wrapper by design: it installs the tooling and runs the CALLER's scripts
# rather than re-implementing the CRD-unwrapping logic. A reusable workflow
# checks out the calling repo, so the same scripts back CI and the local prek
# hooks — no second copy of the logic to keep in sync.
#
# Caller requirements (defaults match KevinDeBenedetti/infra):
#   scripts/promtool-check.sh   PromQL syntax + lint
#   scripts/promtool-test.sh    alert unit tests (skipped if absent)

on:
  workflow_call:
    inputs:
      # ── Checks ────────────────────────────────────────────────────────────
      run-check:
        description: Run the PromQL syntax check script
        type: boolean
        required: false
        default: true
      run-test:
        description: Run the alert unit-test script (skipped if the script is absent)
        type: boolean
        required: false
        default: true
      # ── Config ────────────────────────────────────────────────────────────
      check-script:
        description: Path to the syntax-check script in the calling repo
        type: string
        required: false
        default: scripts/promtool-check.sh
      test-script:
        description: Path to the unit-test script in the calling repo
        type: string
        required: false
        default: scripts/promtool-test.sh
      promtool-version:
        description: Prometheus release providing promtool (without the leading v)
        type: string
        required: false
        # renovate: datasource=github-releases depName=prometheus/prometheus
        default: 3.13.2
      yq-version:
        description: mikefarah/yq release tag (with the leading v)
        type: string
        required: false
        # renovate: datasource=github-releases depName=mikefarah/yq
        default: v4.53.3

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  workflow_dispatch:
    inputs:
      run-check:
        description: Run the PromQL syntax check script
        type: boolean
        default: true
      run-test:
        description: Run the alert unit-test script
        type: boolean
        default: true
      check-script:
        description: Path to the syntax-check script in the calling repo
        type: string
        default: scripts/promtool-check.sh
      test-script:
        description: Path to the unit-test script in the calling repo
        type: string
        default: scripts/promtool-test.sh
      promtool-version:
        description: Prometheus release providing promtool (without the leading v)
        type: string
        # renovate: datasource=github-releases depName=prometheus/prometheus
        default: 3.13.2
      yq-version:
        description: mikefarah/yq release tag (with the leading v)
        type: string
        # renovate: datasource=github-releases depName=mikefarah/yq
        default: v4.53.3

      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

# The group carries the path input(s) so that one caller invoking this workflow
# several times in the same run (e.g. one call per directory) gets one group per
# call — with a shared group, cancel-in-progress makes the calls cancel each other.
concurrency:
  group: ci-prometheus-${{ github.workflow }}-${{ github.ref }}-${{ inputs.check-script }}
  cancel-in-progress: true

jobs:
  prometheus-rules:
    name: Prometheus rules
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install promtool + yq
        env:
          PROMTOOL_VERSION: ${{ inputs.promtool-version }}
          YQ_VERSION: ${{ inputs.yq-version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) echo "::error::unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/dl"
          mkdir -p "$bin" "$dl"

          # Both versions are caller inputs, so no checksum can be pinned here:
          # each asset is checked against the SHA-256 list published in the
          # same release (catches a corrupted or swapped asset, not a fully
          # compromised release).
          prom="prometheus-${PROMTOOL_VERSION}.linux-${arch}.tar.gz"
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}"
          curl -fsSL -o "$dl/$prom" "$base/$prom"
          curl -fsSL -o "$dl/prom-sha256sums.txt" "$base/sha256sums.txt"
          want=$(awk -v f="$prom" '$2 == f {print $1}' "$dl/prom-sha256sums.txt")
          echo "${want:?no SHA-256 for $prom in sha256sums.txt}  $dl/$prom" | sha256sum --check --strict --quiet -
          tar -xz -C "$bin" --strip-components=1 -f "$dl/$prom" "prometheus-${PROMTOOL_VERSION}.linux-${arch}/promtool"

          # yq publishes one `checksums` file with ~20 hash columns; their
          # order is listed in `checksums_hashes_order` (column 1 is the name).
          yq="yq_linux_${arch}"
          base="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}"
          curl -fsSL -o "$dl/$yq" "$base/$yq"
          curl -fsSL -o "$dl/yq-checksums" "$base/checksums"
          curl -fsSL -o "$dl/yq-checksums-order" "$base/checksums_hashes_order"
          col=$(grep -nx 'SHA-256' "$dl/yq-checksums-order" | cut -d: -f1)
          want=$(awk -v f="$yq" -v c="$(( ${col:?SHA-256 not listed in checksums_hashes_order} + 1 ))" '$1 == f {print $c}' "$dl/yq-checksums")
          echo "${want:?no SHA-256 for $yq in checksums}  $dl/$yq" | sha256sum --check --strict --quiet -
          install -m 0755 "$dl/$yq" "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"

      - name: promtool check rules
        if: inputs.run-check
        env:
          CHECK_SCRIPT: ${{ inputs.check-script }}
        run: |
          set -euo pipefail
          if [[ ! -f "$CHECK_SCRIPT" ]]; then
            echo "::error::${CHECK_SCRIPT} not found in the calling repository"
            exit 1
          fi
          bash "$CHECK_SCRIPT"

      # Unit tests are optional: a repo may ship rules without a test suite yet.
      - name: promtool test rules
        if: inputs.run-test
        env:
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          set -euo pipefail
          if [[ ! -f "$TEST_SCRIPT" ]]; then
            echo "::notice::${TEST_SCRIPT} not found — no alert unit tests to run"
            exit 0
          fi
          bash "$TEST_SCRIPT"
