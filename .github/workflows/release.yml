name: Release

on:
  workflow_call:
    inputs:
      release-type:
        description: >
          release-please release type (node, python, simple…) for a repository
          without a release-please config. When set, release-please builds its
          config from the inputs and ignores config-file and manifest-file.
        type: string
        required: false
        default: ''
      initial-version:
        description: >
          First version to release (e.g. '0.1.0', '1.0.0'), named in the warning
          printed when the manifest is not committed. release-please reads the
          manifest from the branch, never from this checkout, so the workflow
          cannot create it: commit it as {} and set "initial-version" in the
          release-please config.
        type: string
        required: false
        default: '1.0.0'
      config-file:
        description: >
          Path to release-please-config.json. Supports: root path or '.github/release/' folder.
          If not provided, checks in this order: .github/release/release-please-config.json, release-please-config.json
        type: string
        required: false
        default: ''
      manifest-file:
        description: >
          Path to .release-please-manifest.json. Supports: root path or '.github/release/' folder.
          If not provided, checks in this order: .github/release/.release-please-manifest.json, .release-please-manifest.json
        type: string
        required: false
        default: ''
      target-branch:
        description: >
          Branch the release PR targets and releases are cut from, e.g. 'dev'
          for pre-releases from a second branch (a config with
          "versioning": "prerelease" and "prerelease": true, and its own
          manifest). Empty: the repository's default branch.
        type: string
        required: false
        default: ''
      git-user-name:
        description: >
          Name used for the git tagger identity when moving the major version tag.
          Falls back to the GIT_USER_NAME repository variable, then 'github-actions[bot]'.
        type: string
        required: false
        default: ''
      git-user-email:
        description: >
          Email used for the git tagger identity when moving the major version tag.
          Falls back to the GIT_USER_EMAIL repository variable, then the Actions noreply address.
        type: string
        required: false
        default: ''
      runner:
        description: Runner labels as JSON — use '"ubuntu-26.04"' or '"my-scale-set"' (the name of an ARC runner scale set)
        type: string
        required: false
        default: '"ubuntu-26.04"'
      notify-reviewers:
        description: >
          Comma-separated GitHub usernames to request a review from on the
          release PR (e.g. 'octocat' or 'octocat,hubot'), so they get a GitHub
          notification. A user already asked to review that PR (by an earlier
          run, or by GitHub through CODEOWNERS) is skipped, so each user is
          notified at most once per release PR. Leave empty to disable.
        type: string
        required: false
        default: ''
      release-pending-label:
        description: >
          Label used to find the open release PR when release-please didn't
          create/update it this run (the fallback path for notify-reviewers).
          Must match release-please's pending label — override only if you
          customized `pull-request-label` in your release-please config.
        type: string
        required: false
        default: 'autorelease: pending'
      pre-major-alias:
        description: >
          Which alias tag(s) to move while the version is 0.x: 'both' (default)
          moves v0 and v0.<minor>; 'minor' moves only v0.<minor>, so callers on
          an alias never cross a breaking (minor) bump; 'major' moves only v0.
          Ignored from 1.0 on, where v<major> is moved.
        type: string
        required: false
        default: both
      app-client-id:
        description: >
          DEPRECATED, ignored (a warning is printed): the release runs on the
          job's GITHUB_TOKEN. Kept declared so callers that still pass it do
          not fail.
        type: string
        required: false
        default: ''
      app-workflows-permission:
        description: >
          DEPRECATED, ignored (see app-client-id).
        type: boolean
        required: false
        default: false
    secrets:
      RELEASE_TOKEN:
        description: >
          DEPRECATED, ignored (a warning is printed): the release runs on the
          job's GITHUB_TOKEN, so no token has to be created or rotated. Needs
          "Allow GitHub Actions to create and approve pull requests" in the
          repository settings; CI runs on release PRs opened this way wait for a
          manual "Approve workflows to run".
        required: false
      APP_PRIVATE_KEY:
        description: DEPRECATED, ignored (see app-client-id).
        required: false
    outputs:
      released:
        description: Whether a release was created
        value: ${{ jobs.release.outputs.released }}
      tag:
        description: Tag name of the release (e.g. v1.2.3)
        value: ${{ jobs.release.outputs.tag }}
      prerelease:
        description: Whether the release is a semver pre-release (e.g. v1.3.0-rc.2), which moves no alias tag
        value: ${{ jobs.release.outputs.prerelease }}

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: write        # release-please pushes the release branch and tags
      issues: write          # release-please labels the release PR (issues API)
      pull-requests: write   # open/update the release PR
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      prerelease: ${{ steps.kind.outputs.prerelease }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect release config paths
        id: detect-paths
        # Inputs are passed through env (not interpolated into the script body) so
        # a value containing shell metacharacters can't be executed — the standard
        # GitHub Actions script-injection guard.
        env:
          INPUT_CONFIG_FILE: ${{ inputs.config-file }}
          INPUT_MANIFEST_FILE: ${{ inputs.manifest-file }}
        shell: bash
        run: |
          # Determine config file path
          if [ -n "$INPUT_CONFIG_FILE" ]; then
            CONFIG_FILE="$INPUT_CONFIG_FILE"
          elif [ -f ".github/release/release-please-config.json" ]; then
            CONFIG_FILE=".github/release/release-please-config.json"
          else
            CONFIG_FILE="release-please-config.json"
          fi

          # Determine manifest file path
          if [ -n "$INPUT_MANIFEST_FILE" ]; then
            MANIFEST_FILE="$INPUT_MANIFEST_FILE"
          elif [ -f ".github/release/.release-please-manifest.json" ]; then
            MANIFEST_FILE=".github/release/.release-please-manifest.json"
          else
            MANIFEST_FILE=".release-please-manifest.json"
          fi

          {
            echo "config-file=$CONFIG_FILE"
            echo "manifest-file=$MANIFEST_FILE"
          } >> "$GITHUB_OUTPUT"
          echo "ℹ️ Using config: $CONFIG_FILE"
          echo "ℹ️ Using manifest: $MANIFEST_FILE"

      - name: Check the manifest is committed
        # release-please reads its config and manifest from the branch through
        # the API, never from this checkout: a manifest written here would be
        # ignored, and a missing one fails the release ("Missing required
        # manifest versions"). This step used to write one, to no effect.
        # Skipped with release-type, where no manifest is read at all.
        if: inputs.release-type == ''
        env:
          CONFIG_FILE: ${{ steps.detect-paths.outputs.config-file }}
          MANIFEST_FILE: ${{ steps.detect-paths.outputs.manifest-file }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
        shell: bash
        run: |
          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "::warning::${MANIFEST_FILE} is not committed, and release-please only reads it from the branch. To start the releases at ${INITIAL_VERSION}, commit ${MANIFEST_FILE} containing {} and set \"initial-version\": \"${INITIAL_VERSION}\" in ${CONFIG_FILE}."
          fi

      - name: Warn about deprecated token inputs
        # The release only uses the job's GITHUB_TOKEN. Callers that still pass
        # the App inputs or RELEASE_TOKEN keep working, with this warning.
        env:
          APP_INPUTS: ${{ inputs.app-client-id != '' || inputs.app-workflows-permission }}
          RELEASE_TOKEN_SET: ${{ secrets.RELEASE_TOKEN != '' }}
          APP_KEY_SET: ${{ secrets.APP_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          if [ "$APP_INPUTS" = "true" ] || [ "$RELEASE_TOKEN_SET" = "true" ] || [ "$APP_KEY_SET" = "true" ]; then
            echo "::warning::app-client-id, app-workflows-permission, APP_PRIVATE_KEY and RELEASE_TOKEN are deprecated and ignored: the release runs on GITHUB_TOKEN. Drop them from the caller (and enable 'Allow GitHub Actions to create and approve pull requests')."
          fi

      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          release-type: ${{ inputs.release-type || '' }}
          config-file: ${{ steps.detect-paths.outputs.config-file }}
          manifest-file: ${{ steps.detect-paths.outputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}

      - name: Classify the release
        id: kind
        # A semver pre-release tag (v1.3.0-rc.2, also my-lib-v1.3.0-beta.1)
        # must not move the alias tags: tag-workflows would point v1 (or v0
        # and v0.3) at a release candidate.
        if: steps.rp.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.rp.outputs.tag_name }}
        shell: bash
        run: |
          if [[ "$TAG" =~ [0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ $TAG is a pre-release: the alias tags stay where they are"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find release PRs to notify
        id: find-prs
        # release-please only sets `prs`/`prs_created` when it created or updated
        # a PR this run. An existing release PR left untouched (no new commits)
        # yields neither, yet may still need its (first-time) notification — e.g.
        # notify-reviewers was added after the PR opened, or the first attempt
        # failed. So prefer the `prs` output, but fall back to querying open
        # release PRs by the configured pending label. Duplicate notifications
        # are still prevented by the review-request check below.
        if: inputs.notify-reviewers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.rp.outputs.prs }}
          PENDING_LABEL: ${{ inputs.release-pending-label }}
          # The release PR of this flow only: with a target-branch flow next to
          # the default branch's, both PRs carry the pending label.
          BASE_BRANCH: ${{ inputs.target-branch || github.event.repository.default_branch }}
        shell: bash
        run: |
          BASE_ARGS=()
          if [ -n "$BASE_BRANCH" ]; then
            BASE_ARGS=(--base "$BASE_BRANCH")
          fi
          if [ -n "$PRS" ] && [ "$PRS" != "null" ]; then
            NUMBERS=$(echo "$PRS" | jq -r '.[].number')
          else
            NUMBERS=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --label "$PENDING_LABEL" \
              --state open \
              "${BASE_ARGS[@]}" \
              --json number --jq '.[].number' \
              || true)
          fi
          {
            echo "numbers<<EOF"
            echo "$NUMBERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "ℹ️ Release PRs to notify: ${NUMBERS:-none}"

      - name: Notify reviewers on release PR
        # Requests a review from each listed user who hasn't been asked to
        # review that PR yet: one notification per user and release PR, with
        # no @mention comment on top. "Asked" means any review_requested event
        # on the PR's timeline — from an earlier run of this step, or from
        # GitHub itself when the user owns the changed files (CODEOWNERS), in
        # which case the step leaves that user alone. Later runs (on any push
        # while the PR stays open) skip users already asked, even once they
        # have reviewed or been removed, so nobody is pinged twice.
        if: inputs.notify-reviewers != '' && steps.find-prs.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBERS: ${{ steps.find-prs.outputs.numbers }}
          REVIEWERS: ${{ inputs.notify-reviewers }}
        shell: bash
        run: |
          USERS=()
          IFS=',' read -ra ENTRIES <<< "$REVIEWERS"
          for u in "${ENTRIES[@]}"; do
            u="$(echo "$u" | xargs)"
            [ -n "$u" ] && USERS+=("$u")
          done

          echo "$NUMBERS" | while read -r pr; do
            [ -n "$pr" ] || continue
            # Every login ever asked to review the PR, by anyone.
            if ! ASKED=$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/${pr}/timeline" \
                --jq '.[] | select(.event == "review_requested") | .requested_reviewer.login // empty'); then
              echo "⚠️ Could not read the timeline of PR #$pr, skipping"
              continue
            fi
            MISSING=()
            for u in "${USERS[@]}"; do
              if grep -qixF -- "$u" <<< "$ASKED"; then
                echo "ℹ️ $u was already asked to review PR #$pr, skipping"
              else
                MISSING+=("$u")
              fi
            done
            [ "${#MISSING[@]}" -gt 0 ] || continue
            LIST="$(IFS=','; echo "${MISSING[*]}")"
            echo "ℹ️ Requesting review from $LIST on PR #$pr"
            gh pr edit "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --add-reviewer "$LIST" \
              || echo "⚠️ Could not request review on PR #$pr"
          done

  tag-workflows:
    name: Tag @v<major> alias (@v0.<minor> before 1.0)
    needs: release
    # A pre-release (see "Classify the release") moves no alias.
    if: needs.release.outputs.released == 'true' && needs.release.outputs.prerelease != 'true'
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: write  # move the major/minor alias tags

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not left in .git/config: the push below gets the token for its own
          # step only (GIT_CONFIG_* env), so no later step can read it from disk.
          persist-credentials: false

      - name: Move major version tag
        # e.g. v1.2.3 → also updates tag v1
        #
        # Before 1.0 (inputs.pre-major-alias): semver gives no stability promise
        # inside 0.x and release-please (with bump-minor-pre-major) ships
        # breaking changes as minor bumps, so a moving `v0` carries callers
        # across them. `minor` moves only v0.<minor> (v0.24.3 → v0.24); `major`
        # only v0; `both` (default, so existing @v0 callers keep receiving
        # releases) moves both.
        #
        # Why this is more than `git tag -f && git push --force`: pushing a tag
        # is a compare-and-swap against the value the *local* clone believes the
        # remote holds, and `--force` waives the fast-forward requirement, not
        # that check. So a job whose checkout predates a successful move fails
        # with `cannot lock ref 'refs/tags/vN': is at X but expected Y` — which
        # is what a re-run of an already-released run does, every time.
        # Observed on k3s-lab release 0.15.0: the alias had already been moved,
        # the re-run still tried to move it from the previous release's value,
        # and the job went red while the repository state was perfectly correct.
        #
        # Hence: re-sync the alias, do nothing when it is already right, and
        # only then move it.
        env:
          GIT_USER_NAME: ${{ inputs.git-user-name || vars.GIT_USER_NAME || 'github-actions[bot]' }}
          GIT_USER_EMAIL: ${{ inputs.git-user-email || vars.GIT_USER_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
          TAG: ${{ needs.release.outputs.tag }}
          PRE_MAJOR_ALIAS: ${{ inputs.pre-major-alias }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Same auth header actions/checkout would have persisted, scoped to
          # this step's git processes through the environment.
          AUTH="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}"

          MAJOR="${TAG%%.*}"  # v1.2.3 → v1

          if [ -z "$TAG" ] || [ "$MAJOR" = "$TAG" ]; then
            echo "::error::unusable release tag '$TAG' — expected vMAJOR.MINOR.PATCH"
            exit 1
          fi

          ALIASES=("$MAJOR")
          if [ "$MAJOR" = "v0" ]; then
            MINOR="${TAG#v0.}"
            MINOR_ALIAS="v0.${MINOR%%.*}"  # v0.24.3 → v0.24
            case "$PRE_MAJOR_ALIAS" in
              both)  ALIASES=(v0 "$MINOR_ALIAS") ;;
              minor) ALIASES=("$MINOR_ALIAS") ;;
              major) ALIASES=(v0) ;;
              *) echo "::error::unsupported pre-major-alias '$PRE_MAJOR_ALIAS' (expected both, minor or major)"; exit 1 ;;
            esac
          fi

          git config user.name  "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          # The release tag straight from the remote: it may not be in a
          # shallow checkout.
          git fetch --force --no-tags origin \
            "refs/tags/${TAG}:refs/tags/${TAG}" || {
              echo "::error::release tag ${TAG} not found on the remote"
              exit 1
            }
          target="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"

          move_alias() {
            local alias="$1" current attempt
            # The alias from the remote too: it is what the push compares against.
            git fetch --force --no-tags origin \
              "refs/tags/${alias}:refs/tags/${alias}" 2>/dev/null || true
            current="$(git rev-parse --verify --quiet "refs/tags/${alias}^{commit}" || true)"

            if [ "$current" = "$target" ]; then
              echo "✅ ${alias} already points at ${TAG} (${target}) — nothing to do"
              return 0
            fi

            # Tag the release commit explicitly rather than HEAD: the alias must
            # track the release, not whatever the checkout happens to sit on.
            git tag -fa "$alias" -m "Release $TAG" "$target"

            for attempt in 1 2 3; do
              if git push --force origin "refs/tags/${alias}"; then
                echo "✅ ${alias} → ${TAG} (${target})"
                return 0
              fi
              echo "⚠️  push of ${alias} rejected (attempt ${attempt}/3) — re-syncing"
              git fetch --force --no-tags origin \
                "refs/tags/${alias}:refs/tags/${alias}" 2>/dev/null || true
              current="$(git rev-parse --verify --quiet "refs/tags/${alias}^{commit}" || true)"
              if [ "$current" = "$target" ]; then
                echo "✅ ${alias} already points at ${TAG} — moved concurrently"
                return 0
              fi
              git tag -fa "$alias" -m "Release $TAG" "$target"
              sleep 3
            done

            echo "::error::could not move ${alias} to ${TAG} after 3 attempts"
            return 1
          }

          for alias in "${ALIASES[@]}"; do
            move_alias "$alias"
          done
