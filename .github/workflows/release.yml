name: Release

on:
  workflow_call:
    inputs:
      release-type:
        description: release-please release type (node, python, simple…). Ignored when config-file is provided.
        type: string
        required: false
        default: ''
      initial-version:
        description: >
          Initial version for new releases (e.g., '0.1.0', '1.0.0').
          Only used if manifest file doesn't exist. Customize per repository needs.
        type: string
        required: false
        default: '1.0.0'
      config-file:
        description: >
          Path to release-please-config.json. Supports: root path or '.github/release/' folder.
          If not provided, checks in this order: .github/release/release-please-config.json, release-please-config.json
        type: string
        required: false
        default: ''
      manifest-file:
        description: >
          Path to .release-please-manifest.json. Supports: root path or '.github/release/' folder.
          If not provided, checks in this order: .github/release/.release-please-manifest.json, .release-please-manifest.json
        type: string
        required: false
        default: ''
      git-user-name:
        description: >
          Name used for the git tagger identity when moving the major version tag.
          Falls back to the GIT_USER_NAME repository variable, then 'github-actions[bot]'.
        type: string
        required: false
        default: ''
      git-user-email:
        description: >
          Email used for the git tagger identity when moving the major version tag.
          Falls back to the GIT_USER_EMAIL repository variable, then the Actions noreply address.
        type: string
        required: false
        default: ''
      runner:
        description: Runner labels as JSON — use '"ubuntu-latest"' or '["self-hosted","linux","k3s","kaniko"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
      notify-reviewers:
        description: >
          Comma-separated GitHub usernames to request a review from on the
          release PR (e.g. 'octocat' or 'octocat,hubot'). Each user is added as
          a requested reviewer so they get a GitHub notification. Each release PR
          is notified at most once (tracked via a hidden marker comment), so
          re-runs on later pushes won't re-request or re-ping. Leave empty to disable.
        type: string
        required: false
        default: ''
      release-pending-label:
        description: >
          Label used to find the open release PR when release-please didn't
          create/update it this run (the fallback path for notify-reviewers).
          Must match release-please's pending label — override only if you
          customized `pull-request-label` in your release-please config.
        type: string
        required: false
        default: 'autorelease: pending'
      pre-major-alias:
        description: >
          Which alias tag(s) to move while the version is 0.x: 'both' (default)
          moves v0 and v0.<minor>; 'minor' moves only v0.<minor>, so callers on
          an alias never cross a breaking (minor) bump; 'major' moves only v0.
          Ignored from 1.0 on, where v<major> is moved.
        type: string
        required: false
        default: both
      app-client-id:
        description: >
          Client ID (or App ID) of a GitHub App installed on this repo with
          contents/pull-requests/issues write. When set, a short-lived App token
          is minted and used instead of GITHUB_TOKEN, so the release PR is
          attributed to the App rather than github-actions[bot] — this avoids the
          manual workflow-approval gate and lets CI run on the release PR.
          If release-please `extra-files` include files under .github/workflows/
          (e.g. x-release-please-version pins), the App also needs
          Workflows: write — otherwise release-please fails with "Error adding
          to tree". GITHUB_TOKEN can never update workflow files.
        type: string
        required: false
        default: ''
      app-workflows-permission:
        description: >
          Also request `workflows: write` on the App token. Needed when the
          release PR updates files under .github/workflows/ (release-please
          extra-files); the App must have that permission.
        type: boolean
        required: false
        default: false
    secrets:
      RELEASE_TOKEN:
        description: PAT with write access (defaults to GITHUB_TOKEN if not set)
        required: false
      APP_PRIVATE_KEY:
        description: Private key of the GitHub App referenced by app-client-id.
        required: false
    outputs:
      released:
        description: Whether a release was created
        value: ${{ jobs.release.outputs.released }}
      tag:
        description: Tag name of the release (e.g. v1.2.3)
        value: ${{ jobs.release.outputs.tag }}

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect release config paths
        id: detect-paths
        # Inputs are passed through env (not interpolated into the script body) so
        # a value containing shell metacharacters can't be executed — the standard
        # GitHub Actions script-injection guard.
        env:
          INPUT_CONFIG_FILE: ${{ inputs.config-file }}
          INPUT_MANIFEST_FILE: ${{ inputs.manifest-file }}
          INPUT_INITIAL_VERSION: ${{ inputs.initial-version }}
        shell: bash
        run: |
          # Determine config file path
          if [ -n "$INPUT_CONFIG_FILE" ]; then
            CONFIG_FILE="$INPUT_CONFIG_FILE"
          elif [ -f ".github/release/release-please-config.json" ]; then
            CONFIG_FILE=".github/release/release-please-config.json"
          else
            CONFIG_FILE="release-please-config.json"
          fi

          # Determine manifest file path
          if [ -n "$INPUT_MANIFEST_FILE" ]; then
            MANIFEST_FILE="$INPUT_MANIFEST_FILE"
          elif [ -f ".github/release/.release-please-manifest.json" ]; then
            MANIFEST_FILE=".github/release/.release-please-manifest.json"
          else
            MANIFEST_FILE=".release-please-manifest.json"
          fi

          {
            echo "config-file=$CONFIG_FILE"
            echo "manifest-file=$MANIFEST_FILE"
            echo "initial-version=$INPUT_INITIAL_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "ℹ️ Using config: $CONFIG_FILE"
          echo "ℹ️ Using manifest: $MANIFEST_FILE"
          echo "ℹ️ Initial version: $INPUT_INITIAL_VERSION"

      - name: Initialize manifest with custom version
        env:
          MANIFEST_FILE: ${{ steps.detect-paths.outputs.manifest-file }}
          INITIAL_VERSION: ${{ steps.detect-paths.outputs.initial-version }}
        shell: bash
        run: |
          if [ ! -f "$MANIFEST_FILE" ]; then
            mkdir -p "$(dirname "$MANIFEST_FILE")"
            # printf %s keeps the version a literal value (never shell-expanded)
            printf '{\n  ".": "%s"\n}\n' "$INITIAL_VERSION" > "$MANIFEST_FILE"
            echo "✅ Created manifest with initial version: $INITIAL_VERSION"
          fi

      - name: Generate App token
        id: app-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Scoped to what release-please and the reviewer notification need,
          # instead of every permission of the App installation.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          # Only when the release PR edits files under .github/workflows/
          # (e.g. x-release-please-version pins): GitHub refuses such pushes
          # without it. Requesting it fails if the App does not have it.
          permission-workflows: ${{ inputs.app-workflows-permission && 'write' || '' }}

      - name: Resolve token
        # Single source of truth for the auth token used by every step below:
        # App token (if app-client-id set) → RELEASE_TOKEN PAT → GITHUB_TOKEN.
        # Masked and exposed once as a step output so the precedence lives in one
        # place instead of being repeated in each step's expression.
        id: token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TOKEN="${APP_TOKEN:-${RELEASE_TOKEN:-$GITHUB_TOKEN}}"
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.token.outputs.value }}
          release-type: ${{ inputs.release-type || '' }}
          config-file: ${{ steps.detect-paths.outputs.config-file }}
          manifest-file: ${{ steps.detect-paths.outputs.manifest-file }}

      - name: Find release PRs to notify
        id: find-prs
        # release-please only sets `prs`/`prs_created` when it created or updated
        # a PR this run. An existing release PR left untouched (no new commits)
        # yields neither, yet may still need its (first-time) notification — e.g.
        # notify-reviewers was added after the PR opened, or the first attempt
        # failed. So prefer the `prs` output, but fall back to querying open
        # release PRs by the configured pending label. Duplicate notifications
        # are still prevented by the marker guard below.
        if: inputs.notify-reviewers != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          PRS: ${{ steps.rp.outputs.prs }}
          PENDING_LABEL: ${{ inputs.release-pending-label }}
        shell: bash
        run: |
          if [ -n "$PRS" ] && [ "$PRS" != "null" ]; then
            NUMBERS=$(echo "$PRS" | jq -r '.[].number')
          else
            NUMBERS=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --label "$PENDING_LABEL" \
              --state open \
              --json number --jq '.[].number' \
              || true)
          fi
          {
            echo "numbers<<EOF"
            echo "$NUMBERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "ℹ️ Release PRs to notify: ${NUMBERS:-none}"

      - name: Notify reviewers on release PR
        # Requests a review AND posts an @mention comment on each release PR.
        # A review request alone is easy to miss (notification settings vary),
        # but an @mention reliably reaches the user. Both actions are gated by a
        # single hidden marker comment: once a PR has been notified, later runs
        # (on any push while the PR stays open) skip it entirely — so reviewers
        # are never re-requested or re-pinged. Each PR is notified at most once.
        if: inputs.notify-reviewers != '' && steps.find-prs.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          NUMBERS: ${{ steps.find-prs.outputs.numbers }}
          REVIEWERS: ${{ inputs.notify-reviewers }}
        shell: bash
        run: |
          # Hidden marker so re-runs don't re-request reviewers or repost comments.
          MARKER="<!-- release-please-notify -->"

          # Build "@user1 @user2" from the comma-separated reviewer list.
          MENTIONS=""
          IFS=',' read -ra USERS <<< "$REVIEWERS"
          for u in "${USERS[@]}"; do
            u="$(echo "$u" | xargs)"
            [ -n "$u" ] && MENTIONS="${MENTIONS}@${u} "
          done

          echo "$NUMBERS" | while read -r pr; do
            [ -n "$pr" ] || continue
            if gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json comments \
                --jq '.comments[].body' 2>/dev/null | grep -qF "$MARKER"; then
              echo "ℹ️ Already notified on PR #$pr, skipping"
              continue
            fi
            echo "ℹ️ Requesting review from $REVIEWERS on PR #$pr"
            gh pr edit "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --add-reviewer "$REVIEWERS" \
              || echo "⚠️ Could not request review on PR #$pr"
            echo "ℹ️ Commenting on PR #$pr"
            gh pr comment "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --body "${MARKER}"$'\n'"🚀 ${MENTIONS}a new release PR is ready for review." \
              || echo "⚠️ Could not comment on PR #$pr"
          done

  tag-workflows:
    name: Tag @v<major> alias (@v0.<minor> before 1.0)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ fromJson(inputs.runner) }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # git push of the alias tag below uses these credentials

      - name: Move major version tag
        # e.g. v1.2.3 → also updates tag v1
        # e.g. v1.2.3 → also updates tag v1
        #
        # Before 1.0 (inputs.pre-major-alias): semver gives no stability promise
        # inside 0.x and release-please (with bump-minor-pre-major) ships
        # breaking changes as minor bumps, so a moving `v0` carries callers
        # across them. `minor` moves only v0.<minor> (v0.24.3 → v0.24); `major`
        # only v0; `both` (default, so existing @v0 callers keep receiving
        # releases) moves both.
        #
        # Why this is more than `git tag -f && git push --force`: pushing a tag
        # is a compare-and-swap against the value the *local* clone believes the
        # remote holds, and `--force` waives the fast-forward requirement, not
        # that check. So a job whose checkout predates a successful move fails
        # with `cannot lock ref 'refs/tags/vN': is at X but expected Y` — which
        # is what a re-run of an already-released run does, every time.
        # Observed on k3s-lab release 0.15.0: the alias had already been moved,
        # the re-run still tried to move it from the previous release's value,
        # and the job went red while the repository state was perfectly correct.
        #
        # Hence: re-sync the alias, do nothing when it is already right, and
        # only then move it.
        env:
          GIT_USER_NAME: ${{ inputs.git-user-name || vars.GIT_USER_NAME || 'github-actions[bot]' }}
          GIT_USER_EMAIL: ${{ inputs.git-user-email || vars.GIT_USER_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
          TAG: ${{ needs.release.outputs.tag }}
          PRE_MAJOR_ALIAS: ${{ inputs.pre-major-alias }}
        run: |
          set -euo pipefail

          MAJOR="${TAG%%.*}"  # v1.2.3 → v1

          if [ -z "$TAG" ] || [ "$MAJOR" = "$TAG" ]; then
            echo "::error::unusable release tag '$TAG' — expected vMAJOR.MINOR.PATCH"
            exit 1
          fi

          ALIASES=("$MAJOR")
          if [ "$MAJOR" = "v0" ]; then
            MINOR="${TAG#v0.}"
            MINOR_ALIAS="v0.${MINOR%%.*}"  # v0.24.3 → v0.24
            case "$PRE_MAJOR_ALIAS" in
              both)  ALIASES=(v0 "$MINOR_ALIAS") ;;
              minor) ALIASES=("$MINOR_ALIAS") ;;
              major) ALIASES=(v0) ;;
              *) echo "::error::unsupported pre-major-alias '$PRE_MAJOR_ALIAS' (expected both, minor or major)"; exit 1 ;;
            esac
          fi

          git config user.name  "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          # The release tag straight from the remote: it may not be in a
          # shallow checkout.
          git fetch --force --no-tags origin \
            "refs/tags/${TAG}:refs/tags/${TAG}" || {
              echo "::error::release tag ${TAG} not found on the remote"
              exit 1
            }
          target="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"

          move_alias() {
            local alias="$1" current attempt
            # The alias from the remote too: it is what the push compares against.
            git fetch --force --no-tags origin \
              "refs/tags/${alias}:refs/tags/${alias}" 2>/dev/null || true
            current="$(git rev-parse --verify --quiet "refs/tags/${alias}^{commit}" || true)"

            if [ "$current" = "$target" ]; then
              echo "✅ ${alias} already points at ${TAG} (${target}) — nothing to do"
              return 0
            fi

            # Tag the release commit explicitly rather than HEAD: the alias must
            # track the release, not whatever the checkout happens to sit on.
            git tag -fa "$alias" -m "Release $TAG" "$target"

            for attempt in 1 2 3; do
              if git push --force origin "refs/tags/${alias}"; then
                echo "✅ ${alias} → ${TAG} (${target})"
                return 0
              fi
              echo "⚠️  push of ${alias} rejected (attempt ${attempt}/3) — re-syncing"
              git fetch --force --no-tags origin \
                "refs/tags/${alias}:refs/tags/${alias}" 2>/dev/null || true
              current="$(git rev-parse --verify --quiet "refs/tags/${alias}^{commit}" || true)"
              if [ "$current" = "$target" ]; then
                echo "✅ ${alias} already points at ${TAG} — moved concurrently"
                return 0
              fi
              git tag -fa "$alias" -m "Release $TAG" "$target"
              sleep 3
            done

            echo "::error::could not move ${alias} to ${TAG} after 3 attempts"
            return 1
          }

          for alias in "${ALIASES[@]}"; do
            move_alias "$alias"
          done
