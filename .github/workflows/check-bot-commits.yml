name: Check Bot Commits

on:
  workflow_call:
    inputs:
      allowed-bots:
        description: >
          JSON array of bot logins whose commits are permitted
          (e.g. '["dependabot[bot]","renovate[bot]"]'). Empty by default — all bot commits fail.
        type: string
        required: false
        default: '[]'
      fail-on-bot-commits:
        description: Fail the workflow when bot commits are found (set false to warn only)
        type: boolean
        required: false
        default: true
      runner:
        description: Runner labels as JSON — GitHub's (e.g. '"ubuntu-26.04"') or Ubicloud's (e.g. '"ubicloud-standard-2"')
        type: string
        required: false
        default: '"ubuntu-26.04"'

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

# A newer push to the pull request supersedes the check in progress.
concurrency:
  group: check-bot-commits-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Guard: no bot-authored commits in PRs ──────────────────────────────────
  check-authors:
    name: Check for bot-authored commits
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read     # list the commits of the pull request

    steps:
      # The rules and the job summary are the action's: check-bot-commits.sh.
      - name: Check commit authors
        uses: $/.github/actions/check-bot-commits
        with:
          allowed-bots: ${{ inputs.allowed-bots }}
          fail-on-bot-commits: ${{ inputs.fail-on-bot-commits }}
