# =============================================================================
# CI / CD — Self-test the reusable workflows, then release & sync docs
#
# Single workflow wiring this repo's own reusable workflows. The CI jobs run on
# every push and PR (via local `./` refs, so a PR tests its own version of the
# workflow, not the published @main one). The release job is the CD half: it
# gates on the CI jobs so release-please only opens/tags once main is green.
#
# The reusable workflows reach their composite actions with `uses: $/…`,
# which GitHub resolves to the commit the workflow runs from: ci-shell below
# exercises them at this PR's commit, as callers will at a release tag.
# ci-actions also runs them through `./` refs, which actionlint can check
# (it does not know `$/` yet — see .github/actionlint.yaml).
#
# Jobs:
#   ci-shell     — shellcheck + actionlint + bats + docs checks (ci-shell.yml) [push + PR]
#   ci-zizmor    — GitHub Actions security lint (zizmor)                [push + PR]
#   ci-actions   — same checks through the local composite actions            [push + PR]
#   ci-commits   — Conventional Commits on every new commit             [push + PR]
#   security     — Gitleaks + dependency review + CodeQL (security.yml)  [push + PR]
#   ci-gate      — single required check: all CI jobs above passed      [push + PR]
#   pr-description — PR body written by Claude Code (pr-description.yml) [PR, outside the gate]
#   release      — release-please PR + tags (release.yml)                [push to main only]
# =============================================================================
name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel in-progress release runs on a follow-up push to main —
  # only superseded PR runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ── CI — Shell ───────────────────────────────────────────────────────────────
  # Every CI job also runs on the release-please PR and the release commit: the
  # workflows reach their own actions with `uses: $/…`, so nothing in a release
  # PR points at a tag that does not exist yet. (A PR opened by GITHUB_TOKEN
  # waits for "Approve workflows to run".) A tested and SAST-checked release PR
  # is also what Scorecard's CI-Tests and SAST checks count.
  ci-shell:
    name: CI — Shell
    uses: ./.github/workflows/ci-shell.yml
    with:
      run-shellcheck: true
      run-actionlint: true
      # Unit tests of the docs-check scripts (tests/*.bats).
      run-bats: true
      bats-tests-dir: tests/
      bats-submodules: false
      # Verify this repo's own docs/ stay VitePress-safe and self-contained:
      # the central docs site polls this repo and rebuilds from these files.
      run-docs-link-check: true
      run-vitepress-check: true
      # actionlint >= 1.7.12 ships stale metadata for actions/create-github-app-token@v3
      # and falsely flags the `client-id` input / a "missing app-id". Ignore those
      # messages so a future actionlint bump doesn't break CI on release.yml.
      # The value must stay quote-free: the action word-splits flags unquoted.
      actionlint-flags: -ignore create-github-app-token
    permissions:
      contents: read

  # ── CI — Local composite actions ─────────────────────────────────────────────
  # Runs this checkout's ./.github/actions/* (not the @vX.Y.Z pins ci-shell.yml
  # uses), so a PR that changes an action tests its own version of it.
  ci-actions:
    name: CI — Local actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Audit mode: records every outbound connection of the job (visible in
      # the run's StepSecurity insights) without blocking anything yet. Once
      # the baseline is known, switch to `egress-policy: block` with an
      # allowed-endpoints list. Note: audit mode reports to the StepSecurity API.
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck (local action)
        uses: ./.github/actions/shellcheck

      - name: actionlint (local action)
        uses: ./.github/actions/actionlint
        with:
          # See ci-shell above for why create-github-app-token is ignored.
          flags: -ignore create-github-app-token

      - name: Bats (local action)
        uses: ./.github/actions/bats
        with:
          tests-dir: tests/

      - name: Docs link check (local action)
        uses: ./.github/actions/check-docs-links

      - name: VitePress markdown check (local action)
        uses: ./.github/actions/check-vitepress-md

      # The hash-locked ansible tools: a Renovate PR that regenerates a lock
      # must prove it still installs, every hash matching, and the tools run.
      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: setup-ansible, ansible-lint (local action)
        uses: ./.github/actions/setup-ansible
        with:
          tool: ansible-lint

      - name: setup-ansible, ansible (local action)
        uses: ./.github/actions/setup-ansible
        with:
          tool: ansible

      - name: Locked tools run
        run: |
          ansible-lint --version
          ansible-playbook --version

      # The pinned Claude Code binary: a Renovate PR that bumps its version
      # must prove that the pinned SHA-256 values were refreshed with it.
      - name: setup-claude-code (local action)
        uses: ./.github/actions/setup-claude-code

      - name: Claude Code runs
        env:
          DISABLE_AUTOUPDATER: '1'
        run: claude --version

  # ── CI — zizmor (GitHub Actions security lint) ───────────────────────────────
  # Template injection, over-broad permissions, unpinned uses, credential
  # persistence… across every workflow and composite action of this repo.
  # Policy in .github/zizmor.yml. Online audits (impostor commits behind SHA
  # pins, known-vulnerable action versions) use the read-only job token.
  ci-zizmor:
    name: CI — zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Audit mode: records every outbound connection of the job (visible in
      # the run's StepSecurity insights) without blocking anything yet. Once
      # the baseline is known, switch to `egress-policy: block` with an
      # allowed-endpoints list. Note: audit mode reports to the StepSecurity API.
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The official action installs zizmor from a hash-locked wheel
      # (pip --require-hashes) — unlike `pipx run`, nothing unverified runs.
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # renovate: datasource=pypi depName=zizmor
          version: 1.31.1
          # Strictest persona: the repo is clean at this level, so any new
          # finding (even code-quality ones) fails the job. Exceptions are
          # justified in .github/zizmor.yml or inline.
          persona: pedantic
          # Annotations instead of a SARIF upload: no security-events: write.
          advanced-security: false
          annotations: true

  # ── CI — prek hooks ──────────────────────────────────────────────────────────
  # Self-test of ci-prek.yml, and the server-side gate for this repo's own hooks
  # (prek.toml): trailing whitespace, check-yaml/json, actionlint, and the
  # renovate-config-validator that nothing else runs.
  ci-prek:
    name: CI — prek hooks
    uses: ./.github/workflows/ci-prek.yml
    permissions:
      contents: read

  # ── Security ─────────────────────────────────────────────────────────────────
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    with:
      run-node-audit: false
      run-python-audit: false
      run-secret-scan: true
      # SAST on every PR and push: CodeQL for the workflows and composite
      # actions themselves (`actions`) and the helper scripts (`python`).
      run-codeql: true
      codeql-languages: '["actions","python"]'
      # The dependency graph covers GitHub Actions: a PR pinning an action
      # with a known advisory fails here.
      run-dependency-review: true
    permissions:
      security-events: write  # upload SARIF results to code scanning
      actions: read           # code scanning reads the workflow run metadata
      contents: read
      pull-requests: read     # list the commits of the pull request

  # ── CI — Commit messages ─────────────────────────────────────────────────────
  # Conventional Commits on every new commit (the same script as the prek
  # commit-msg hook): PR → base..head, push → before..after. A push that
  # creates a branch has no `before` and is left to the PR check.
  ci-commits:
    name: CI — Commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE}..${AFTER}"
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"

      - name: Conventional Commits (local action)
        if: steps.range.outputs.range != ''
        uses: ./.github/actions/check-commit-msg
        with:
          range: ${{ steps.range.outputs.range }}

  # ── PR description (Claude Code) ─────────────────────────────────────────────
  # Self-test of pr-description.yml, and the descriptions of this repo's own
  # pull requests. Outside the CI gate on purpose: a missing token or a model
  # error must never block a merge. The called workflow skips bot and fork
  # pull requests by itself.
  pr-description:
    name: PR description
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-description.yml
    permissions:
      contents: read          # check out the pull request history
      pull-requests: write    # rewrite the managed block of the PR body
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # ── CI — Gate ────────────────────────────────────────────────────────────────
  # The main branch ruleset's single required check: one stable name, so adding
  # or renaming a CI job never touches the ruleset (reusable-workflow checks
  # are named "Caller / Callee job"). Passes only when every job succeeded.
  ci-gate:
    name: CI — Gate
    needs: [ci-shell, ci-actions, ci-zizmor, ci-prek, ci-commits, security]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check CI results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "CI results: ${RESULTS}"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a CI job ended with '${result}'"
              exit 1
            fi
          done

  # ── Release (release-please) ─────────────────────────────────────────────────
  # CD half: push-to-main only (the CI jobs above also run on PRs). Gated on the
  # CI gate, so release-please only acts once main is green.
  release:
    name: Release
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Local ref: this job only runs on push to main, so it is the same file as
    # @main — but GitHub validates `with:` against the referenced workflow at
    # parse time on every event, and a remote @main ref rejects any input this
    # branch adds to release.yml before it is merged.
    uses: ./.github/workflows/release.yml
    # A called workflow can never get more than its caller grants: spelled out
    # so release still works if the repo's default token turns read-only.
    # (contents: write also covers the tag-workflows job's alias push.)
    permissions:
      contents: write        # release-please pushes the release branch and tags
      issues: write          # release-please labels the release PR (issues API)
      pull-requests: write   # open/update the release PR
    with:
      notify-reviewers: KevinDeBenedetti
      # Move only v0.<minor>: breaking changes ship as minor bumps before 1.0,
      # so this repo's callers must never be carried across one by an alias.
      pre-major-alias: minor
