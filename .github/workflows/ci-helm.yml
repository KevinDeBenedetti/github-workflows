name: CI — Helm

on:
  workflow_call:
    inputs:
      # ── Helm lint ──────────────────────────────────────────────────────────
      run-lint:
        description: Run `helm lint` on all charts
        type: boolean
        required: false
        default: true
      chart-paths:
        description: Space-separated paths to chart directories (supports globs, e.g. 'charts/*')
        type: string
        required: false
        default: 'charts/*'
      helm-version:
        description: Helm version to install (e.g. v3.17.0)
        type: string
        required: false
        default: v3.17.0
      lint-strict:
        description: Fail on lint warnings as well as errors (passes --strict to helm lint)
        type: boolean
        required: false
        default: false
      # ── Helm template dry-run ─────────────────────────────────────────────
      run-template:
        description: Run `helm template` dry-run on all charts to catch render errors
        type: boolean
        required: false
        default: false
      template-values:
        description: Path to a values file to use during helm template (optional)
        type: string
        required: false
        default: ''
      template-exclude-paths:
        description: >
          Space-separated chart paths to skip during the template dry-run only
          (lint still covers them). Intended for umbrella charts whose
          dependencies are pulled from a registry: rendering those validates the
          published artifacts rather than the source tree, which couples this
          workflow to registry state and can deadlock releases.
        type: string
        required: false
        default: ''

  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  workflow_dispatch:
    inputs:
      run-lint:
        description: Run `helm lint` on all charts
        type: boolean
        default: true
      chart-paths:
        description: Space-separated paths to chart directories (supports globs, e.g. 'charts/*')
        type: string
        default: 'charts/*'
      helm-version:
        description: Helm version to install (e.g. v3.17.0)
        type: string
        default: v3.17.0
      lint-strict:
        description: Fail on lint warnings as well as errors (passes --strict to helm lint)
        type: boolean
        default: false
      run-template:
        description: Run `helm template` dry-run on all charts to catch render errors
        type: boolean
        default: false
      template-values:
        description: Path to a values file to use during helm template (optional)
        type: string
        default: ''
      template-exclude-paths:
        description: Space-separated chart paths to skip during the template dry-run only
        type: string
        default: ''

concurrency:
  group: ci-helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Helm lint ─────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm lint
    if: inputs.run-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ inputs.helm-version }}

      - name: Lint charts
        # See the template step below on why inputs are passed via env.
        env:
          CHART_PATHS: ${{ inputs.chart-paths }}
          LINT_STRICT: ${{ inputs.lint-strict }}
        run: |
          STRICT_FLAG=""
          if [[ "$LINT_STRICT" == "true" ]]; then
            STRICT_FLAG="--strict"
          fi
          found=0
          for chart in $CHART_PATHS; do
            if [[ -f "$chart/Chart.yaml" ]]; then
              found=1
              echo "::group::Linting $chart"
              helm lint "$chart" $STRICT_FLAG
              echo "::endgroup::"
            fi
          done
          if [[ "$found" -eq 0 ]]; then
            echo "⚠️  No charts found matching: $CHART_PATHS"
            exit 1
          fi

  # ── Helm template dry-run ────────────────────────────────────────────────
  helm-template:
    name: Helm template dry-run
    if: inputs.run-template
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ inputs.helm-version }}

      - name: Template charts
        # Inputs go through env rather than being interpolated into the script:
        # `${{ }}` inside `run:` splices caller-controlled text straight into
        # bash. Same pattern as release.yml / cd-docs.yml.
        env:
          CHART_PATHS: ${{ inputs.chart-paths }}
          TEMPLATE_VALUES: ${{ inputs.template-values }}
          EXCLUDE_PATHS: ${{ inputs.template-exclude-paths }}
        run: |
          VALUES_ARGS=()
          if [[ -n "$TEMPLATE_VALUES" ]]; then
            VALUES_ARGS=(-f "$TEMPLATE_VALUES")
          fi
          # Padded with a space on each side so the membership test matches whole
          # paths only: "charts/foo" must not match an excluded "charts/foobar".
          EXCLUDES=" $EXCLUDE_PATHS "
          # Counted separately, on purpose: an exclusion must never stand in for a
          # chart that actually rendered, otherwise excluding a path (or naming a
          # path that does not exist) silently satisfies the guard below and the
          # job reports success having validated nothing.
          rendered=0
          excluded=0
          for chart in $CHART_PATHS; do
            chart="${chart%/}"
            if [[ "$EXCLUDES" == *" $chart "* ]]; then
              echo "⏭️  $chart skipped (template-exclude-paths)"
              excluded=$((excluded + 1))
              continue
            fi
            if [[ -f "$chart/Chart.yaml" ]]; then
              rendered=$((rendered + 1))
              echo "::group::Templating $chart"
              # A resolution failure does not fail the step (a chart may depend on a
              # momentarily unreachable repo), but it has to stay visible: otherwise
              # `helm template` fails further down on a "missing in charts/ directory"
              # whose real cause has been swallowed.
              helm dependency update "$chart" || echo "  ⚠️  helm dependency update failed for $chart — rendering may fail on missing dependencies"
              # Always an explicit name, never --generate-name: the two are mutually
              # exclusive and helm rejects the command ("cannot set --generate-name and
              # also specify a name"), which used to fail this job on the first chart.
              helm template "dry-run" "$chart" "${VALUES_ARGS[@]}" > /dev/null
              echo "  ✅ $chart renders cleanly"
              echo "::endgroup::"
            fi
          done
          if [[ "$rendered" -eq 0 ]]; then
            if [[ "$excluded" -gt 0 ]]; then
              echo "⚠️  Every chart matching '$CHART_PATHS' was excluded — nothing was validated"
            else
              echo "⚠️  No charts found matching: $CHART_PATHS"
            fi
            exit 1
          fi
          echo "✅ $rendered chart(s) rendered, $excluded excluded"
