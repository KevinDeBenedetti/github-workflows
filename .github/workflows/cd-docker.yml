name: Deploy — Docker

# The image build of this repository's callers: Docker Buildx drives BuildKit
# on the runner's Docker daemon, from a checkout of the triggering commit, and
# pushes to GHCR with provenance and an SBOM.
#
#   - `platforms` picks what is built. Anything other than the runner's own
#     architecture runs under QEMU: for one platform, name it and pick a runner
#     of that architecture.
#   - `runner` takes any Linux VM runner with Docker, GitHub's or Ubicloud's.
#   - The layer cache is the GitHub Actions cache by default, or with
#     `registry-cache` a `<image>-cache:buildcache` image in GHCR, which
#     outlives the Actions cache's eviction and is shared by every runner.
#   - `run-image-scan` scans the image for known vulnerabilities before the
#     push, and fails the job on a finding at `image-scan-fail-on` or above.
#   - `deployment: false` leaves out the production/preview environment and
#     its deployment record.
#
# Tags and OCI labels come from actions/image-tags.

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name (e.g. my-api). Defaults to repo name.
        type: string
        required: false
        default: ''
      context:
        description: Docker build context (e.g. apps/api)
        type: string
        required: false
        default: '.'
      dockerfile:
        description: Dockerfile path relative to context
        type: string
        required: false
        default: Dockerfile
      platforms:
        description: Target platforms (comma-separated)
        type: string
        required: false
        default: linux/amd64,linux/arm64
      push:
        description: Push image to registry
        type: boolean
        required: false
        default: true
      target:
        description: Build target stage (e.g. dev, prod)
        type: string
        required: false
        default: ''
      tag-latest:
        description: Also tag as :latest
        type: boolean
        required: false
        default: false
      version:
        description: Explicit version tag to apply (e.g. v1.2.3 from a release job output), plus its X.Y alias for a final release (v1.2.3 → 1.2)
        type: string
        required: false
        default: ''
      build-args:
        description: >
          List of Docker build-args (one per line, KEY=VALUE). Never secrets:
          build-args end up in the image history and in the provenance
          attestation — use the BUILD_SECRETS secret instead.
        type: string
        required: false
        default: ''
      provenance:
        description: >
          SLSA provenance attached to the image by BuildKit (e.g. 'mode=max',
          'mode=min', 'false'). mode=max records the build-args.
        type: string
        required: false
        default: mode=max
      sbom:
        description: Attach an SBOM attestation to the image
        type: boolean
        required: false
        default: true
      attest:
        description: >
          Sign a GitHub artifact attestation for the pushed image (verifiable
          with `gh attestation verify oci://<image> --owner <owner>`). Only
          when push is true.
        type: boolean
        required: false
        default: true
      run-image-scan:
        description: >
          Scan the image for known vulnerabilities (Trivy) before it is pushed: the
          image is first built for the runner's platform and loaded, then
          scanned; a finding at image-scan-fail-on or above fails the job.
        type: boolean
        required: false
        default: false
      image-scan-fail-on:
        description: 'Lowest severity that fails the image scan: low | medium | high | critical'
        type: string
        required: false
        default: critical
      registry-cache:
        description: >
          Keep the layer cache in GHCR (<image>-cache:buildcache, mode=max)
          instead of the GitHub Actions cache. The job then logs in to GHCR
          even when push is false.
        type: boolean
        required: false
        default: false
      deployment:
        description: >
          Run the build in the production (main) or preview environment, which
          records a deployment. false runs it in no environment.
        type: boolean
        required: false
        default: true
      runner:
        description: Runner labels as JSON — a Linux VM runner with a Docker daemon, GitHub's (e.g. '"ubuntu-26.04"') or Ubicloud's (e.g. '"ubicloud-standard-2"')
        type: string
        required: false
        default: '"ubuntu-26.04"'
      timeout-minutes:
        description: >
          Minutes before the build job is cancelled (GitHub's default is 360):
          a build stuck on a network pull or an emulated step is cut off
          instead of burning runner time.
        type: number
        required: false
        default: 60
    secrets:
      BUILD_SECRETS:
        description: >
          BuildKit secrets, one `id=value` per line, read in the Dockerfile with
          `RUN --mount=type=secret,id=<id>`. Never stored in a layer or in the
          provenance, unlike build-args.
        required: false
    outputs:
      image:
        description: Image tag(s) applied to the build (newline-separated, from docker/metadata-action)
        value: ${{ jobs.docker.outputs.image }}
      image-name:
        description: Image name without a tag (ghcr.io/<owner>/<name>)
        value: ${{ jobs.docker.outputs.image-name }}
      digest:
        description: Image digest
        value: ${{ jobs.docker.outputs.digest }}

env:
  REGISTRY: ghcr.io

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: deploy-docker-${{ github.ref }}-${{ inputs.context }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  docker:
    name: Docker build & push (${{ inputs.context }})
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.push && inputs.deployment && (github.ref == 'refs/heads/main' && 'production' || 'preview') || '' }}
    permissions:
      contents: read
      packages: write     # push the image, and the layer cache with registry-cache, to GHCR
      deployments: write  # deployment record of the production/preview environment

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      image-name: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image name, tags, cache reference and OCI labels (actions/image-tags);
      # metadata-action only turns the tags into the image's full names.
      - name: Image tags
        id: image
        uses: $/.github/actions/image-tags
        with:
          image-name: ${{ inputs.image-name }}
          version: ${{ inputs.version }}
          tag-latest: ${{ inputs.tag-latest }}
          registry: ${{ env.REGISTRY }}

      - name: Docker meta (names)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.image }}
          tags: ${{ steps.image.outputs.raw-tags }}

      # Only for a foreign architecture: an amd64-only build on the amd64
      # runner needs no emulator, and registering one costs a container pull.
      - name: Set up QEMU (multi-platform)
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Also without a push when the layer cache lives in GHCR.
      - name: Login to GHCR
        if: inputs.push || inputs.registry-cache
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The scan reads an image of the Docker daemon, which holds one platform:
      # the runner's own is built and loaded first. The build and push below
      # reuses its layers from the builder.
      - name: Build for the scan
        if: inputs.run-image-scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: linux/${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.image }}:scan
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          provenance: false
          sbom: false
          cache-from: ${{ inputs.registry-cache && format('type=registry,ref={0}', steps.image.outputs.cache) || format('type=gha,scope={0}-{1}', inputs.context, inputs.target) }}

      # Findings go to the job summary. No SARIF upload: a job that declared
      # security-events: write would force every caller to grant it.
      - name: Scan the image
        if: inputs.run-image-scan
        uses: $/.github/actions/image-scan
        with:
          image: ${{ steps.image.outputs.image }}:scan
          fail-on: ${{ inputs.image-scan-fail-on }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          # Explicit rather than BuildKit's visibility-based default (private
          # repositories would otherwise only get mode=min, inline-only).
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}
          # GitHub Actions cache: the scope includes the target, so two
          # stages of one context do not overwrite each other's cache.
          # Registry cache: one reference per image; a failed export does not
          # fail the build.
          cache-from: ${{ inputs.registry-cache && format('type=registry,ref={0}', steps.image.outputs.cache) || format('type=gha,scope={0}-{1}', inputs.context, inputs.target) }}
          cache-to: ${{ inputs.registry-cache && format('type=registry,ref={0},mode=max,ignore-error=true', steps.image.outputs.cache) || format('type=gha,scope={0}-{1},mode=max', inputs.context, inputs.target) }}

      - name: Export digest summary
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          {
            echo "### 🐳 Docker Image"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Platform | \`${PLATFORMS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate job so the build (which runs the Dockerfile) never holds an OIDC
  # token: only this job can mint the Sigstore signing certificate.
  attest:
    name: Attest image provenance
    needs: docker
    if: inputs.push && inputs.attest
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 10
    permissions:
      id-token: write      # OIDC token for the Sigstore signing certificate
      attestations: write  # store the attestation on the repository
      packages: write      # push the attestation next to the image in GHCR

    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.docker.outputs.image-name }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          push-to-registry: true
