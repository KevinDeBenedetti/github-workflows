name: Deploy — Docker

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name (e.g. my-api). Defaults to repo name.
        type: string
        required: false
        default: ''
      context:
        description: Docker build context (e.g. apps/api)
        type: string
        required: false
        default: '.'
      dockerfile:
        description: Path to Dockerfile
        type: string
        required: false
        default: Dockerfile
      platforms:
        description: Target platforms (comma-separated)
        type: string
        required: false
        default: linux/amd64,linux/arm64
      push:
        description: Push image to registry
        type: boolean
        required: false
        default: true
      target:
        description: Build target stage (e.g. dev, prod)
        type: string
        required: false
        default: ''
      tag-latest:
        description: Also tag as :latest
        type: boolean
        required: false
        default: false
      version:
        description: Explicit version tag to apply (e.g. v1.2.3 from a release job output). When set, adds a type=raw tag with this value.
        type: string
        required: false
        default: ''
      build-args:
        description: List of Docker build-args (one per line, KEY=VALUE). Passed to docker/build-push-action build-args.
        type: string
        required: false
        default: ''
    outputs:
      image:
        description: Image tag(s) applied to the build (newline-separated, from docker/metadata-action)
        value: ${{ jobs.docker.outputs.image }}
      digest:
        description: Image digest
        value: ${{ jobs.docker.outputs.digest }}

env:
  REGISTRY: ghcr.io

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: deploy-docker-${{ github.ref }}-${{ inputs.context }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  docker:
    name: Docker build & push (${{ inputs.context }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.push && (github.ref == 'refs/heads/main' && 'production' || 'preview') || '' }}
    permissions:
      contents: read
      packages: write
      deployments: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        # Inputs go through env, never interpolated into the script body.
        # Lowercased here (OCI repositories must be) so the job summary and the
        # pushed image agree — metadata-action lowercases on its side anyway.
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          NAME="${IMAGE_NAME:-$REPO_NAME}"
          FULL=$(printf '%s/%s/%s' "$REGISTRY" "$OWNER" "$NAME" | tr '[:upper:]' '[:lower:]')
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.full }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            ${{ inputs.version != '' && format('type=raw,value={0}', inputs.version) || '' }}
            ${{ inputs.tag-latest && 'type=raw,value=latest,enable={{is_default_branch}}' || '' }}

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          # Scope includes the target: two stages of one context must not
          # overwrite each other's cache.
          cache-from: type=gha,scope=${{ inputs.context }}-${{ inputs.target }}
          cache-to: type=gha,scope=${{ inputs.context }}-${{ inputs.target }},mode=max

      - name: Export digest summary
        env:
          IMAGE: ${{ steps.image.outputs.full }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          {
            echo "### 🐳 Docker Image"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Platform | \`${PLATFORMS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
