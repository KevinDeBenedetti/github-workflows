name: CI — Python

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        required: false
        default: '3.12'
      working-directory:
        description: Path to the app (e.g. apps/api)
        type: string
        required: false
        default: '.'
      run-lint:
        description: Run ruff linter
        type: boolean
        required: false
        default: true
      run-format:
        description: Check formatting with ruff format
        type: boolean
        required: false
        default: true
      run-typecheck:
        description: Run ty type checker
        type: boolean
        required: false
        default: false
      run-test:
        description: Run pytest
        type: boolean
        required: false
        default: true
      run-coverage:
        description: Enable test coverage report (pytest-cov)
        type: boolean
        required: false
        default: false
      coverage-fail-under:
        description: Minimum coverage percentage to pass
        type: number
        required: false
        default: 80
      test-command:
        description: Custom pytest command (ignored when run-coverage is true)
        type: string
        required: false
        default: 'uv run pytest --tb=short -q'
      runner:
        description: Runner labels as JSON — GitHub's (e.g. '"ubuntu-26.04"') or Ubicloud's (e.g. '"ubicloud-standard-2"')
        type: string
        required: false
        default: '"ubuntu-26.04"'
      timeout-minutes:
        description: >
          Minutes before the job is cancelled (GitHub's default is 360): a hung
          install or test run is cut off instead of burning runner time.
        type: number
        required: false
        default: 30

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

concurrency:
  group: ci-python-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ inputs.working-directory }})
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: $/.github/actions/setup-python
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Lint (ruff check)
        if: inputs.run-lint
        run: uv run ruff check --output-format github .

      - name: Format (ruff format --check)
        if: inputs.run-format
        run: uv run ruff format --check .

      - name: Type check (ty)
        if: inputs.run-typecheck
        run: uv run ty check --output-format github --quiet

      # test-command is a shell command by design: it is run with `bash -c`
      # from env rather than spliced into the script, so the step source never
      # contains caller text (no ${{ }} expansion inside run:).
      - name: Test (pytest)
        if: inputs.run-test && !inputs.run-coverage
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        # -eo pipefail: keeps the step's fail-fast semantics for multi-line commands.
        run: bash -eo pipefail -c "$TEST_COMMAND"

      - name: Test with coverage (pytest-cov)
        if: inputs.run-test && inputs.run-coverage
        env:
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
        run: >
          uv run pytest
          --tb=short -q
          --cov
          --cov-report=term-missing
          --cov-fail-under="$COVERAGE_FAIL_UNDER"
