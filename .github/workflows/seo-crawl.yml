name: SEO — Crawl

# SEO crawl of a live site, two checks in one job:
#   1. Broken links and redirects, with linkinator (recursive crawl of the site).
#   2. On-page tags per page: missing/duplicate <title> and meta description,
#      missing or multiple <h1>, missing canonical (small built-in crawler).
#
# Broken links fail the job (GitHub's failure email is the alert). A link that
# times out or answers a 5xx or a 429 is retried first (`retries`), so a host
# that is briefly down or throttling the runner does not fail the run. Tag
# issues are warnings in the step summary unless `fail-on-tag-issues` is true.
# The reports go to an artifact kept `artifact-retention-days` (7 by default;
# `upload-artifact: false` uploads none) and, with `report-s3-bucket`, to
# S3-compatible storage.
# Complements perf-unlighthouse.yml, which scores pages but does not detect
# broken links or duplicate tags.
#
# No browser: the job runs on the runner itself, with Node from setup-node
# (no root), jq and the shell's tools. Crawl from outside the site's own
# network so the result matches what search engines see.

on:
  workflow_call:
    inputs:
      site:
        description: Site to crawl (e.g. https://example.com)
        type: string
        required: true
      max-pages:
        description: Maximum number of pages the tag crawler visits
        type: number
        required: false
        default: 500
      check-external:
        description: Also check links pointing to other domains (slower, noisier)
        type: boolean
        required: false
        default: true
      skip:
        description: Comma-separated regexes of URLs linkinator must skip
        type: string
        required: false
        default: ""
      redirects:
        description: "How linkinator treats redirects: allow | warn | error"
        type: string
        required: false
        default: warn
      retries:
        description: Retries for a link that times out, fails to connect or answers a 5xx or a 429 (0 disables)
        type: number
        required: false
        default: 3
      fail-on-tag-issues:
        description: Fail the job on missing/duplicate tags (default is warning only)
        type: boolean
        required: false
        default: false
      linkinator-version:
        description: linkinator version
        type: string
        required: false
        # renovate: datasource=npm depName=linkinator
        default: 8.1.0
      artifact-retention-days:
        description: Days the uploaded artifacts are kept, 1 to 90 (the repository's artifact retention setting caps it)
        type: number
        required: false
        default: 7
      upload-artifact:
        description: Upload the reports as an artifact. false uploads nothing to GitHub, for a check that only gates on broken links
        type: boolean
        required: false
        default: true
      report-s3-endpoint:
        description: https:// URL of an S3-compatible API for a copy of the reports (e.g. https://s3.eu-central-003.backblazeb2.com)
        type: string
        required: false
        default: ""
      report-s3-bucket:
        description: Bucket of the S3 copy of the reports (private, with a lifecycle rule). Empty, no copy
        type: string
        required: false
        default: ""
      report-s3-prefix:
        description: Key prefix of the S3 copy, before <owner>/<repo>/
        type: string
        required: false
        default: ""
      runner:
        description: Runner labels as JSON — use '"ubuntu-26.04"'. Not on the site's own network
        type: string
        required: false
        default: '"ubuntu-26.04"'
    secrets:
      report-s3-access-key-id:
        description: Access key ID of the S3 copy (a Backblaze B2 application key ID), required with report-s3-bucket
        required: false
      report-s3-secret-access-key:
        description: Secret access key of the S3 copy (the B2 application key), required with report-s3-bucket
        required: false
  # NOTE: inputs are duplicated between workflow_call and workflow_dispatch.
  # Keep them in sync manually — GitHub does not support shared input definitions.
  workflow_dispatch:
    inputs:
      site:
        description: Site to crawl (e.g. https://example.com)
        type: string
        required: true
      max-pages:
        description: Maximum number of pages the tag crawler visits
        type: number
        default: 500
      check-external:
        description: Also check links pointing to other domains (slower, noisier)
        type: boolean
        default: true
      skip:
        description: Comma-separated regexes of URLs linkinator must skip
        type: string
        default: ""
      redirects:
        description: "How linkinator treats redirects: allow | warn | error"
        type: string
        default: warn
      retries:
        description: Retries for a link that times out, fails to connect or answers a 5xx or a 429 (0 disables)
        type: number
        default: 3
      fail-on-tag-issues:
        description: Fail the job on missing/duplicate tags (default is warning only)
        type: boolean
        default: false
      linkinator-version:
        description: linkinator version
        type: string
        # renovate: datasource=npm depName=linkinator
        default: 8.1.0
      artifact-retention-days:
        description: Days the uploaded artifacts are kept, 1 to 90 (the repository's artifact retention setting caps it)
        type: number
        default: 7
      upload-artifact:
        description: Upload the reports as an artifact. false uploads nothing to GitHub, for a check that only gates on broken links
        type: boolean
        default: true
      report-s3-endpoint:
        description: https:// URL of an S3-compatible API for a copy of the reports (e.g. https://s3.eu-central-003.backblazeb2.com)
        type: string
        default: ""
      report-s3-bucket:
        description: Bucket of the S3 copy of the reports (private, with a lifecycle rule). Empty, no copy
        type: string
        default: ""
      report-s3-prefix:
        description: Key prefix of the S3 copy, before <owner>/<repo>/
        type: string
        default: ""
      runner:
        description: Runner labels as JSON — use '"ubuntu-26.04"'. Not on the site's own network
        type: string
        required: false
        default: '"ubuntu-26.04"'

# Deny-all default: each job grants only the permissions it needs.
permissions: {}

# A scheduled crawl must not be cancelled by the next trigger.
concurrency:
  group: seo-crawl-${{ github.workflow }}-${{ github.ref }}-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  crawl:
    name: SEO crawl
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check report inputs
        uses: $/.github/actions/check-report-inputs
        with:
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
          upload-artifact: ${{ inputs.upload-artifact }}
          s3-endpoint: ${{ inputs.report-s3-endpoint }}
          s3-bucket: ${{ inputs.report-s3-bucket }}
          s3-prefix: ${{ inputs.report-s3-prefix }}
          s3-access-key-id: ${{ secrets.report-s3-access-key-id }}
          s3-secret-access-key: ${{ secrets.report-s3-secret-access-key }}

      - name: Validate inputs
        id: validate
        env:
          SITE: ${{ inputs.site }}
          REDIRECTS: ${{ inputs.redirects }}
          RETRIES: ${{ inputs.retries }}
        run: |
          set -euo pipefail
          [[ "$SITE" =~ ^https?:// ]] || { echo "::error::site must start with http:// or https:// (got '${SITE}')"; exit 1; }
          case "$REDIRECTS" in
            allow|warn|error) ;;
            *) echo "::error::redirects must be allow, warn or error (got '${REDIRECTS}')"; exit 1 ;;
          esac
          [[ "$RETRIES" =~ ^[0-9]+$ ]] || { echo "::error::retries must be a whole number, 0 or more (got '${RETRIES}')"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Exit code is captured by the final gate so the tag check and the
      # reports still run when links are broken.
      # linkinator has no request timeout and no retry by default, so one host
      # down for a few seconds failed the weekly run. Each request now times out
      # after 30 s, and --retry-errors retries a timeout, a failed connection, a
      # 5xx or a 429 with backoff (2 s, 4 s, 8 s… plus up to 3 s of jitter).
      # --retry is left out: it waits out any retry-after a host sends, however
      # long, which the job timeout would cut short.
      - name: Check links and redirects
        id: links
        continue-on-error: true
        env:
          SITE: ${{ inputs.site }}
          CHECK_EXTERNAL: ${{ inputs.check-external }}
          SKIP: ${{ inputs.skip }}
          REDIRECTS: ${{ inputs.redirects }}
          RETRIES: ${{ inputs.retries }}
          VERSION: ${{ inputs.linkinator-version }}
        run: |
          set -euo pipefail
          mkdir -p seo-result
          args=("$SITE" --recurse --redirects "$REDIRECTS" --format json --timeout 30000)
          if (( RETRIES > 0 )); then
            args+=(--retry-errors --retry-errors-count "$RETRIES")
          fi
          if [[ "$CHECK_EXTERNAL" != "true" ]]; then
            origin="$(printf '%s' "$SITE" | sed -E 's#^(https?://[^/]+).*#\1#')"
            escaped="$(printf '%s' "$origin" | sed -e 's/[][\.*^$+?(){}|/]/\\&/g')"
            args+=(--skip "^(?!${escaped})")
          fi
          IFS=',' read -ra patterns <<< "$SKIP"
          for p in "${patterns[@]}"; do
            [[ -n "$p" ]] && args+=(--skip "$p")
          done
          npm exec --yes --package="linkinator@${VERSION}" -- linkinator "${args[@]}" > seo-result/links.json

      - name: Check page tags
        id: tags
        continue-on-error: true
        env:
          SITE: ${{ inputs.site }}
          MAX_PAGES: ${{ inputs.max-pages }}
          FAIL_ON_ISSUES: ${{ inputs.fail-on-tag-issues }}
        run: |
          set -euo pipefail
          mkdir -p seo-result
          node --input-type=module - <<'NODE'
          import { writeFileSync } from "node:fs";

          const site = new URL(process.env.SITE);
          const max = Number(process.env.MAX_PAGES);
          const failOnIssues = process.env.FAIL_ON_ISSUES === "true";
          const norm = (u) => { u.hash = ""; return u.href; };
          const decode = (s) => s.replace(/\s+/g, " ").trim();

          const queue = [norm(new URL(site.href))];
          const seen = new Set(queue);
          // Seed with the sitemap when there is one.
          try {
            const r = await fetch(new URL("/sitemap.xml", site), { signal: AbortSignal.timeout(15000) });
            if (r.ok) {
              for (const m of (await r.text()).matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/g)) {
                try {
                  const u = new URL(m[1]);
                  if (u.origin === site.origin && !seen.has(norm(u))) { seen.add(norm(u)); queue.push(norm(u)); }
                } catch {}
              }
            }
          } catch {}

          const pages = [];
          const attr = (tag, name) => tag.match(new RegExp(`\\b${name}\\s*=\\s*("([^"]*)"|'([^']*)')`, "i"))?.slice(2).find((v) => v !== undefined);

          async function visit(url) {
            let res;
            try {
              res = await fetch(url, { signal: AbortSignal.timeout(15000), headers: { "user-agent": "seo-crawl/1.0" } });
            } catch { return; }
            if (!(res.headers.get("content-type") ?? "").includes("text/html")) return;
            const html = await res.text();
            const page = { url, status: res.status, issues: [] };

            page.title = decode(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] ?? "");
            const metas = [...html.matchAll(/<meta\b[^>]*>/gi)].map((m) => m[0]);
            const desc = metas.find((t) => attr(t, "name")?.toLowerCase() === "description");
            page.description = decode(attr(desc ?? "", "content") ?? "");
            const robots = metas.find((t) => attr(t, "name")?.toLowerCase() === "robots");
            page.noindex = /noindex/i.test(attr(robots ?? "", "content") ?? "");
            page.h1 = [...html.matchAll(/<h1\b[^>]*>/gi)].length;
            page.canonical = [...html.matchAll(/<link\b[^>]*>/gi)]
              .map((m) => m[0]).find((t) => attr(t, "rel")?.toLowerCase() === "canonical");

            if (!page.title) page.issues.push("missing title");
            if (!page.description) page.issues.push("missing meta description");
            if (page.h1 === 0) page.issues.push("missing h1");
            if (page.h1 > 1) page.issues.push(`${page.h1} h1`);
            if (!page.canonical) page.issues.push("missing canonical");
            pages.push(page);

            for (const m of html.matchAll(/<a\b[^>]*>/gi)) {
              const href = attr(m[0], "href");
              if (!href || /^(mailto:|tel:|javascript:)/i.test(href)) continue;
              try {
                const u = new URL(href, res.url);
                if (u.origin !== site.origin) continue;
                const n = norm(u);
                if (!seen.has(n) && seen.size < max) { seen.add(n); queue.push(n); }
              } catch {}
            }
          }

          // A worker that finds the queue empty waits while a page is still being
          // fetched (it may queue more) and stops only once none is. Stopping at
          // the first empty queue left one worker crawling a site with no
          // sitemap: its queue starts with the home page alone.
          let inFlight = 0;
          const workers = Array.from({ length: 5 }, async () => {
            while (pages.length < max) {
              const next = queue.shift();
              if (!next) {
                if (inFlight === 0) return;
                await new Promise((r) => setTimeout(r, 50));
                continue;
              }
              inFlight++;
              // A body cut off mid-read skips the page, as a failed fetch does.
              try { await visit(next); } catch {} finally { inFlight--; }
            }
          });
          await Promise.all(workers);

          // Duplicates (indexable pages only).
          const indexable = pages.filter((p) => !p.noindex && p.status < 400);
          for (const field of ["title", "description"]) {
            const groups = new Map();
            for (const p of indexable) if (p[field]) groups.set(p[field], [...(groups.get(p[field]) ?? []), p]);
            for (const group of groups.values())
              if (group.length > 1) for (const p of group) p.issues.push(`duplicate ${field === "title" ? "title" : "meta description"} (${group.length} pages)`);
          }

          const flagged = pages.filter((p) => p.issues.length);
          writeFileSync("seo-result/tags.json", JSON.stringify(pages, null, 2));

          const lines = [`### SEO tags — ${pages.length} pages crawled, ${flagged.length} with issues`, ""];
          if (flagged.length) {
            lines.push("| Page | Issues |", "|---|---|");
            for (const p of flagged) lines.push(`| ${p.url} | ${p.issues.join(", ")} |`);
          } else lines.push("_No issues._");
          writeFileSync("seo-result/tags-summary.md", lines.join("\n") + "\n");

          if (flagged.length) console.log(`::warning::${flagged.length} page(s) with tag issues`);
          if (failOnIssues && flagged.length) process.exit(1);
          NODE

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Links and redirects"
            echo
            if [[ -s seo-result/links.json ]] && jq -e . seo-result/links.json >/dev/null 2>&1; then
              jq -r '
                [.links[] | select(.state == "BROKEN")] as $b
                | "\(.links | length) links checked, \($b | length) broken.\n",
                  (if ($b | length) > 0 then
                    "| Status | URL | Found on |", "|---|---|---|",
                    ($b[] | "| \(.status // "n/a") | \(.url) | \(.parent // "") |")
                  else empty end)' seo-result/links.json
            else
              echo "_No linkinator report produced._"
            fi
            echo
            cat seo-result/tags-summary.md 2>/dev/null || echo "_No tag report produced._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ always() && inputs.upload-artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seo-crawl-result
          path: seo-result
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn

      # Requested by report-s3-bucket, so a failed copy fails the job.
      - name: Copy results to S3
        if: ${{ !cancelled() && inputs.report-s3-bucket != '' && steps.validate.outcome == 'success' }}
        uses: $/.github/actions/upload-report-s3
        with:
          path: seo-result
          name: seo-crawl-result
          workflow: seo-crawl
          endpoint: ${{ inputs.report-s3-endpoint }}
          bucket: ${{ inputs.report-s3-bucket }}
          prefix: ${{ inputs.report-s3-prefix }}
          access-key-id: ${{ secrets.report-s3-access-key-id }}
          secret-access-key: ${{ secrets.report-s3-secret-access-key }}

      # Fail only now, so both checks and both reports always run.
      - name: Fail on issues
        if: ${{ steps.links.outcome == 'failure' || steps.tags.outcome == 'failure' }}
        env:
          LINKS: ${{ steps.links.outcome }}
          TAGS: ${{ steps.tags.outcome }}
        run: |
          echo "::error::links check: ${LINKS}, tags check: ${TAGS} — see the step summary"
          exit 1
