# zizmor — GitHub Actions security linter (https://docs.zizmor.sh), run by the
# zizmor job of ci-cd.yml.
rules:
  unpinned-uses:
    config:
      policies:
        # Workflows reach this repo's own actions through `uses: $/…` (same
        # commit, no ref at all). This policy covers remote self-references
        # (the examples, copied into other repos, pin @vX.Y.Z — a SHA cannot be
        # known before the release commit exists). Release tags must be
        # protected by a tag ruleset (see SECURITY.md).
        "KevinDeBenedetti/github-workflows/*": ref-pin
        # Everything else: full commit SHA (Renovate keeps them current).
        "*": hash-pin
  concurrency-limits:
    ignore:
      # Deliberately ungrouped — see the top of security.yml.
      - security.yml
  self-repository:
    # `uses: $/...` is recent GitHub syntax, unknown to actionlint 1.7.11 (held
    # back, see .github/actions/actionlint): revisit once actionlint is bumped.
    disable: true
