name: Check report inputs
description: >
  Check the report settings shared by the perf and SEO workflows before any
  work starts: artifact-retention-days (a whole number from 1 to 90) and
  upload-artifact (true or false). Fails with an ::error:: that names the
  input. Needs bash only, inside a job container too.

inputs:
  artifact-retention-days:
    description: Days the artifact stays (1 to 90)
    required: true
  upload-artifact:
    description: Whether an artifact is uploaded (true or false)
    required: true

runs:
  using: composite
  steps:
    - name: Check report inputs
      shell: bash
      # Inputs go through env, never interpolated into the script body.
      env:
        ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
        UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
      run: bash "$GITHUB_ACTION_PATH/check-report-inputs.sh"
