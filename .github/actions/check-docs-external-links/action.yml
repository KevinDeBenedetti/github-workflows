name: Check docs external links
description: >
  Check the http(s) links of the docs Markdown files with lychee. By default
  only the files changed by the push or pull request are checked, so a page
  that rotted elsewhere in the docs never fails an unrelated change.

inputs:
  docs-directory:
    description: Path to the docs folder to check
    required: false
    default: docs
  changed-only:
    description: >
      Check only the Markdown files changed by the push or pull request
      ("false" checks every file of docs-directory)
    required: false
    default: 'true'
  github-token:
    description: >
      Token lychee uses for github.com links, which are rate-limited without
      one. Read access is enough.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Pinned in ../install-tool/tools.json and checked against its SHA-256
    # before it is installed.
    - name: Install lychee
      uses: $/.github/actions/install-tool
      with:
        tool: lychee

    # The changed files are compared with the change base, fetched when a
    # shallow checkout lacks it: comparing two trees needs no history between.
    - name: Find the change base
      id: base
      if: inputs.changed-only == 'true'
      uses: $/.github/actions/change-base
      with:
        fetch-base: 'true'

    - name: Check external links
      shell: bash
      # Inputs go through env, never interpolated into the script body.
      env:
        DOCS_DIR: ${{ inputs.docs-directory }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BASE: ${{ steps.base.outputs.base }}
      run: bash "$GITHUB_ACTION_PATH/check-docs-external-links.sh"
