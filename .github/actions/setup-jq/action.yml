name: Setup jq
description: >
  Install jq, pinned by version and SHA-256, into the runner's temp directory
  and put it on PATH, for a job container whose image has none (the
  sitespeed.io image). Downloads with curl or wget; needs no root.

runs:
  using: composite
  steps:
    - name: Install jq
      shell: bash
      run: | # zizmor: ignore[github-env] -- only appends a $RUNNER_TEMP tool dir to GITHUB_PATH
        # renovate: datasource=github-releases depName=jqlang/jq
        JQ_VERSION="1.8.2"
        # SHA-256 of the release binary per architecture, for the version above.
        # Refresh after a version bump: scripts/update-tool-checksums.py
        JQ_SHA256_amd64="b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f"
        JQ_SHA256_arm64="8b85c817833814ddca00a144c33705546355afccf0cf39b188f3cdb48b852309"
        case "$(uname -m)" in
          x86_64)        KEY=amd64 ;;
          aarch64|arm64) KEY=arm64 ;;
          *) echo "::error::unsupported arch: $(uname -m)"; exit 1 ;;
        esac
        INSTALL_DIR="$RUNNER_TEMP/jq"
        mkdir -p "$INSTALL_DIR"
        URL="https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-${KEY}"
        # curl where there is one, else wget: the sitespeed.io image ships no curl.
        if command -v curl > /dev/null 2>&1; then
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$INSTALL_DIR/jq" "$URL"
        elif command -v wget > /dev/null 2>&1; then
          wget -q --tries=5 --waitretry=5 -O "$INSTALL_DIR/jq" "$URL"
        else
          echo "::error::neither curl nor wget is there to download jq"; exit 1
        fi
        if [ "$KEY" = amd64 ]; then WANT="$JQ_SHA256_amd64"; else WANT="$JQ_SHA256_arm64"; fi
        echo "$WANT  $INSTALL_DIR/jq" | sha256sum --check --strict --quiet - \
          || { echo "::error::jq ${JQ_VERSION} ($(uname -m)) does not match its pinned SHA-256 — after a version bump, run scripts/update-tool-checksums.py"; exit 1; }
        chmod +x "$INSTALL_DIR/jq"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        "$INSTALL_DIR/jq" --version
