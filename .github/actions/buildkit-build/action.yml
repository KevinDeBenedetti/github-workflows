name: BuildKit build
description: >
  Build and push an image with rootless BuildKit from this repository's git
  context at the triggering commit, with build args, BuildKit secrets, OCI
  labels, provenance, SBOM and a registry layer cache. Runs inside the
  moby/buildkit rootless image (cd-buildkit.yml's buildkit job): POSIX sh,
  no checkout, no JavaScript. The rules are at the top of buildkit-build.sh.

inputs:
  names:
    description: image:tag list, comma-separated (image-tags `names`)
    required: true
  cache:
    description: Registry layer-cache reference (image-tags `cache`)
    required: true
  labels:
    description: OCI labels, one KEY=VALUE per line (image-tags `labels`)
    required: false
    default: ''
  build-args:
    description: Build args, one KEY=VALUE per line. Never secrets — use build-secrets
    required: false
    default: ''
  build-secrets:
    description: BuildKit secrets, one id=value per line, each mounted with `RUN --mount=type=secret,id=<id>`
    required: false
    default: ''
  target:
    description: Dockerfile stage; empty builds the last one
    required: false
    default: ''
  push:
    description: "'true' pushes the image"
    required: false
    default: 'true'
  provenance:
    description: SLSA provenance ('mode=max', 'mode=min' or 'false')
    required: false
    default: mode=max
  sbom:
    description: "'true' attaches an SBOM attestation"
    required: false
    default: 'true'
  context:
    description: Build context directory, relative to the repository root
    required: false
    default: '.'
  dockerfile:
    description: Dockerfile path, relative to the context
    required: false
    default: Dockerfile
  registry:
    description: Registry host the token logs in to
    required: false
    default: ghcr.io
  token:
    description: Token that fetches the git context (contents read) and pushes (packages write)
    required: false
    default: ${{ github.token }}

outputs:
  digest:
    description: Image digest (sha256:…), from the build metadata
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Build and push with BuildKit
      id: build
      shell: sh
      # Inputs go through env, never interpolated into the script body.
      env:
        NAMES: ${{ inputs.names }}
        CACHE: ${{ inputs.cache }}
        LABELS: ${{ inputs.labels }}
        BUILD_ARGS: ${{ inputs.build-args }}
        BUILD_SECRETS: ${{ inputs.build-secrets }}
        TARGET: ${{ inputs.target }}
        PUSH: ${{ inputs.push }}
        PROVENANCE: ${{ inputs.provenance }}
        SBOM: ${{ inputs.sbom }}
        CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        REGISTRY: ${{ inputs.registry }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        SERVER_URL: ${{ github.server_url }}
        GH_ACTOR: ${{ github.actor }}
        GH_TOKEN: ${{ inputs.token }}
      run: sh "$GITHUB_ACTION_PATH/buildkit-build.sh"
