name: Bats
description: Install Bats and run shell unit tests

inputs:
  tests-dir:
    description: Directory (or file) containing .bats test files
    required: false
    default: tests/
  recursive:
    description: Also run .bats files in sub-directories of tests-dir (bats -r)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Installed from the upstream repository into RUNNER_TEMP: no sudo and no
    # npm needed, so it also works on minimal self-hosted runner images.
    - name: Install Bats
      shell: bash
      run: |
        # renovate: datasource=github-tags depName=bats-core/bats-core
        BATS_VERSION="v1.11.0"
        git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$BATS_VERSION" \
          https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
        "$RUNNER_TEMP/bats-core/install.sh" "$RUNNER_TEMP/bats"
        echo "$RUNNER_TEMP/bats/bin" >> "$GITHUB_PATH"

    - name: Run Bats tests
      shell: bash
      env:
        TESTS_DIR: ${{ inputs.tests-dir }}
        RECURSIVE: ${{ inputs.recursive }}
      run: |
        ARGS=()
        if [ "$RECURSIVE" = "true" ]; then
          ARGS+=(--recursive)
        fi
        bats "${ARGS[@]}" "$TESTS_DIR"
