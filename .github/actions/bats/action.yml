name: Bats
description: Install Bats and run shell unit tests

inputs:
  tests-dir:
    description: Directory (or file) containing .bats test files
    required: false
    default: tests/
  recursive:
    description: >
      Also run .bats files in sub-directories of tests-dir (bats -r). Off by
      default: vendored helpers under tests/test_helper/ (bats-support,
      bats-assert) ship their own suites, which would run too.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Installed from the upstream repository into RUNNER_TEMP: no sudo and no
    # npm needed, so it also works on minimal self-hosted runner images.
    - name: Install Bats
      shell: bash
      run: | # zizmor: ignore[github-env] -- only appends a $RUNNER_TEMP tool dir to GITHUB_PATH
        # renovate: datasource=github-tags depName=bats-core/bats-core
        BATS_VERSION="v1.11.0"
        # Commit the tag points to — a tag can be moved, a commit cannot.
        # Refresh after a version bump: scripts/update-tool-checksums.py
        BATS_COMMIT="5da66876b8b619235aee1eb3e54954eaca88059b"
        git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$BATS_VERSION" \
          https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
        if [ "$(git -C "$RUNNER_TEMP/bats-core" rev-parse HEAD)" != "$BATS_COMMIT" ]; then
          echo "::error::bats-core ${BATS_VERSION} is not at the pinned commit ${BATS_COMMIT} — after a version bump, run scripts/update-tool-checksums.py"
          exit 1
        fi
        "$RUNNER_TEMP/bats-core/install.sh" "$RUNNER_TEMP/bats"
        echo "$RUNNER_TEMP/bats/bin" >> "$GITHUB_PATH"

    - name: Run Bats tests
      shell: bash
      env:
        TESTS_DIR: ${{ inputs.tests-dir }}
        RECURSIVE: ${{ inputs.recursive }}
      run: |
        ARGS=()
        if [ "$RECURSIVE" = "true" ]; then
          ARGS+=(--recursive)
        fi
        bats "${ARGS[@]}" "$TESTS_DIR"
