name: Upload report to S3
description: >
  Copy a report directory to S3-compatible storage (Backblaze B2, AWS S3,
  MinIO…) with rclone, under
  <prefix>/<owner>/<repo>/<workflow>/<run id>-<run attempt>/<name>/, and write
  that path to the job summary. rclone is pinned by version and SHA-256; the
  credentials reach it through its environment only, and a write-only key is
  enough. Runs on Debian or Ubuntu, inside a job container too, with bash,
  curl or wget, sha256sum and dpkg-deb.

inputs:
  path:
    description: Report directory to copy (a missing one is a warning, not an error)
    required: true
  name:
    description: Folder of the report under the run, such as its artifact name
    required: true
  workflow:
    description: Workflow segment of the object path (lowercase letters, digits and hyphens)
    required: true
  endpoint:
    description: https:// URL of the S3 API host, such as https://s3.eu-central-003.backblazeb2.com
    required: true
  bucket:
    description: Bucket
    required: true
  prefix:
    description: Key prefix before <owner>/<repo>
    required: false
    default: ''
  access-key-id:
    description: Access key ID (a Backblaze B2 application key ID)
    required: true
  secret-access-key:
    description: Secret access key (the B2 application key)
    required: true

outputs:
  path:
    description: s3:// path of the copy
    value: ${{ steps.upload.outputs.path }}

runs:
  using: composite
  steps:
    - name: Upload report to S3
      id: upload
      shell: bash
      # Inputs go through env, never interpolated into the script body.
      env:
        REPORT_DIR: ${{ inputs.path }}
        REPORT_NAME: ${{ inputs.name }}
        REPORT_WORKFLOW: ${{ inputs.workflow }}
        S3_ENDPOINT: ${{ inputs.endpoint }}
        S3_BUCKET: ${{ inputs.bucket }}
        S3_PREFIX: ${{ inputs.prefix }}
        S3_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        S3_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
      run: |
        # renovate: datasource=github-releases depName=rclone/rclone
        RCLONE_VERSION="1.75.2"
        # SHA-256 of the .deb release asset per architecture, for the version above.
        # Refresh after a version bump: scripts/update-tool-checksums.py
        RCLONE_SHA256_amd64="efbfe852181f7191eb3c9043ed1ab49c9b2d0ba045c61c926a5da111c939ec5c"
        RCLONE_SHA256_arm64="b8ba161d5c837206fad79ff1aabf0a81aa02a5fb164cdbc0ff5db4160aecd278"
        export RCLONE_VERSION RCLONE_SHA256_amd64 RCLONE_SHA256_arm64
        bash "$GITHUB_ACTION_PATH/upload-report-s3.sh"
