name: Setup Python
description: Install Python with uv and restore cache

inputs:
  python-version:
    description: Python version to use
    required: false
    default: '3.12'
  working-directory:
    description: Directory containing pyproject.toml
    required: false
    default: '.'
  install:
    description: Run uv sync after setup
    required: false
    default: 'true'

outputs:
  cache-hit:
    description: Whether the uv cache was hit
    value: ${{ steps.uv.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # setup-uv owns the uv cache end to end. It exports UV_CACHE_DIR, so a
    # separate actions/cache step on ~/.cache/uv (what this action used to do)
    # only ever matched on self-hosted runners: on github-hosted, uv writes to
    # $RUNNER_TEMP/setup-uv-cache instead and the manual cache archived an
    # untouched directory — which also made the cache-hit output above wrong.
    - name: Install uv
      id: uv
      # Pinned to an exact version on purpose: astral-sh stopped publishing
      # floating major/minor tags at v8, so `@v9` does not resolve and would
      # fail the step. Bumps here must name a full version or a SHA.
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: latest
        working-directory: ${{ inputs.working-directory }}
        # Explicitly true rather than the 'auto' default: 'auto' resolves to
        # RUNNER_ENVIRONMENT == 'github-hosted', so on a self-hosted runner
        # (reachable through the `runner` input of the calling workflows) it
        # would silently disable caching altogether.
        enable-cache: true
        # Keeps the python-version dimension the previous manual cache key had;
        # the default cache-dependency-glob already covers uv.lock/pyproject.toml.
        cache-suffix: py${{ inputs.python-version }}
        # v9 disabled cache pruning by default, which grows the GitHub Actions
        # cache (and its cost). Restored to the pre-v9 behaviour.
        prune-cache: true

    # Load-bearing: python-version is deliberately not passed to setup-uv above,
    # so uv resolves the interpreter from PATH — which this step provides.
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen
