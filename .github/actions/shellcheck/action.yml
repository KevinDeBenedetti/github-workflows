name: ShellCheck
description: Run ShellCheck on all shell scripts in the repository

inputs:
  severity:
    description: 'Minimum severity level: error | warning | info | style'
    required: false
    default: warning
  exclude-paths:
    description: Path glob passed to find -not -path to exclude from analysis
    required: false
    default: '*/test_helper/*'
  default-shell:
    description: >
      Dialect assumed for scripts with neither a shebang nor a
      `# shellcheck shell=` directive (e.g. sourced libraries). Scripts that
      declare their shell are checked as that shell.
    required: false
    default: bash

runs:
  using: composite
  steps:
    - name: Install ShellCheck
      shell: bash
      run: | # zizmor: ignore[github-env] -- only appends a $RUNNER_TEMP tool dir to GITHUB_PATH
        # renovate: datasource=github-releases depName=koalaman/shellcheck
        SHELLCHECK_VERSION="0.11.0"
        case "$(uname -m)" in
          x86_64)        ARCH=x86_64 ;;
          aarch64|arm64) ARCH=aarch64 ;;
          *) echo "::error::unsupported arch: $(uname -m)"; exit 1 ;;
        esac
        INSTALL_DIR="$RUNNER_TEMP/shellcheck"
        mkdir -p "$INSTALL_DIR"
        curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
          -o "$RUNNER_TEMP/shellcheck.tar.xz" \
          "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.${ARCH}.tar.xz"
        # Decompress with python3 (lzma) — the actions-runner image has no xz.
        python3 -c "import lzma, shutil, sys; shutil.copyfileobj(lzma.open(sys.argv[1]), open(sys.argv[2], 'wb'))" \
          "$RUNNER_TEMP/shellcheck.tar.xz" "$RUNNER_TEMP/shellcheck.tar"
        tar xf "$RUNNER_TEMP/shellcheck.tar" -C "$INSTALL_DIR" --strip-components=1 \
          "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Run ShellCheck
      shell: bash
      env:
        SEVERITY: ${{ inputs.severity }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        DEFAULT_SHELL: ${{ inputs.default-shell }}
      run: |
        # Scripts that declare their dialect (shebang or `shellcheck shell=`
        # directive) are checked as that dialect — forcing --shell=bash would
        # hide POSIX-sh portability issues in #!/bin/sh scripts. Only scripts
        # that declare nothing fall back to DEFAULT_SHELL (otherwise SC2148).
        # A shebang ShellCheck cannot parse (zsh, fish…) would fail with SC1071,
        # so those scripts also fall back to DEFAULT_SHELL, as before.
        shebang_dialect() {
          local line words i
          IFS= read -r line < "$1" || true
          [[ $line == '#!'* ]] || return 0
          read -ra words <<< "${line#\#!}"
          i=0
          # `#!/usr/bin/env [-S] [-opts] shell`: skip env and its options.
          if [[ ${words[0]##*/} == env ]]; then
            i=1
            while [[ ${words[i]:-} == -* ]]; do i=$((i + 1)); done
          fi
          echo "${words[i]##*/}"
        }

        DECLARED=()
        UNDECLARED=()
        while IFS= read -r -d '' f; do
          if grep -qE '^#[[:space:]]*shellcheck[[:space:]]+shell=' "$f"; then
            DECLARED+=("$f")
            continue
          fi
          case "$(shebang_dialect "$f")" in
            sh|bash|dash|ksh|busybox) DECLARED+=("$f") ;;
            *)                        UNDECLARED+=("$f") ;;
          esac
        done < <(find . \
          \( -path ./.git -o -path '*/node_modules' -o -path '*/.venv' \) -prune -o \
          -type f -name '*.sh' -not -path "$EXCLUDE_PATHS" -print0)

        status=0
        if [ "${#DECLARED[@]}" -gt 0 ]; then
          shellcheck --severity="$SEVERITY" --format=gcc "${DECLARED[@]}" || status=1
        fi
        if [ "${#UNDECLARED[@]}" -gt 0 ]; then
          shellcheck --severity="$SEVERITY" --shell="$DEFAULT_SHELL" --format=gcc "${UNDECLARED[@]}" || status=1
        fi
        echo "Checked $(( ${#DECLARED[@]} + ${#UNDECLARED[@]} )) script(s)."
        exit "$status"
