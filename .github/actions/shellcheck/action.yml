name: ShellCheck
description: Run ShellCheck on all shell scripts in the repository

inputs:
  severity:
    description: 'Minimum severity level: error | warning | info | style'
    required: false
    default: warning
  exclude-paths:
    description: Path glob passed to find -not -path to exclude from analysis
    required: false
    default: '*/test_helper/*'
  extra-paths:
    description: >
      Space-separated path globs (each passed to find -path, relative to the
      repository root) whose files are checked as well as the *.sh ones, for
      extensionless scripts such as `scripts/*/*`. A matched file is checked
      only when its shebang or a `# shellcheck shell=` directive declares a
      supported shell; the others are skipped with a notice.
    required: false
    default: ''
  default-shell:
    description: >
      Dialect assumed for scripts with neither a shebang nor a
      `# shellcheck shell=` directive (e.g. sourced libraries). Scripts that
      declare their shell are checked as that shell.
    required: false
    default: bash

runs:
  using: composite
  steps:
    # Pinned in ../install-tool/tools.json and checked against its SHA-256
    # before it is installed.
    - name: Install ShellCheck
      uses: $/.github/actions/install-tool
      with:
        tool: shellcheck

    - name: Run ShellCheck
      shell: bash
      # Inputs go through env, never interpolated into the script body.
      env:
        SEVERITY: ${{ inputs.severity }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        EXTRA_PATHS: ${{ inputs.extra-paths }}
        DEFAULT_SHELL: ${{ inputs.default-shell }}
      run: bash "$GITHUB_ACTION_PATH/shellcheck.sh"
