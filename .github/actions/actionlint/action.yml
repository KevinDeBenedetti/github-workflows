name: actionlint
description: Validate GitHub Actions workflow files with actionlint

inputs:
  paths:
    description: >
      Space-separated workflow files, directories and globs to validate; an
      entry that matches nothing fails
    required: false
    default: .github/workflows/
  flags:
    description: >
      Extra flags passed to actionlint, split like a shell command line
      (e.g. -ignore 'SC2086')
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Pinned in ../install-tool/tools.json and checked against its SHA-256
    # before it is installed.
    - name: Install actionlint
      uses: $/.github/actions/install-tool
      with:
        tool: actionlint

    - name: Run actionlint
      shell: bash
      # Inputs go through env, never interpolated into the script body.
      env:
        PATHS: ${{ inputs.paths }}
        FLAGS: ${{ inputs.flags }}
      run: bash "$GITHUB_ACTION_PATH/actionlint.sh"
