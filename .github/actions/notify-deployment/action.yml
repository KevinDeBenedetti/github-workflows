name: Notify Deployment
description: Write a detailed Markdown job summary after a Kubernetes deployment.

inputs:
  app-name:
    description: Application name (e.g. my-app-dev)
    required: true
  environment:
    description: Environment (e.g. development, production)
    required: false
    default: development
  status:
    description: Deployment status ("success" shows ✅, anything else ❌)
    required: false
    default: success
  version:
    description: Deployed image version
    required: true
  url:
    description: Application URL, with or without scheme (https:// is added when missing)
    required: false
    default: ''
  argocd-url:
    description: URL of the application in ArgoCD
    required: false
    default: ''
  infra-commit-url:
    description: Link to the infra commit that triggered the deployment (omitted when empty)
    required: false
    default: ''
  infra-link-label:
    description: Text of the infra link (e.g. "Infra PR" when infra-commit-url points to a pull request)
    required: false
    default: Infra commit

runs:
  using: composite
  steps:
    - name: Generate Job Summary
      shell: bash
      # Inputs go through env, never interpolated into the script body.
      env:
        APP_NAME: ${{ inputs.app-name }}
        ENVIRONMENT: ${{ inputs.environment }}
        STATUS: ${{ inputs.status }}
        VERSION: ${{ inputs.version }}
        APP_URL: ${{ inputs.url }}
        ARGOCD_URL: ${{ inputs.argocd-url }}
        INFRA_COMMIT_URL: ${{ inputs.infra-commit-url }}
        INFRA_LINK_LABEL: ${{ inputs.infra-link-label }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash "$GITHUB_ACTION_PATH/notify-deployment.sh"
