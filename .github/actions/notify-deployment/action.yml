name: Notify Deployment
description: Write a detailed Markdown job summary after a Kubernetes deployment.

inputs:
  app-name:
    description: Application name (e.g. portfolio-dev)
    required: true
  environment:
    description: Environment (e.g. development, production)
    required: false
    default: development
  status:
    description: Deployment status ("success" shows ✅, anything else ❌)
    required: false
    default: success
  version:
    description: Deployed image version
    required: true
  url:
    description: Application URL, with or without scheme (https:// is added when missing)
    required: false
    default: ''
  argocd-url:
    description: URL of the application in ArgoCD
    required: false
    default: ''
  infra-commit-url:
    description: Link to the infra commit that triggered the deployment (omitted when empty)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Generate Job Summary
      shell: bash
      # Inputs go through env, never interpolated into the script body.
      env:
        APP_NAME: ${{ inputs.app-name }}
        ENVIRONMENT: ${{ inputs.environment }}
        STATUS: ${{ inputs.status }}
        VERSION: ${{ inputs.version }}
        APP_URL: ${{ inputs.url }}
        ARGOCD_URL: ${{ inputs.argocd-url }}
        INFRA_COMMIT_URL: ${{ inputs.infra-commit-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        ICON="✅"
        if [ "$STATUS" != "success" ]; then
          ICON="❌"
        fi

        {
          echo "### ${ICON} Deployment ${APP_NAME}"
          echo ""
          echo "| Property | Value |"
          echo "| :--- | :--- |"
          echo "| **Status** | ${ICON} ${STATUS} |"
          echo "| **Environment** | \`${ENVIRONMENT}\` |"
          echo "| **Version** | \`${VERSION}\` |"

          if [ -n "$APP_URL" ]; then
            case "$APP_URL" in
              http://*|https://*) HREF="$APP_URL" ;;
              *)                  HREF="https://${APP_URL}" ;;
            esac
            echo "| **URL** | [${APP_URL}](${HREF}) |"
          fi

          echo ""
          echo "**Monitoring:**"

          if [ -n "$ARGOCD_URL" ]; then
            echo "- 🛰️ [View in ArgoCD](${ARGOCD_URL})"
          fi
          if [ -n "$INFRA_COMMIT_URL" ]; then
            echo "- 📝 [Infra commit](${INFRA_COMMIT_URL})"
          fi
          echo "- 📊 [Workflow run logs](${RUN_URL})"
        } >> "$GITHUB_STEP_SUMMARY"
