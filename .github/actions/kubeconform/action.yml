name: kubeconform
description: Validate Kubernetes manifests with kubeconform

inputs:
  paths:
    description: Directory containing Kubernetes manifests
    required: false
    default: kubernetes/
  exclude:
    description: >
      Regex pattern passed to -ignore-filename-pattern to exclude files
      (e.g. '.*-values\.yaml').
    required: false
    default: '.*-values\.yaml'
  include-crds-catalog:
    description: >
      Also validate CRDs against the Datree CRDs-catalog
      (adds cert-manager, Traefik, etc. schemas)
    required: false
    default: 'true'
  ignore-missing-schemas:
    description: >
      Skip validation for resources whose schema is not found (e.g. custom CRDs
      not present in the CRDs-catalog such as Tetragon TracingPolicy).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install kubeconform
      shell: bash
      run: |
        # renovate: datasource=github-releases depName=yannh/kubeconform
        KUBECONFORM_VERSION="0.7.0"
        case "$(uname -m)" in
          x86_64)        ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
          *) echo "::error::unsupported arch: $(uname -m)"; exit 1 ;;
        esac
        INSTALL_DIR="$RUNNER_TEMP/kubeconform"
        mkdir -p "$INSTALL_DIR"
        curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
          -o "$RUNNER_TEMP/kubeconform.tar.gz" \
          "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-${ARCH}.tar.gz"
        tar xz -C "$INSTALL_DIR" kubeconform < "$RUNNER_TEMP/kubeconform.tar.gz"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Validate Kubernetes manifests
      shell: bash
      # Inputs go through env, never interpolated into the script body.
      env:
        PATHS: ${{ inputs.paths }}
        EXCLUDE: ${{ inputs.exclude }}
        INCLUDE_CRDS_CATALOG: ${{ inputs.include-crds-catalog }}
        IGNORE_MISSING_SCHEMAS: ${{ inputs.ignore-missing-schemas }}
      run: |
        SCHEMA_ARGS=("-schema-location" "default")
        if [ "$INCLUDE_CRDS_CATALOG" = "true" ]; then
          SCHEMA_ARGS+=(
            "-schema-location"
            "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          )
        fi

        IGNORE_ARGS=()
        if [ -n "$EXCLUDE" ]; then
          IGNORE_ARGS+=("-ignore-filename-pattern" "$EXCLUDE")
        fi
        if [ "$IGNORE_MISSING_SCHEMAS" = "true" ]; then
          IGNORE_ARGS+=("-ignore-missing-schemas")
        fi

        kubeconform -strict -summary \
          "${SCHEMA_ARGS[@]}" \
          "${IGNORE_ARGS[@]}" \
          "$PATHS"
