name: Detect Changed Apps
description: >
  Detects which subdirectories under apps/ have changed since the change base
  (the pull request's base, the commit before the push, or a new branch's fork
  point with the default branch) and outputs a JSON matrix for downstream jobs.
  With no change base (a manual run), every app counts as changed.

inputs:
  apps-directory:
    description: Root directory containing app subdirectories
    required: false
    default: 'apps'
  base-ref:
    description: Commit, branch or tag to compare against instead of the change base
    required: false
    default: ''

outputs:
  changed-apps:
    description: JSON array of changed app names, e.g. ["api","web"]
    value: ${{ steps.detect.outputs.changed_apps }}
  has-changes:
    description: Whether any app changed ("true" / "false")
    value: ${{ steps.detect.outputs.has_changes }}
  # Per-app flags — useful for if: conditions without matrix. Composite
  # actions cannot declare outputs dynamically, so only these three names are
  # exposed; for any other app use `changed-apps` (e.g. contains(fromJson(...), 'name')).
  changed-api:
    description: Whether apps/api changed
    value: ${{ steps.detect.outputs.changed_api }}
  changed-web:
    description: Whether apps/web changed
    value: ${{ steps.detect.outputs.changed_web }}
  changed-client:
    description: Whether apps/client changed
    value: ${{ steps.detect.outputs.changed_client }}

runs:
  using: composite
  steps:
    # Comparing two trees needs no history between them: a change base missing
    # from a shallow checkout is fetched. base-ref fails the step when it
    # cannot be found.
    - name: Find the change base
      id: base
      uses: $/.github/actions/change-base
      with:
        base-ref: ${{ inputs.base-ref }}
        fetch-base: 'true'

    - name: Detect changed apps
      id: detect
      shell: bash
      # Inputs go through env, never interpolated into the script body.
      env:
        APPS_DIR: ${{ inputs.apps-directory }}
        BASE: ${{ steps.base.outputs.base }}
      run: bash "$GITHUB_ACTION_PATH/detect-changes.sh"
