name: Detect Changed Apps
description: >
  Detects which subdirectories under apps/ have changed
  and outputs a JSON matrix for downstream jobs.

inputs:
  apps-directory:
    description: Root directory containing app subdirectories
    required: false
    default: 'apps'
  base-ref:
    description: Base git ref to compare against
    required: false
    default: ''

outputs:
  changed-apps:
    description: JSON array of changed app names, e.g. ["api","web"]
    value: ${{ steps.detect.outputs.changed_apps }}
  has-changes:
    description: Whether any app changed ("true" / "false")
    value: ${{ steps.detect.outputs.has_changes }}
  # Per-app flags — useful for if: conditions without matrix. Composite
  # actions cannot declare outputs dynamically, so only these three names are
  # exposed; for any other app use `changed-apps` (e.g. contains(fromJson(...), 'name')).
  changed-api:
    description: Whether apps/api changed
    value: ${{ steps.detect.outputs.changed_api }}
  changed-web:
    description: Whether apps/web changed
    value: ${{ steps.detect.outputs.changed_web }}
  changed-client:
    description: Whether apps/client changed
    value: ${{ steps.detect.outputs.changed_client }}

runs:
  using: composite
  steps:
    - name: Detect changed apps
      id: detect
      shell: bash
      env:
        APPS_DIR: ${{ inputs.apps-directory }}
        BASE_REF: ${{ inputs.base-ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail

        # Resolve base commit: input > PR base > previous commit on push
        if [ -n "$BASE_REF" ]; then
          BASE_COMMIT="$BASE_REF"
        elif [ -n "$PR_BASE_SHA" ]; then
          BASE_COMMIT="$PR_BASE_SHA"
        else
          BASE_COMMIT="$BEFORE"
          # Fallback: compare with HEAD~1 if before is null/zeros
          if [ -z "$BASE_COMMIT" ] || [ "$BASE_COMMIT" = "0000000000000000000000000000000000000000" ]; then
            BASE_COMMIT="HEAD~1"
          fi
        fi

        echo "Comparing against: $BASE_COMMIT"

        # The base must be in the clone. With the default shallow checkout it
        # usually is not, and a failing `git diff` used to be read as "nothing
        # changed" — every downstream job was then skipped without a word.
        if ! git rev-parse --verify --quiet "${BASE_COMMIT}^{commit}" > /dev/null; then
          echo "::error::Base commit '$BASE_COMMIT' is not in the clone — check out with 'fetch-depth: 0' (actions/checkout) before this action."
          exit 1
        fi

        CHANGED_APPS="[]"
        HAS_CHANGES="false"

        if [ -d "$APPS_DIR" ]; then
          shopt -s nullglob
          for APP_PATH in "$APPS_DIR"/*/; do
            APP_NAME=$(basename "$APP_PATH")
            SAFE_NAME=$(printf '%s' "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '_')

            # Check if any file changed inside this app (a git failure aborts
            # the step through set -e instead of passing as "no change").
            DIFF=$(git diff --name-only "$BASE_COMMIT" HEAD -- "$APP_PATH")

            if [ -n "$DIFF" ]; then
              echo "✅ Changed: $APP_NAME"
              CHANGED_APPS=$(echo "$CHANGED_APPS" | jq -c --arg app "$APP_NAME" '. + [$app]')
              HAS_CHANGES="true"
              echo "changed_${SAFE_NAME}=true" >> "$GITHUB_OUTPUT"
            else
              echo "⏭️  Unchanged: $APP_NAME"
              echo "changed_${SAFE_NAME}=false" >> "$GITHUB_OUTPUT"
            fi
          done
        else
          echo "⚠️  Directory '$APPS_DIR' not found — no apps to build"
        fi

        echo "changed_apps=$CHANGED_APPS" >> "$GITHUB_OUTPUT"
        echo "has_changes=$HAS_CHANGES"    >> "$GITHUB_OUTPUT"
        echo ""
        echo "Summary → changed apps: $CHANGED_APPS"
