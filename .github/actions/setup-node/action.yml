name: Setup Node.js
description: >
  Install Node.js and the right package manager (pnpm, bun or npm),
  restoring the appropriate cache. Auto-detects from lockfile.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'
  working-directory:
    description: Directory to look for lockfile and run install
    required: false
    default: '.'
  package-manager:
    description: >
      Force a package manager: "pnpm" | "bun" | "npm" | "auto" (default).
      "auto" detects from the nearest lockfile (working directory first,
      then the repository root, for workspaces): bun.lockb / bun.lock → bun,
      package-lock.json → npm, otherwise → pnpm.
    required: false
    default: auto
  pnpm-version:
    description: >
      pnpm version to install. Leave empty (default) to use the
      `packageManager` field of package.json (working directory first, then
      the repository root); falls back to a pinned release when neither
      declares one. Setting both this and `packageManager` makes
      pnpm/action-setup fail with "Multiple versions of pnpm specified".
    required: false
    default: ''
  bun-version:
    description: >
      Bun version to install when the package manager resolves to bun. Leave
      empty (default) to use the `packageManager` field of package.json
      (working directory first, then the repository root); falls back to a
      pinned release when neither declares one.
    required: false
    default: ''
  framework:
    description: >
      Framework of the project: "next" | "nuxt" | "vite" | "auto" (default).
      "auto" detects it from the config files of the working directory
      (next.config.*, nuxt.config.*, otherwise vite). Only sets the
      `framework` and `build-output` outputs.
    required: false
    default: auto
  install:
    description: Run install after setup
    required: false
    default: 'true'
  cache:
    description: >
      Restore and save the package manager's download cache. Set 'false' in a
      job that installs nothing, such as a lockfile audit: it would download
      the whole store for nothing.
    required: false
    default: 'true'

outputs:
  package-manager:
    description: Resolved package manager ("pnpm", "bun" or "npm")
    value: ${{ steps.resolve.outputs.pm }}
  lockfile:
    description: >
      Path of the lockfile the package manager reads (the working directory's,
      else the repository root's for a workspace member), relative to the
      repository root — what the dependency caches are keyed on. Hash it
      (`hashFiles`) to key a cache of your own on the same dependency set.
    value: ${{ steps.resolve.outputs.lockfile }}
  run-command:
    description: >
      Command that runs a package.json script with the resolved package
      manager ("pnpm", "npm run" or "bun run"): word-split it, then add the
      script name.
    value: ${{ steps.resolve.outputs.run-command }}
  audit-command:
    description: Command that audits the lockfile at the high level, e.g. "pnpm audit --audit-level=high"
    value: ${{ steps.resolve.outputs.audit-command }}
  framework:
    description: Resolved framework ("next", "nuxt" or "vite")
    value: ${{ steps.resolve.outputs.framework }}
  build-output:
    description: The framework's build directory, relative to the working directory (".next", ".output" or "dist")
    value: ${{ steps.resolve.outputs.build-output }}
  cache-hit:
    description: Whether the package cache was restored
    value: ${{ steps.cache-pnpm.outputs.cache-hit || steps.cache-bun.outputs.cache-hit || steps.setup-npm.outputs.cache-hit }}

runs:
  using: composite
  steps:

    # ── 1. Resolve package manager ───────────────────────────────────────────
    - name: Resolve package manager
      id: resolve
      shell: bash
      # Inputs go through env, never interpolated into the script body.
      env:
        INPUT_PM: ${{ inputs.package-manager }}
        INPUT_PNPM_VERSION: ${{ inputs.pnpm-version }}
        INPUT_BUN_VERSION: ${{ inputs.bun-version }}
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        DIR: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"

    # ── 2a. Setup pnpm ───────────────────────────────────────────────────────
    - name: Setup pnpm
      if: steps.resolve.outputs.pm == 'pnpm'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ steps.resolve.outputs.pnpm-version }}
        package_json_file: ${{ steps.resolve.outputs.package-json }}

    - name: Setup Node.js (pnpm)
      if: steps.resolve.outputs.pm == 'pnpm'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Get pnpm store path
      if: steps.resolve.outputs.pm == 'pnpm' && inputs.cache == 'true'
      id: pnpm-store
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm cache
      if: steps.resolve.outputs.pm == 'pnpm' && inputs.cache == 'true'
      id: cache-pnpm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles(steps.resolve.outputs.lockfile) }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ inputs.node-version }}-
          pnpm-${{ runner.os }}-

    # ── 2b. Setup bun ────────────────────────────────────────────────────────
    - name: Setup Bun
      if: steps.resolve.outputs.pm == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      with:
        bun-version: ${{ steps.resolve.outputs.bun-version }}

    - name: Setup Node.js (bun)
      if: steps.resolve.outputs.pm == 'bun'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore bun cache
      if: steps.resolve.outputs.pm == 'bun' && inputs.cache == 'true'
      id: cache-bun
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles(steps.resolve.outputs.lockfile) }}
        restore-keys: |
          bun-${{ runner.os }}-

    # ── 2c. Setup npm ────────────────────────────────────────────────────────
    # npm ships with Node.js; setup-node caches ~/.npm keyed on the lockfile.
    - name: Setup Node.js (npm)
      if: steps.resolve.outputs.pm == 'npm'
      id: setup-npm
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        # Off with the cache input: setup-node otherwise caches npm by itself
        # when package.json names npm in packageManager or devEngines.
        package-manager-cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: ${{ steps.resolve.outputs.npm-lockfile }}

    # ── 3. Install dependencies ───────────────────────────────────────────────
    - name: Install (pnpm)
      if: inputs.install == 'true' && steps.resolve.outputs.pm == 'pnpm'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile

    - name: Install (bun)
      if: inputs.install == 'true' && steps.resolve.outputs.pm == 'bun'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile

    - name: Install (npm)
      if: inputs.install == 'true' && steps.resolve.outputs.pm == 'npm'
      shell: bash
      working-directory: ${{ steps.resolve.outputs.npm-dir }}
      run: npm ci
