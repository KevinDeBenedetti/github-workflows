name: Setup Node.js
description: >
  Install Node.js and the right package manager (pnpm, bun or npm),
  restoring the appropriate cache. Auto-detects from lockfile.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'
  working-directory:
    description: Directory to look for lockfile and run install
    required: false
    default: '.'
  package-manager:
    description: >
      Force a package manager: "pnpm" | "bun" | "npm" | "auto" (default).
      "auto" detects from the nearest lockfile (working directory first,
      then the repository root, for workspaces): bun.lockb / bun.lock → bun,
      package-lock.json → npm, otherwise → pnpm.
    required: false
    default: auto
  pnpm-version:
    description: >
      pnpm version to install. Leave empty (default) to use the
      `packageManager` field of package.json (working directory first, then
      the repository root); falls back to the latest release when neither
      declares one. Setting both this and `packageManager` makes
      pnpm/action-setup fail with "Multiple versions of pnpm specified".
    required: false
    default: ''
  install:
    description: Run install after setup
    required: false
    default: 'true'

outputs:
  package-manager:
    description: Resolved package manager ("pnpm", "bun" or "npm")
    value: ${{ steps.resolve.outputs.pm }}
  cache-hit:
    description: Whether the package cache was restored
    value: ${{ steps.cache-pnpm.outputs.cache-hit || steps.cache-bun.outputs.cache-hit || steps.setup-npm.outputs.cache-hit }}

runs:
  using: composite
  steps:

    # ── 1. Resolve package manager ───────────────────────────────────────────
    - name: Resolve package manager
      id: resolve
      shell: bash
      env:
        INPUT_PM: ${{ inputs.package-manager }}
        INPUT_PNPM_VERSION: ${{ inputs.pnpm-version }}
        DIR: ${{ inputs.working-directory }}
      run: |
        # Workspaces (npm, pnpm, bun) keep a single lockfile at the repository
        # root, so a lockfile in the working directory wins, then the root's.
        find_lock() {
          local d n
          for d in "$DIR" "."; do
            for n in "$@"; do
              if [ -f "$d/$n" ]; then echo "$d/$n"; return; fi
            done
          done
        }

        if [ "$INPUT_PM" != "auto" ]; then
          PM="$INPUT_PM"
        else
          case "$(find_lock bun.lockb bun.lock package-lock.json pnpm-lock.yaml)" in
            */bun.lock|*/bun.lockb) PM="bun" ;;
            */package-lock.json)    PM="npm" ;;
            *)                      PM="pnpm" ;;
          esac
        fi
        case "$PM" in
          pnpm|bun|npm) ;;
          *) echo "::error::unsupported package-manager '$PM' (expected pnpm, bun, npm or auto)"; exit 1 ;;
        esac

        # npm: cache and `npm ci` from the lockfile's directory (the workspace
        # root when the working directory is a workspace member).
        NPM_LOCKFILE=""
        NPM_DIR="$DIR"
        if [ "$PM" = "npm" ]; then
          NPM_LOCKFILE="$(find_lock package-lock.json)"
          if [ -z "$NPM_LOCKFILE" ]; then
            echo "::error::package-manager npm needs a package-lock.json in '$DIR' or the repository root"
            exit 1
          fi
          NPM_DIR="$(dirname "$NPM_LOCKFILE")"
        fi

        # pnpm version: explicit input > packageManager field > latest.
        # When packageManager is set, the version input must stay EMPTY and
        # pnpm/action-setup is pointed at that package.json instead.
        PNPM_VERSION="$INPUT_PNPM_VERSION"
        PKG_JSON="package.json"
        if [ "$PM" = "pnpm" ] && [ -z "$PNPM_VERSION" ]; then
          PNPM_VERSION="latest"
          for f in "$DIR/package.json" "package.json"; do
            if [ -f "$f" ] && grep -qE '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' "$f"; then
              PNPM_VERSION=""
              PKG_JSON="${f#./}"
              break
            fi
          done
        fi

        {
          echo "pm=$PM"
          echo "pnpm-version=$PNPM_VERSION"
          echo "package-json=$PKG_JSON"
          echo "npm-lockfile=$NPM_LOCKFILE"
          echo "npm-dir=$NPM_DIR"
        } >> "$GITHUB_OUTPUT"
        echo "📦 Package manager: $PM"
        if [ "$PM" = "pnpm" ]; then
          echo "📌 pnpm version: ${PNPM_VERSION:-from packageManager in $PKG_JSON}"
        fi

    # ── 2a. Setup pnpm ───────────────────────────────────────────────────────
    - name: Setup pnpm
      if: steps.resolve.outputs.pm == 'pnpm'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ steps.resolve.outputs.pnpm-version }}
        package_json_file: ${{ steps.resolve.outputs.package-json }}

    - name: Setup Node.js (pnpm)
      if: steps.resolve.outputs.pm == 'pnpm'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Get pnpm store path
      if: steps.resolve.outputs.pm == 'pnpm'
      id: pnpm-store
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm cache
      if: steps.resolve.outputs.pm == 'pnpm'
      id: cache-pnpm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ inputs.node-version }}-
          pnpm-${{ runner.os }}-

    # ── 2b. Setup bun ────────────────────────────────────────────────────────
    - name: Setup Bun
      if: steps.resolve.outputs.pm == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      with:
        bun-version: latest

    - name: Setup Node.js (bun)
      if: steps.resolve.outputs.pm == 'bun'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore bun cache
      if: steps.resolve.outputs.pm == 'bun'
      id: cache-bun
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles(format('{0}/bun.lock*', inputs.working-directory)) }}
        restore-keys: |
          bun-${{ runner.os }}-

    # ── 2c. Setup npm ────────────────────────────────────────────────────────
    # npm ships with Node.js; setup-node caches ~/.npm keyed on the lockfile.
    - name: Setup Node.js (npm)
      if: steps.resolve.outputs.pm == 'npm'
      id: setup-npm
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ steps.resolve.outputs.npm-lockfile }}

    # ── 3. Install dependencies ───────────────────────────────────────────────
    - name: Install (pnpm)
      if: inputs.install == 'true' && steps.resolve.outputs.pm == 'pnpm'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile

    - name: Install (bun)
      if: inputs.install == 'true' && steps.resolve.outputs.pm == 'bun'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile

    - name: Install (npm)
      if: inputs.install == 'true' && steps.resolve.outputs.pm == 'npm'
      shell: bash
      working-directory: ${{ steps.resolve.outputs.npm-dir }}
      run: npm ci
