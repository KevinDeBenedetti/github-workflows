name: Secret scan
description: >
  Scan the commits a run brings for leaked secrets with Gitleaks, pinned and
  checked against a SHA-256. The scan covers base..HEAD from the change base
  (all fetched history without one) and reads .gitleaks.toml and
  .gitleaksignore from a trusted commit, never from the commits under scan, so
  a change cannot allowlist its own leak. Writes a SARIF report and fails when
  a leak is found. The rules are at the top of secret-scan.sh.

inputs:
  base:
    description: >
      The change base, i.e. the `base` output of the change-base action run
      without fetch-base. Empty scans all fetched history.
    required: false
    default: ''
  ignore-inline-allow:
    description: Ignore inline `gitleaks:allow` comments (gitleaks --ignore-gitleaks-allow)
    required: false
    default: 'false'
  report-path:
    description: SARIF report to write
    required: false
    default: results.sarif

runs:
  using: composite
  steps:
    - name: Install Gitleaks
      shell: bash
      run: | # zizmor: ignore[github-env] -- only appends a $RUNNER_TEMP tool dir to GITHUB_PATH
        # Copy of .github/tools.json, where Renovate bumps it: scripts/update-tool-checksums.py
        # writes the version and its pins here, and CI fails while they differ.
        GITLEAKS_VERSION="8.30.1"
        # SHA-256 of the release asset per architecture, for the version above.
        # Refresh after a version bump: scripts/update-tool-checksums.py
        GITLEAKS_SHA256_amd64="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        GITLEAKS_SHA256_arm64="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
        case "$(uname -m)" in
          x86_64)        ARCH=x64;   KEY=amd64 ;;
          aarch64|arm64) ARCH=arm64; KEY=arm64 ;;
          *) echo "::error::unsupported arch: $(uname -m)"; exit 1 ;;
        esac
        INSTALL_DIR="$RUNNER_TEMP/gitleaks"
        mkdir -p "$INSTALL_DIR"
        # Without --retry-all-errors, a refused or reset connection is not
        # retried.
        curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz" \
          -o "$RUNNER_TEMP/gitleaks.tar.gz"
        if [ "$KEY" = amd64 ]; then WANT="$GITLEAKS_SHA256_amd64"; else WANT="$GITLEAKS_SHA256_arm64"; fi
        echo "$WANT  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict --quiet - \
          || { echo "::error::gitleaks ${GITLEAKS_VERSION} ($(uname -m)) does not match its pinned SHA-256 — after a version bump, run scripts/update-tool-checksums.py"; exit 1; }
        tar xz -C "$INSTALL_DIR" -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Gitleaks
      shell: bash
      # Inputs and event fields go through env, never interpolated into the
      # script body.
      env:
        BASE: ${{ inputs.base }}
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        IGNORE_INLINE_ALLOW: ${{ inputs.ignore-inline-allow }}
        REPORT_PATH: ${{ inputs.report-path }}
      run: bash "$GITHUB_ACTION_PATH/secret-scan.sh"
