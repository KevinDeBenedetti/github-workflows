# prek.toml — https://prek.j178.dev
# install: brew install j178/tap/prek && prek install
# run:     prek run --all-files | update: prek autoupdate

minimum_prek_version = "0.3.0"
fail_fast = false
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
# renovate: datasource=github-tags depName=pre-commit/pre-commit-hooks
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
# renovate: datasource=github-tags depName=rhysd/actionlint
rev = "v1.7.11"
hooks = [
  { id = "actionlint" },
]

# ShellCheck as a Python wheel: the pinned binary, with nothing to install.
# Same version and severity as the CI gate (install-tool's tools.json).
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
# renovate: datasource=github-tags depName=shellcheck-py/shellcheck-py
rev = "v0.11.0.1"
hooks = [
  # *.sh only, like the gate: the .bats files are not ShellCheck's dialect.
  { id = "shellcheck", args = ["--severity=warning"], files = "\\.sh$" },
]

[[repos]]
repo = "https://github.com/renovatebot/pre-commit-hooks"
# renovate: datasource=github-tags depName=renovatebot/pre-commit-hooks
rev = "44.13.1"
hooks = [
  # renovate/default.json too: the shared preset is a config file under another name.
  { id = "renovate-config-validator", files = '(^|/).?renovate(?:rc)?(?:\.json5?)?$|^renovate/[^/]+\.json$' },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-docs-links"
name = "No relative links escaping docs/"
language = "script"
entry = ".github/actions/check-docs-links/check-docs-links.sh"
files = "^docs/.*\\.md$"
pass_filenames = true

[[repos.hooks]]
id = "check-vitepress-md"
name = "No unescaped Vue interpolations in docs/"
language = "script"
entry = ".github/actions/check-vitepress-md/check-vitepress-md.sh"
files = "^docs/.*\\.md$"
pass_filenames = true

[[repos.hooks]]
id = "check-workflow-consistency"
name = "Reusable workflows stay consistent"
language = "python"
entry = "python scripts/check-workflow-consistency.py"
additional_dependencies = ["pyyaml"]
files = "^(\\.github/workflows/.*\\.ya?ml|\\.github/actions/.*/action\\.ya?ml|examples/.*\\.ya?ml|\\.github/release/.*\\.json|README\\.md|docs/getting-started\\.md|docs/(workflows|actions)/.*\\.md)$"
pass_filenames = false

[[repos.hooks]]
id = "check-commit-msg"
name = "Conventional Commits message"
language = "script"
entry = ".github/actions/check-commit-msg/check-commit-msg.sh"
stages = ["commit-msg"]

# The whole suite takes over a minute, so it runs before a push, not on every
# commit, and only when a script, an action or a test is among the commits.
# Needs bats on PATH (brew install bats-core).
[[repos.hooks]]
id = "bats"
name = "Bats tests"
language = "system"
entry = "bats tests/"
files = "^(tests/|scripts/|\\.github/actions/)"
pass_filenames = false
stages = ["pre-push"]
